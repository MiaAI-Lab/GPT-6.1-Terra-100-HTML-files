<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Sunroom</title><style>*{box-sizing:border-box}body{margin:0;background:#f4ead4;color:#644a37;font-family:Georgia,serif}header{padding:25px 5vw;display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{display:grid;grid-template-columns:1fr 1fr;min-height:80vh}.copy{padding:6vw;display:flex;flex-direction:column;justify-content:center}small{font:10px Arial;letter-spacing:.2em;color:#a87452}h1{font-weight:400;font-size:clamp(65px,8vw,115px);line-height:.88;letter-spacing:-.06em;margin:30px 0}p{font:15px/1.8 Arial;color:#9c846d;max-width:320px}button{align-self:start;background:#ba7952;color:white;border:0;padding:17px 24px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.room{position:relative;background:#e8c6a3;overflow:hidden;min-height:600px}.window{position:absolute;top:12%;left:22%;width:56%;height:65%;border-radius:50% 50% 0 0;background:linear-gradient(#a9c3bd,#d5ddd0);border:12px solid #f4e4ca;box-shadow:15px 20px #b77b5a44}.window:before{content:'';position:absolute;left:50%;height:100%;border-left:8px solid #f4e4ca}.window:after{content:'';position:absolute;top:55%;width:100%;border-top:8px solid #f4e4ca}.sun{position:absolute;top:15%;left:20%;width:80px;height:80px;border-radius:50%;background:#f8e3a7}.floor{position:absolute;bottom:0;width:100%;height:18%;background:#c99570}.pot{position:absolute;bottom:12%;right:14%;width:80px;height:70px;background:#b86f4e;border-radius:5px 5px 30px 30px}.leaf{position:absolute;width:22px;height:100px;background:#758e68;border-radius:100% 0;bottom:60px;left:30px;transform:rotate(-35deg)}.leaf:after{content:'';position:absolute;width:22px;height:100px;background:#879d71;border-radius:100% 0;transform:rotate(70deg);left:25px;top:10px}.caption{position:absolute;bottom:25px;left:25px;font:10px Arial;letter-spacing:.15em;color:#fff}@media(max-width:700px){.layout{grid-template-columns:1fr}.room{grid-row:1;min-height:480px}.copy{padding:60px 30px}}</style></head><body><header><span>THE SUNROOM</span><span>A PLACE TO PAUSE &nbsp; ✳</span></header><main class="layout"><section class="copy"><small>THE MORNING IS YOURS</small><h1>Let the<br><i>light</i> in.</h1><p id="thought">An open window, a warm cup, and nowhere in particular to be.</p><button id="next">ANOTHER SMALL PLEASURE ↗</button></section><div class="room"><div class="window"><div class="sun"></div></div><div class="floor"></div><div class="pot"><div class="leaf"></div></div><div class="caption">A ROOM FOR SLOW DAYS / 018</div></div></main><script>const t=['An open window, a warm cup, and nowhere in particular to be.','A favorite song playing softly in the next room.','The first light finding its way across the floor.'];let n=0;document.querySelector('#next').onclick=()=>{n=(n+1)%3;document.querySelector('#thought').textContent=t[n]}</script></body></html>
