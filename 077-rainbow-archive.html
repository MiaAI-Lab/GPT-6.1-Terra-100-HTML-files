<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainbow Archive</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efe5;color:#333538;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.intro{display:flex;justify-content:space-between;align-items:end;margin:50px 0 30px;gap:20px}h1{font-size:clamp(60px,9vw,120px);line-height:.85;letter-spacing:-.08em;margin:0}.intro p{font-size:14px;line-height:1.7;max-width:270px;color:#8a8983}.rainbow{height:50vh;min-height:350px;background:#e7dfce;position:relative;overflow:hidden;display:grid;place-items:end center}.arc{width:70%;aspect-ratio:2/1;border-radius:300px 300px 0 0;background:#cb785f;position:relative}.arc:before{content:'';position:absolute;inset:12% 12% 0;border-radius:300px 300px 0 0;background:#d5ac6d}.arc:after{content:'';position:absolute;inset:25% 25% 0;border-radius:300px 300px 0 0;background:#8aa799}.rainbow.alt{filter:hue-rotate(90deg)}button{background:#3c514b;color:white;border:0;padding:15px 22px;margin-top:25px;font-size:10px;letter-spacing:.15em;cursor:pointer}@media(max-width:600px){.intro{display:block}.intro p{margin-top:20px}.arc{width:95%}}</style></head><body><div class="wrap"><header><span>RAINBOW ARCHIVE</span><span>COLOR STUDY / 077</span></header><div class="intro"><h1>After<br>the rain.</h1><p>An arch of color, a little optimism and a reminder to look up.</p></div><main class="rainbow" id="rainbow"><div class="arc"></div></main><button id="change">CHANGE THE COLORS ↗</button></div><script>document.querySelector('#change').onclick=()=>document.querySelector('#rainbow').classList.toggle('alt')</script></body></html>
