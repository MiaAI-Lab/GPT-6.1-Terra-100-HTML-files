<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Quiet Minute</title><style>*{box-sizing:border-box}body{margin:0;background:#dce3d7;color:#273b31;font-family:Georgia,serif}main{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.text{padding:7vw;display:flex;flex-direction:column;justify-content:space-between}.label{font:10px Arial;letter-spacing:.2em}h1{font-size:clamp(65px,8vw,115px);line-height:.9;letter-spacing:-.06em;font-weight:400;margin:30px 0}p{font:15px/1.7 Arial;color:#65786b;max-width:300px}button{border:1px solid #324c3d;border-radius:40px;background:#324c3d;color:white;padding:17px 25px;cursor:pointer;font:10px Arial;letter-spacing:.15em;margin-top:20px}.visual{background:#a9bba9;display:grid;place-items:center;position:relative;overflow:hidden}.visual:before,.visual:after{content:'';position:absolute;border:1px solid #e2ece077;border-radius:50%;width:70%;aspect-ratio:1}.visual:after{width:90%}.glass{width:180px;height:300px;border-top:3px solid #eef1e4;border-bottom:3px solid #eef1e4;position:relative;z-index:1}.glass:before,.glass:after{content:'';position:absolute;left:15px;width:150px;height:140px;border:2px solid #edf1e4;border-radius:0 0 75px 75px;background:linear-gradient(transparent 60%,#e8d9af 61%)}.glass:after{bottom:0;transform:rotate(180deg)}.time{position:absolute;bottom:35px;font:12px Arial;letter-spacing:.2em}.foot{color:#6f8273}@media(max-width:700px){main{grid-template-columns:1fr}.visual{min-height:460px;grid-row:1}.text{min-height:500px;padding:35px}}</style></head><body><main><section class="text"><div class="label">THE QUIET PRACTICE &nbsp; / &nbsp; 01</div><div><h1>One quiet<br><i>minute.</i></h1><p>Set everything else down. Take a breath and give yourself sixty seconds of space.</p><button id="start">BEGIN A MINUTE &nbsp; ↗</button></div><div class="label foot">A LITTLE SPACE FOR YOURSELF</div></section><section class="visual"><div class="glass" aria-hidden="true"></div><div class="time" id="time" aria-live="polite">01:00</div></section></main><script>let end=0,timer;const display=document.querySelector('#time'),button=document.querySelector('#start');button.onclick=()=>{clearInterval(timer);end=Date.now()+60000;button.textContent='RESTART THE MINUTE  ↗';function tick(){let s=Math.max(0,Math.ceil((end-Date.now())/1000));display.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s){clearInterval(timer);button.textContent='BEGIN AGAIN  ↗'}}tick();timer=setInterval(tick,250)}</script></body></html>
