<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starry Letter</title><style>*{box-sizing:border-box}body{margin:0;background:#20283d;color:#e8e3d8;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.envelope{aspect-ratio:1.4;background:#e4d7c3;position:relative;box-shadow:0 20px 50px #0003;overflow:hidden}.envelope:before{content:'';position:absolute;inset:0;background:#c9bba8;clip-path:polygon(0 0,50% 55%,100% 0)}.envelope:after{content:'✦';position:absolute;left:47%;top:45%;font-size:30px;color:#a67f63}.envelope.open:before{transform:translateY(-60%)}.envelope:before{transition:transform .8s}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#a7b2be;max-width:300px}button{background:none;border:1px solid #aeb8be;color:#e8e3d8;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.envelope{grid-row:1}}</style></head><body><div class="wrap"><header><span>STARRY LETTER</span><span>CORRESPONDENCE / 086</span></header><main class="layout"><section><small>A NOTE FROM FAR AWAY</small><h1>For you,<br>from the<br><i>night.</i></h1><p id="note">A little letter waits beneath the stars.</p><button id="open">OPEN THE LETTER ↗</button></section><div class="envelope" id="envelope"></div></main><footer><span>WITH LOVE FROM ELSEWHERE</span><span>✦ / 01</span></footer></div><script>document.querySelector('#open').onclick=e=>{let o=document.querySelector('#envelope').classList.toggle('open');document.querySelector('#note').textContent=o?'Even the darkest sky has room for a little light.':'A little letter waits beneath the stars.';e.currentTarget.textContent=o?'CLOSE THE LETTER ↙':'OPEN THE LETTER ↗'}</script></body></html>
