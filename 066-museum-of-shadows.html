<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Museum of Shadows</title><style>*{box-sizing:border-box}body{margin:0;background:#d8c9b1;color:#4b4036;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;background:#e8d9c0;position:relative;overflow:hidden}.object{position:absolute;width:30%;height:50%;left:30%;top:25%;border-radius:50% 50% 0 0;background:#c2a88a;box-shadow:80px 40px 0 #8d7d6b55;transition:box-shadow .8s}.art.shift .object{box-shadow:-60px 50px 0 #8d7d6b55}h1{font-size:clamp(65px,8vw,115px);line-height:.87;letter-spacing:-.06em;font-weight:400;margin:25px 0}p{font:14px/1.8 Arial;color:#96846f;max-width:300px}button{background:none;border:1px solid #9a8672;color:#4b4036;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>MUSEUM OF SHADOWS</span><span>LIGHT STUDY / 066</span></header><main class="layout"><div class="art" id="art"><div class="object"></div></div><section><small>AN EXHIBITION OF LIGHT</small><h1>What the<br>light <i>leaves.</i></h1><p>A shape is only half the story. The other half follows the light.</p><button id="move">MOVE THE LIGHT ↗</button></section></main><footer><span>FORM / LIGHT / SHADOW</span><span>OBJECT NO. 01</span></footer></div><script>document.querySelector('#move').onclick=()=>document.querySelector('#art').classList.toggle('shift')</script></body></html>
