<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shape Choir</title><style>*{box-sizing:border-box}body{margin:0;background:#ece8de;color:#282a2b;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.intro{display:flex;justify-content:space-between;align-items:end;margin:50px 0 30px;gap:20px}h1{font-size:clamp(60px,8vw,110px);line-height:.85;letter-spacing:-.08em;margin:0}.intro p{font-size:14px;line-height:1.7;max-width:260px;color:#858784}.stage{height:50vh;min-height:350px;background:#d7cbb4;display:flex;align-items:center;justify-content:space-evenly;overflow:hidden}.shape{width:15%;aspect-ratio:1;background:#d77a61;border:0;cursor:pointer;transition:transform .5s,border-radius .5s}.shape:nth-child(2){background:#7b9b8e;border-radius:50%}.shape:nth-child(3){background:#d9b75e;transform:rotate(45deg)}.shape:nth-child(4){background:#798daa;border-radius:50% 50% 0 0}.shape.on{transform:scale(1.3) rotate(90deg);border-radius:50%}.note{margin-top:25px;font-size:10px;letter-spacing:.15em}@media(max-width:600px){.intro{display:block}.intro p{margin-top:20px}.stage{min-height:280px}}</style></head><body><div class="wrap"><header><span>SHAPE CHOIR</span><span>FORM STUDY / 054</span></header><div class="intro"><h1>Four shapes.<br>One stage.</h1><p>Tap the shapes to make them move. Compose a little visual chorus.</p></div><main class="stage"><button class="shape" aria-label="Transform red shape"></button><button class="shape" aria-label="Transform green shape"></button><button class="shape" aria-label="Transform yellow shape"></button><button class="shape" aria-label="Transform blue shape"></button></main><div class="note">FORM / COLOR / PLAY</div></div><script>document.querySelectorAll('.shape').forEach(s=>s.onclick=()=>s.classList.toggle('on'))</script></body></html>
