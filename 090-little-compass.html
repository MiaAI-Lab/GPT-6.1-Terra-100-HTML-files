<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Compass</title><style>*{box-sizing:border-box}body{margin:0;background:#e4e2d5;color:#44584d;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.center{flex:1;display:grid;place-content:center;text-align:center}.compass{width:250px;height:250px;border:1px solid #7e9987;border-radius:50%;margin:30px auto;display:grid;place-items:center;position:relative}.compass:before{content:'N';position:absolute;top:20px;font:12px Arial}.needle{width:50px;height:150px;background:#78977f;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:transform 1s}h1{font-size:clamp(60px,8vw,110px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.7 Arial;color:#8b9a8b;max-width:300px;margin:20px auto}button{background:#577763;color:white;border:0;padding:15px 22px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.direction{font:italic 20px Georgia;min-height:30px;margin:20px}</style></head><body><div class="wrap"><header><span>LITTLE COMPASS</span><span>FOR WANDERING / 090</span></header><main class="center"><div><small>CHOOSE A DIRECTION</small><h1>Where to<br><i>next?</i></h1><div class="compass"><div class="needle" id="needle"></div></div><button id="turn">FIND A DIRECTION ↗</button><div class="direction" id="direction">Anywhere is a beginning.</div></div></main><footer><span>THE WORLD IS WIDE</span><span>ONE STEP AT A TIME</span></footer></div><script>let n=0;const d=['Toward the morning light.','Along the river.','Past the familiar.','Back to a favorite place.'];document.querySelector('#turn').onclick=()=>{n++;document.querySelector('#needle').style.transform=`rotate(${n*90}deg)`;document.querySelector('#direction').textContent=d[(n-1)%4]}</script></body></html>
