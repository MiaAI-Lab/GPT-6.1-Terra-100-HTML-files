<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organic Wave Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#e2ebe3;color:#31584e;font-family:Arial,sans-serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;background:#add0bd;position:relative;overflow:hidden}.wave{position:absolute;width:150%;height:70%;left:-25%;bottom:-20%;background:#6fa990;border-radius:45% 55% 0 0;animation:flow 6s ease-in-out infinite alternate}.wave:nth-child(2){background:#93bfa4;bottom:-35%;animation-delay:-2s}.wave:nth-child(3){background:#d3e4c8;bottom:-50%;animation-delay:-4s}.paused .wave{animation-play-state:paused}h1{font:400 clamp(65px,8vw,115px)/.87 Georgia;letter-spacing:-.06em;margin:25px 0}p{font-size:14px;line-height:1.8;color:#78998b;max-width:300px}button{background:#4d806a;color:white;border:0;padding:15px 22px;margin-top:20px;font-size:10px;letter-spacing:.15em;cursor:pointer}@keyframes flow{to{transform:rotate(8deg) translateY(-20px);border-radius:60% 40% 0 0}}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}@media(prefers-reduced-motion:reduce){.wave{animation:none}}</style></head><body><div class="wrap"><header><span>ORGANIC WAVE LAB</span><span>FORM STUDY / 100</span></header><main class="layout"><div class="art" id="art"><div class="wave"></div><div class="wave"></div><div class="wave"></div></div><section><small>THE SHAPE OF CHANGE</small><h1>Everything<br>is in <i>motion.</i></h1><p>Three soft forms move together, finding new shapes as they flow.</p><button id="pause">PAUSE THE FLOW &nbsp; Ⅱ</button></section></main><footer><span>FORM / COLOR / MOVEMENT</span><span>THE LAST STUDY / A NEW BEGINNING</span></footer></div><script>document.querySelector('#pause').onclick=e=>{let p=document.querySelector('#art').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE FLOW  ▶':'PAUSE THE FLOW  Ⅱ'}</script></body></html>
