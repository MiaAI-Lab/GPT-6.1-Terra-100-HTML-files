<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rain Window</title><style>*{box-sizing:border-box}body{margin:0;background:#1c2b34;color:#e3e6df;font-family:Georgia,serif}main{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.copy{padding:6vw;display:flex;flex-direction:column;justify-content:space-between}.meta{font:10px Arial;letter-spacing:.2em;display:flex;justify-content:space-between}h1{font-size:clamp(65px,8vw,120px);font-weight:400;line-height:.88;letter-spacing:-.06em;margin:30px 0}p{font:15px/1.8 Arial;color:#a4b6b4;max-width:330px}button{background:none;border:1px solid #b7ccc6;color:#e3e6df;padding:16px 24px;cursor:pointer;font:10px Arial;letter-spacing:.15em;margin-top:20px}.window{position:relative;overflow:hidden;background:linear-gradient(#748b8d,#b2b9ae);border:20px solid #34444a}.window:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 25px,#e6f2ee44 26px 28px,transparent 29px 57px);animation:rain 1s linear infinite}.window:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:12px;background:#34444a;box-shadow:0 0 20px #263a40}.hills{position:absolute;width:140%;height:40%;bottom:-20%;left:-20%;border-radius:50%;background:#5f7773;box-shadow:0 -30px 0 #8ba09a}.caption{position:absolute;bottom:25px;left:25px;font:10px Arial;letter-spacing:.2em}@keyframes rain{to{background-position:0 100px}}.paused:before{animation-play-state:paused}@media(max-width:700px){main{grid-template-columns:1fr}.window{min-height:50vh;grid-row:1}.copy{min-height:450px;padding:35px}}@media(prefers-reduced-motion:reduce){.window:before{animation:none}}</style></head><body><main><section class="copy"><div class="meta"><span>THE RAIN WINDOW</span><span>NO. 022</span></div><div><small class="meta">WEATHER FOR BEING INSIDE</small><h1>Stay a<br>little <i>longer.</i></h1><p>There is nowhere you need to go just now. Watch the rain and let the world soften at the edges.</p><button id="pause">PAUSE THE RAIN &nbsp; Ⅱ</button></div><div class="meta"><span>A QUIET VIEW</span><span>AFTERNOON / 01</span></div></section><div class="window" id="window"><div class="hills"></div><div class="caption">A VIEW FROM HERE</div></div></main><script>document.querySelector('#pause').onclick=e=>{const p=document.querySelector('#window').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE RAIN  ▶':'PAUSE THE RAIN  Ⅱ'}</script></body></html>
