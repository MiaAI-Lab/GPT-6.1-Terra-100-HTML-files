<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest Window</title><style>*{box-sizing:border-box}body{margin:0;background:#dce1d3;color:#3c5544;font-family:Georgia,serif}header{padding:25px 5vw;display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{display:grid;grid-template-columns:1fr 1fr;min-height:80vh}.scene{background:linear-gradient(#a8c0ad,#6d8d75);position:relative;overflow:hidden}.tree{position:absolute;bottom:0;width:14px;height:75%;background:#526e5b;left:20%}.tree:before{content:'';position:absolute;width:160px;height:240px;border-radius:50%;background:#78977c;left:-75px;top:-70px}.tree.b{left:50%;height:85%}.tree.b:before{background:#66886d}.tree.c{left:80%;height:65%}.tree.c:before{background:#8aa789}.window{position:absolute;inset:8%;border:14px solid #e5e9da;box-shadow:0 0 0 15px #708b77}.window:after{content:'';position:absolute;left:50%;height:100%;border-left:10px solid #e5e9da}.copy{padding:6vw;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#83988a;max-width:300px}button{align-self:start;background:#4f735d;color:white;border:0;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.mist{filter:brightness(1.2) saturate(.6)}@media(max-width:700px){.layout{grid-template-columns:1fr}.scene{min-height:50vh}.copy{padding:55px 30px}}</style></head><body><header><span>FOREST WINDOW</span><span>A VIEW / 071</span></header><main class="layout"><div class="scene" id="scene"><div class="tree"></div><div class="tree b"></div><div class="tree c"></div><div class="window"></div></div><section class="copy"><small>TAKE A MOMENT TO LOOK</small><h1>A room<br>with a <i>view.</i></h1><p>Beyond the window, the trees keep their own quiet time.</p><button id="mist">LET THE MIST IN ↗</button></section></main><script>document.querySelector('#mist').onclick=e=>{let m=document.querySelector('#scene').classList.toggle('mist');e.currentTarget.textContent=m?'CLEAR THE MIST ↗':'LET THE MIST IN ↗'}</script></body></html>
