<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Museum</title><style>*{box-sizing:border-box}body{margin:0;background:#dad4c5;color:#302f2b;font-family:Arial,sans-serif}.wrap{padding:30px 4vw}header{display:flex;justify-content:space-between;border-bottom:2px solid;padding-bottom:20px;font-size:10px;letter-spacing:.18em}.title{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:50px 0 25px}h1{font:400 clamp(55px,8vw,110px)/.85 Georgia,serif;letter-spacing:-.06em;margin:0}.title p{max-width:250px;font-size:13px;line-height:1.6;color:#777367}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#f4f1e7;padding:15px;border:0;text-align:left;cursor:pointer;color:inherit}.picture{height:340px;display:grid;place-items:center;overflow:hidden}.one{background:#c97959}.two{background:#9ba998}.three{background:#a7b6c1}.shape{width:45%;aspect-ratio:1;background:#efe2c8;border-radius:50%;box-shadow:15px 15px #5e514433}.two .shape{border-radius:50% 50% 0 0;background:#e9d6ad}.three .shape{border-radius:0;transform:rotate(45deg);background:#f0ddd0}.card strong{display:block;margin:20px 0 5px;font:20px Georgia}.card small{font-size:10px;letter-spacing:.12em;color:#777}.detail{min-height:45px;margin-top:25px;font:italic 18px Georgia;color:#766e60}@media(max-width:700px){.gallery{grid-template-columns:1fr}.picture{height:260px}.title{display:block}.title p{margin-top:25px}}</style></head><body><div class="wrap"><header><span>POCKET MUSEUM</span><span>AN EXHIBITION OF SMALL THINGS / 019</span></header><div class="title"><h1>Objects<br>of <i>attention.</i></h1><p>Three imaginary objects, collected for no reason other than the pleasure of looking.</p></div><main class="gallery"><button class="card" data-note="A sun caught in clay, made for a window that faces west."><div class="picture one"><div class="shape"></div></div><strong>01 / The red room</strong><small>EARTH, LIGHT, MEMORY</small></button><button class="card" data-note="An arch that remembers a doorway long after the house is gone."><div class="picture two"><div class="shape"></div></div><strong>02 / The threshold</strong><small>FORM, SPACE, TIME</small></button><button class="card" data-note="A small blue silence, folded into a square."><div class="picture three"><div class="shape"></div></div><strong>03 / Quiet geometry</strong><small>COLOR, LINE, BALANCE</small></button></main><div class="detail" id="detail" aria-live="polite">Select an object to read its story.</div></div><script>document.querySelectorAll('.card').forEach(c=>c.onclick=()=>document.querySelector('#detail').textContent=c.dataset.note)</script></body></html>
