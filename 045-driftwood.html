<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driftwood</title><style>*{box-sizing:border-box}body{margin:0;background:#e6e1d2;color:#47534d;font-family:Georgia,serif}header{padding:25px 5vw;display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{display:grid;grid-template-columns:1fr 1fr;min-height:80vh}.art{background:#b6c8c3;position:relative;overflow:hidden}.wave{position:absolute;width:150%;height:70%;border-radius:50%;left:-25%;bottom:-45%;background:#d6d9c9;box-shadow:0 -20px #d6d9c966,0 -40px #d6d9c633}.wood{position:absolute;width:65%;height:35px;background:#a39178;border-radius:50%;top:50%;left:20%;transform:rotate(-15deg);box-shadow:0 10px 15px #677e7433}.wood:before{content:'';position:absolute;width:35%;height:20px;background:#a39178;right:10%;top:-8px;transform:rotate(-25deg);border-radius:50%}.art small{position:absolute;bottom:25px;left:25px;font:10px Arial;letter-spacing:.2em}.copy{padding:6vw;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#8a9990;max-width:310px}button{align-self:start;background:none;border:1px solid #8c9c90;padding:15px 22px;margin-top:20px;color:#47534d;cursor:pointer;font:10px Arial;letter-spacing:.15em}@media(max-width:700px){.layout{grid-template-columns:1fr}.art{min-height:50vh}.copy{padding:55px 30px}}</style></head><body><header><span>DRIFTWOOD</span><span>FOUND BY THE SEA / 045</span></header><main class="layout"><div class="art"><div class="wave"></div><div class="wood"></div><small>AN OBJECT WITH A JOURNEY</small></div><section class="copy"><small>THINGS THE WATER LEAVES</small><h1>Every piece<br>has a <i>story.</i></h1><p id="story">Once part of a tree, now shaped by salt, time and a thousand small waves.</p><button id="next">ANOTHER STORY ↗</button></section></main><script>let n=0;const t=['Once part of a tree, now shaped by salt, time and a thousand small waves.','A smooth edge remembers a long journey through moving water.','Found on a quiet shore, carrying a history no one can quite know.'];document.querySelector('#next').onclick=()=>{n=(n+1)%3;document.querySelector('#story').textContent=t[n]}</script></body></html>
