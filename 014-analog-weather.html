<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather for Imaginary Places</title><style>*{box-sizing:border-box}body{margin:0;background:#ead9bd;color:#353226;font-family:Arial,sans-serif}.sheet{margin:3vw;border:2px solid;min-height:88vh;display:grid;grid-template-columns:1fr 1fr}.copy{padding:5vw;display:flex;flex-direction:column;justify-content:space-between}.meta{font-size:10px;letter-spacing:.2em;display:flex;justify-content:space-between}h1{font-family:Georgia,serif;font-size:clamp(58px,7vw,110px);font-weight:400;line-height:.9;letter-spacing:-.06em;margin:30px 0}p{font-size:14px;line-height:1.7;max-width:320px;color:#77705e}button{border:0;background:#39372b;color:white;padding:17px 25px;cursor:pointer;letter-spacing:.13em;font-size:10px}.dial{background:#d98859;display:grid;place-items:center;position:relative;overflow:hidden}.face{width:min(70%,420px);aspect-ratio:1;border:2px solid;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 0 20px #e2a477,0 0 0 22px #353226}.face:before,.face:after{content:'';position:absolute;inset:15%;border:1px dashed #544335;border-radius:50%}.sun{width:35%;aspect-ratio:1;border-radius:50%;background:#f2d38c;box-shadow:0 0 0 20px #efd09655}.needle{position:absolute;width:42%;height:2px;background:#353226;transform-origin:100% 50%;right:50%;transform:rotate(30deg);transition:transform .8s}.dial small{position:absolute;bottom:30px;font-size:10px;letter-spacing:.2em}@media(max-width:700px){.sheet{grid-template-columns:1fr}.dial{min-height:480px;grid-row:1}.copy{min-height:480px;padding:35px}}</style></head><body><main class="sheet"><section class="copy"><div class="meta"><span>IMAGINARY WEATHER BUREAU</span><span>NO. 014</span></div><div><h1>A forecast<br>for <i>elsewhere.</i></h1><p id="forecast">Golden light and a very good chance of doing absolutely nothing.</p><button id="change">ANOTHER FORECAST ↗</button></div><div class="meta"><span>NO INSTRUMENT REQUIRED</span><span id="place">SUNNY ISLAND</span></div></section><div class="dial"><div class="face"><div class="sun"></div><div class="needle" id="needle"></div></div><small>THE ATMOSPHERE IS ENTIRELY YOURS</small></div></main><script>let n=0;const f=['Golden light and a very good chance of doing absolutely nothing.','A passing shower of ideas, followed by a clear afternoon.','Clouds drifting slowly over a sea of possibilities.'],p=['SUNNY ISLAND','IDEA VALLEY','CLOUD COAST'];document.querySelector('#change').onclick=()=>{n=(n+1)%3;document.querySelector('#forecast').textContent=f[n];document.querySelector('#place').textContent=p[n];document.querySelector('#needle').style.transform=`rotate(${30+n*70}deg)`}</script></body></html>
