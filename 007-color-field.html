<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Field</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:#222;font-family:Arial,sans-serif}header{display:flex;justify-content:space-between;padding:25px 4vw;font-size:11px;letter-spacing:.15em;border-bottom:1px solid}.layout{min-height:calc(100vh - 65px);display:grid;grid-template-columns:300px 1fr}.info{padding:45px 35px;border-right:1px solid;display:flex;flex-direction:column}.info small{letter-spacing:.2em;font-size:10px}h1{font-size:64px;line-height:.9;letter-spacing:-.08em;margin:30px 0;font-weight:400}p{font-size:13px;line-height:1.7;color:#777}.info button{margin-top:auto;align-self:start;background:#222;color:white;border:0;padding:17px 23px;cursor:pointer;font-size:10px;letter-spacing:.15em}.canvas{padding:4vw;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:650px}.block{position:relative;transition:background 1s;overflow:hidden}.block span{position:absolute;bottom:20px;left:20px;color:#fff;font-size:10px;letter-spacing:.15em}.block:first-child{background:#e56243}.block:nth-child(2){background:#e8b54e}.block:nth-child(3){background:#789a89}.block:nth-child(4){background:#495c83}.block:after{content:'';position:absolute;width:60%;aspect-ratio:1;border:1px solid #ffffff70;border-radius:50%;right:-10%;top:-15%}.block:nth-child(2):after{border-radius:0;transform:rotate(45deg)}.block:nth-child(3):after{border-radius:50% 50% 0 0;top:30%;right:20%}.block:nth-child(4):after{border-radius:0;width:80%;height:25%;top:38%;right:10%}@media(max-width:700px){.layout{grid-template-columns:1fr}.info{border-right:0;border-bottom:1px solid}.info button{margin-top:20px}.canvas{min-height:500px}.block span{left:10px;bottom:10px;font-size:8px}}</style></head><body><header><span>THE COLOR FIELD</span><span>AN EXERCISE IN SEEING &nbsp; ●</span></header><main class="layout"><section class="info"><small>STUDY / 001—004</small><h1>Color<br>is a<br>feeling.</h1><p>Four shapes, four colors, countless possible relationships. Change the palette and see what shifts.</p><button id="shuffle">CHANGE THE MOOD &nbsp; ↗</button></section><div class="canvas"><div class="block"><span>01 / WARMTH</span></div><div class="block"><span>02 / LIGHT</span></div><div class="block"><span>03 / STILLNESS</span></div><div class="block"><span>04 / DEPTH</span></div></div></main><script>const palettes=[['#e56243','#e8b54e','#789a89','#495c83'],['#b55778','#e6b8aa','#7c8d61','#dcc86c'],['#345c68','#c78158','#d5bb94','#8d9b9a'],['#784b67','#e38657','#d2bc60','#798e8a']];let n=0;document.querySelector('#shuffle').onclick=()=>{n=(n+1)%palettes.length;document.querySelectorAll('.block').forEach((b,i)=>b.style.background=palettes[n][i])}</script></body></html>
