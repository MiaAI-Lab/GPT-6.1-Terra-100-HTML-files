<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celestial Compass</title><style>*{box-sizing:border-box}body{margin:0;background:#172536;color:#e7dbc0;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}header{border-bottom:1px solid #7b8382;padding-bottom:20px}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.compass{aspect-ratio:1;border:1px solid #a6a992;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 30px #172536,inset 0 0 0 31px #6d7a7c}.compass:before{content:'N';position:absolute;top:8%;font:14px Arial}.compass:after{content:'S';position:absolute;bottom:8%;font:14px Arial}.needle{width:30%;height:55%;background:#d7ba85;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transition:transform 1s}.needle:after{content:'';position:absolute;inset:0;background:#a4775c;clip-path:polygon(50% 50%,100% 50%,50% 100%,0 50%)}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#9caeb0;max-width:300px}button{background:none;border:1px solid #cbbd9c;color:#e7dbc0;padding:15px 22px;margin-top:20px;cursor:pointer;font:10px Arial;letter-spacing:.15em}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.compass{max-width:400px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>THE CELESTIAL COMPASS</span><span>AN INSTRUMENT / 043</span></header><main class="layout"><div class="compass"><div class="needle" id="needle"></div></div><section><small>FOR THE CURIOUS TRAVELER</small><h1>Find your<br>own <i>north.</i></h1><p>A compass for imaginary journeys. Turn the needle and choose a direction of your own.</p><button id="turn">TURN THE COMPASS ↗</button></section></main><footer><span>ANYWHERE IS A BEGINNING</span><span>✦ &nbsp; N / S / E / W</span></footer></div><script>let n=0;document.querySelector('#turn').onclick=()=>{n+=90;document.querySelector('#needle').style.transform=`rotate(${n}deg)`}</script></body></html>
