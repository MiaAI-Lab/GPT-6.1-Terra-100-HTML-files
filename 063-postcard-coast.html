<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Postcard Coast</title><style>*{box-sizing:border-box}body{margin:0;background:#c7d7d3;color:#3f5550;font-family:Georgia,serif}.card{max-width:1100px;margin:5vh auto;background:#f8f2e5;padding:20px;box-shadow:0 25px 60px #425b5733}.view{height:50vh;min-height:350px;background:linear-gradient(#abc9c7 0 45%,#6b9f9c 45% 72%,#dfc9a3 72%);position:relative;overflow:hidden}.sun{position:absolute;width:100px;height:100px;background:#f2e2bd;border-radius:50%;top:15%;right:20%}.island{position:absolute;top:40%;left:20%;width:30%;height:15%;background:#78968c;border-radius:100% 100% 0 0}.caption{display:flex;justify-content:space-between;gap:30px;padding:35px 20px}h1{font-size:clamp(50px,7vw,90px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:0}p{font:14px/1.7 Arial;color:#899c91;max-width:300px}button{border:1px solid #8aa298;background:none;color:#3f5550;padding:14px 20px;cursor:pointer;font:10px Arial;letter-spacing:.15em}@media(max-width:700px){.card{margin:0;min-height:100vh}.caption{display:block}.caption p{margin:20px 0}}</style></head><body><main class="card"><div class="view"><div class="sun"></div><div class="island"></div></div><div class="caption"><h1>Wish you<br>were <i>here.</i></h1><div><p id="note">A little coast, a little sunshine, and all the time in the world.</p><button id="change">TURN THE POSTCARD ↗</button><p>POSTCARD / 063 &nbsp; · &nbsp; SOMEWHERE BY THE SEA</p></div></div></main><script>let n=0;const t=['A little coast, a little sunshine, and all the time in the world.','The water is quiet today. I thought you would like the view.'];document.querySelector('#change').onclick=()=>{n=1-n;document.querySelector('#note').textContent=t[n]}</script></body></html>
