<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candlelight</title><style>*{box-sizing:border-box}body{margin:0;background:#28232d;color:#eee3d3;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{height:500px;display:grid;place-items:center;position:relative}.candle{width:120px;height:220px;background:linear-gradient(90deg,#d0b9a4,#f2e4d1,#c3ab98);border-radius:10px 10px 4px 4px;position:relative;margin-top:120px}.flame{position:absolute;width:40px;height:70px;left:40px;top:-85px;background:#f3c77e;border-radius:50% 50% 50% 10%;transform:rotate(45deg);box-shadow:0 0 60px 25px #e9aa6055;animation:flicker 2s ease-in-out infinite alternate}.off{opacity:0}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#aaa1a2;max-width:300px}button{background:none;border:1px solid #b7a999;color:#eee3d3;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@keyframes flicker{to{transform:rotate(50deg) scale(.9,1.1)}}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:40px 0}.art{grid-row:1;height:400px}}@media(prefers-reduced-motion:reduce){.flame{animation:none}}</style></head><body><div class="wrap"><header><span>CANDLELIGHT</span><span>THE QUIET HOUR / 083</span></header><main class="layout"><section><small>A LITTLE LIGHT FOR THE EVENING</small><h1>Let the<br>day grow<br><i>quiet.</i></h1><p>One small flame, one slow breath, and the evening can begin.</p><button id="toggle">BLOW OUT THE CANDLE ↗</button></section><div class="art"><div class="candle"><div class="flame" id="flame"></div></div></div></main><footer><span>LIGHT / WARMTH / TIME</span><span>GOOD EVENING</span></footer></div><script>document.querySelector('#toggle').onclick=e=>{let off=document.querySelector('#flame').classList.toggle('off');e.currentTarget.textContent=off?'LIGHT THE CANDLE ↗':'BLOW OUT THE CANDLE ↗'}</script></body></html>
