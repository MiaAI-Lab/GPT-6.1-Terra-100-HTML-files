<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iceberg</title><style>*{box-sizing:border-box}body{margin:0;background:#d8e5e7;color:#39535d;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.scene{flex:1;min-height:550px;position:relative;overflow:hidden;margin:30px 0;background:linear-gradient(#c3dadd 0 48%,#6a9aa4 48% 100%)}.ice{position:absolute;left:35%;top:25%;width:35%;height:55%;background:linear-gradient(#f5f5e9 0 42%,#b6d4d4 42%);clip-path:polygon(0 42%,20% 25%,45% 0,65% 30%,100% 42%,75% 100%,35% 85%);transition:transform .8s}.ice.move{transform:translateX(50px)}.copy{position:absolute;top:10%;left:5%}h1{font-size:clamp(60px,8vw,110px);line-height:.87;letter-spacing:-.06em;font-weight:400;margin:25px 0}p{font:14px/1.7 Arial;max-width:270px;color:#627f87}button{background:#507b83;color:white;border:0;padding:15px 22px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:600px){.scene{min-height:70vh}.ice{left:50%;width:45%;top:40%}.copy{padding:10px}}</style></head><body><div class="wrap"><header><span>ICEBERG</span><span>BELOW THE SURFACE / 078</span></header><main class="scene"><div class="ice" id="ice"></div><div class="copy"><small>MORE THAN MEETS THE EYE</small><h1>There is<br>always <i>more.</i></h1><p>What we see above the surface is only one part of the story.</p><button id="drift">LET IT DRIFT ↗</button></div></main><footer><span>ICE / WATER / SPACE</span><span>AN IMAGINED LANDSCAPE</span></footer></div><script>document.querySelector('#drift').onclick=()=>document.querySelector('#ice').classList.toggle('move')</script></body></html>
