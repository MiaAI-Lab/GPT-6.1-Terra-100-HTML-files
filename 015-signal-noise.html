<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal / Noise</title><style>*{box-sizing:border-box}body{margin:0;background:#10110f;color:#dfedb5;font-family:monospace}.frame{padding:25px 4vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.15em}header{border-bottom:1px solid #728252;padding-bottom:20px}.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:center}.copy h1{font:900 clamp(64px,9vw,140px)/.8 Arial,sans-serif;letter-spacing:-.08em;margin:25px 0}.copy p{color:#8da071;max-width:300px;line-height:1.7}.copy small{letter-spacing:.2em}.scope{aspect-ratio:1;background:repeating-linear-gradient(0deg,transparent 0 9%,#79925222 9.2% 9.4%),repeating-linear-gradient(90deg,transparent 0 9%,#79925222 9.2% 9.4%);border:1px solid #839659;position:relative;display:grid;place-items:center;overflow:hidden}.wave{width:80%;height:30%;border:2px solid #d8f4a6;border-radius:50%;box-shadow:0 0 20px #cfff76;animation:pulse 2s ease-in-out infinite alternate}.scope:before,.scope:after{content:'';position:absolute;width:80%;height:30%;border:1px solid #a8df72;border-radius:50%;transform:rotate(40deg)}.scope:after{transform:rotate(-40deg)}.scope span{position:absolute;top:20px;left:20px;font-size:10px;letter-spacing:.15em}button{margin-top:25px;background:#d7eab0;color:#10110f;border:0;padding:15px 25px;font:11px monospace;cursor:pointer}@keyframes pulse{to{transform:scale(.7,1.5)}}@media(max-width:700px){.grid{grid-template-columns:1fr;padding:40px 0}.scope{grid-row:1}.copy h1{font-size:80px}}@media(prefers-reduced-motion:reduce){.wave{animation:none}}</style></head><body><div class="frame"><header><span>◉ SIGNAL / NOISE</span><span>RECEIVER 015</span></header><main class="grid"><section class="copy"><small>FREQUENCY / 000.01</small><h1>FIND<br>THE<br>SIGNAL.</h1><p>Somewhere in the static, a pattern is waiting. Change the frequency and watch the shape respond.</p><button id="tune">TUNE FREQUENCY →</button></section><div class="scope"><span>OSCILLOSCOPE / LIVE</span><div class="wave" id="wave"></div></div></main><footer><span>AN EXPERIMENT IN ATTENTION</span><span id="freq">FREQ 01</span></footer></div><script>let n=0;document.querySelector('#tune').onclick=()=>{n=(n+1)%4;document.querySelector('#wave').style.animationDuration=(1+n*.8)+'s';document.querySelector('#freq').textContent='FREQ 0'+(n+1)}</script></body></html>
