<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copper Orbit</title><style>*{box-sizing:border-box}body{margin:0;background:#231e1a;color:#e9d8bd;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;position:relative;display:grid;place-items:center}.ring{position:absolute;width:70%;height:30%;border:3px solid #c98c62;border-radius:50%;transform:rotate(35deg);box-shadow:0 0 20px #b9784c44}.ring:nth-child(2){transform:rotate(-35deg)}.ring:nth-child(3){transform:rotate(90deg)}.sphere{width:25%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f3d2a0,#b46e4b 70%,#633d32);box-shadow:0 0 60px #b8794e55;transition:transform .8s}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#a99885;max-width:300px}button{background:none;color:#e9d8bd;border:1px solid #a9896c;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{grid-row:1}}</style></head><body><div class="wrap"><header><span>COPPER ORBIT</span><span>FORM STUDY / 059</span></header><main class="layout"><section><small>OBJECTS IN BALANCE</small><h1>Circles<br>around<br>a <i>center.</i></h1><p>A simple study in paths, gravity and the quiet beauty of a shared point.</p><button id="turn">SHIFT THE CENTER ↗</button></section><div class="art"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="sphere" id="sphere"></div></div></main><footer><span>FORM / MOTION / SPACE</span><span>ONE OBJECT / THREE PATHS</span></footer></div><script>let on=false;document.querySelector('#turn').onclick=()=>{on=!on;document.querySelector('#sphere').style.transform=on?'translate(25px,-25px)':'none'}</script></body></html>
