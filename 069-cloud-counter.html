<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Counter</title><style>*{box-sizing:border-box}body{margin:0;background:#cbdde0;color:#435c68;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.center{flex:1;display:grid;place-content:center;text-align:center}h1{font-size:clamp(60px,8vw,110px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}.cloud{width:250px;height:90px;background:#f5f7ee;border-radius:50px;margin:70px auto 40px;position:relative;box-shadow:0 15px 25px #758f9c33}.cloud:before,.cloud:after{content:'';position:absolute;background:#f5f7ee;border-radius:50%;width:110px;height:110px;top:-45px;left:35px}.cloud:after{width:140px;height:140px;top:-65px;left:100px}.count{font-size:40px;margin:20px}button{background:#557987;color:white;border:0;padding:15px 22px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.reset{background:none;color:#557987;border:1px solid #88a6ad;margin-left:10px}@media(max-width:600px){.cloud{transform:scale(.8)}}</style></head><body><div class="wrap"><header><span>CLOUD COUNTER</span><span>SKY STUDY / 069</span></header><main class="center"><div><small>NOTICE THE SKY</small><h1>Count the<br><i>clouds.</i></h1><div class="cloud"></div><div class="count" id="count">0</div><button id="add">ONE MORE CLOUD +</button><button class="reset" id="reset">RESET ↺</button></div></main><footer><span>AN EXERCISE IN LOOKING UP</span><span>SKY / CLOUD / TIME</span></footer></div><script>let n=0;const c=document.querySelector('#count');document.querySelector('#add').onclick=()=>c.textContent=++n;document.querySelector('#reset').onclick=()=>{n=0;c.textContent=n}</script></body></html>
