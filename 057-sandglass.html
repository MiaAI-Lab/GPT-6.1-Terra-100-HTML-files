<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sandglass</title><style>*{box-sizing:border-box}body{margin:0;background:#d4b89e;color:#4e3d35;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center}.glass{width:240px;height:360px;border-top:10px solid #80604f;border-bottom:10px solid #80604f;margin:auto;position:relative;transition:transform 1s}.glass:before,.glass:after{content:'';position:absolute;left:20px;width:200px;height:160px;border:3px solid #f1e4d0;border-radius:0 0 100px 100px;background:linear-gradient(transparent 60%,#e9d3a6 61%)}.glass:after{bottom:0;transform:rotate(180deg)}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#866c5c;max-width:300px}button{background:#6a5042;color:#fff;border:0;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:60px 0;gap:50px}.glass{grid-row:1}}</style></head><body><div class="wrap"><header><span>SANDGLASS</span><span>OBJECT STUDY / 057</span></header><main class="layout"><section><small>THE SHAPE OF TIME</small><h1>Turn the<br>moment <i>over.</i></h1><p>A small object for watching time pass, one grain at a time.</p><button id="turn">TURN THE GLASS ↗</button></section><div class="glass" id="glass"></div></main><footer><span>TIME / SAND / SPACE</span><span>AN OBJECT TO CONTEMPLATE</span></footer></div><script>let n=0;document.querySelector('#turn').onclick=()=>{n+=180;document.querySelector('#glass').style.transform=`rotate(${n}deg)`}</script></body></html>
