<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee Orbit</title><style>*{box-sizing:border-box}body{margin:0;background:#eadbc7;color:#624b3c;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;background:#c9a98d;display:grid;place-items:center}.plate{width:70%;aspect-ratio:1;border-radius:50%;background:#f0e3d2;display:grid;place-items:center;box-shadow:10px 15px #9d806c44}.cup{width:50%;aspect-ratio:1;border-radius:50%;background:#6e4939;border:18px solid #fbf2e6;box-shadow:0 0 0 2px #d3c1ae}.cup:after{content:'';display:block;width:35px;height:35px;border:10px solid #fbf2e6;border-radius:50%;transform:translate(120px,40px)}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#a38873;max-width:300px}button{background:#765340;color:white;border:0;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>COFFEE ORBIT</span><span>MORNING RITUAL / 079</span></header><main class="layout"><div class="art"><div class="plate"><div class="cup"></div></div></div><section><small>THE DAY STARTS HERE</small><h1>One cup.<br>All the <i>time.</i></h1><p id="note">Let the first sip be the only thing you need to do right now.</p><button id="next">ANOTHER MORNING THOUGHT ↗</button></section></main><footer><span>COFFEE / LIGHT / TIME</span><span>GOOD MORNING</span></footer></div><script>let n=0;const t=['Let the first sip be the only thing you need to do right now.','There is room for a slower start.','A warm cup makes a small place to pause.'];document.querySelector('#next').onclick=()=>{n=(n+1)%3;document.querySelector('#note').textContent=t[n]}</script></body></html>
