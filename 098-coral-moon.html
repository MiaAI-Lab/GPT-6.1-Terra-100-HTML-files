<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coral Moon</title><style>*{box-sizing:border-box}body{margin:0;background:#f0d0bd;color:#834f49;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;background:#cd8173;display:grid;place-items:center;position:relative}.moon{width:55%;aspect-ratio:1;border-radius:50%;background:#f5dbb7;box-shadow:0 0 0 30px #edb69a66;transition:clip-path .8s}.art small{position:absolute;bottom:25px;left:25px;font:10px Arial;letter-spacing:.2em}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#ae7d71;max-width:300px}button{background:none;border:1px solid #ad786d;color:#834f49;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>CORAL MOON</span><span>COLOR STUDY / 098</span></header><main class="layout"><div class="art"><div class="moon" id="moon"></div><small>MOON / COLOR / FORM</small></div><section><small>A DIFFERENT KIND OF NIGHT</small><h1>The moon<br>in <i>coral.</i></h1><p>A familiar circle takes on the warmth of a late summer evening.</p><button id="phase">CHANGE THE PHASE ↗</button></section></main><footer><span>AN ABSTRACT MOON</span><span>LIGHT / SHADOW / COLOR</span></footer></div><script>let n=0;const p=['inset(0)','inset(0 0 0 45%)','inset(0 45% 0 0)'];document.querySelector('#phase').onclick=()=>{n=(n+1)%3;document.querySelector('#moon').style.clipPath=p[n]}</script></body></html>
