<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moss & Stone</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e8da;color:#354637;font-family:Georgia,serif}header{padding:25px 5vw;display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}main{padding:3vw 5vw 5vw;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}.art{background:#aab5a0;min-height:650px;position:relative;overflow:hidden}.stone{position:absolute;border-radius:50%;box-shadow:inset -20px -20px 40px #52635666,0 15px 20px #53634e33}.a{width:55%;height:26%;background:#7d8e78;bottom:12%;left:20%}.b{width:47%;height:24%;background:#d0d1bd;bottom:34%;left:24%}.c{width:35%;height:21%;background:#72866e;bottom:55%;left:30%}.art:after{content:'FIELD STUDY  /  03';position:absolute;bottom:25px;left:25px;font:10px Arial;letter-spacing:.2em;color:#e8eddf}.eyebrow{font:10px Arial;letter-spacing:.2em}h1{font-weight:400;font-size:clamp(65px,8vw,115px);letter-spacing:-.06em;line-height:.88;margin:30px 0}p{font:15px/1.8 Arial;color:#758475;max-width:340px}button{margin-top:25px;border:1px solid #576e59;border-radius:50px;background:none;padding:15px 24px;color:#354637;cursor:pointer;letter-spacing:.1em;font-size:10px}#thought{min-height:50px}@media(max-width:700px){main{grid-template-columns:1fr}.art{min-height:470px}article{padding:40px 0}}</style></head><body><header><span>MOSS & STONE</span><span>THE ART OF ENOUGH &nbsp; ◌</span></header><main><div class="art" role="img" aria-label="Three balanced stones"><div class="stone a"></div><div class="stone b"></div><div class="stone c"></div></div><article><span class="eyebrow">A PRACTICE IN BALANCE</span><h1>Less, but<br><i>better.</i></h1><p>Notice the weight of things. Make room for what matters. Let the rest settle.</p><button id="next">A SMALL THOUGHT &nbsp; ↗</button><p id="thought" aria-live="polite"></p></article></main><script>const thoughts=['Take the longer breath.','Leave a little room around the day.','You are allowed to move slowly.'];let n=0;document.querySelector('#next').onclick=()=>{document.querySelector('#thought').textContent=thoughts[n++%thoughts.length]}</script></body></html>
