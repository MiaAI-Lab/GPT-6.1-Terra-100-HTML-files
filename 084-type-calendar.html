<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Today Is</title><style>*{box-sizing:border-box}body{margin:0;background:#f2e9d4;color:#2f3f3a;font-family:Arial,sans-serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}header{border-bottom:2px solid;padding-bottom:20px}.center{flex:1;display:flex;flex-direction:column;justify-content:center}.label{font-size:11px;letter-spacing:.2em}.day{font-size:clamp(100px,25vw,350px);font-weight:900;line-height:.75;letter-spacing:-.1em;color:#d57e5e}.month{font:400 clamp(50px,8vw,100px)/1 Georgia;letter-spacing:-.06em;margin-top:25px}.note{font-size:14px;line-height:1.7;color:#859185;max-width:300px;margin-top:25px}.rule{height:1px;background:#81978a;margin:35px 0}@media(max-width:600px){.day{font-size:35vw}}</style></head><body><div class="wrap"><header><span>TODAY IS</span><span>A DAILY TYPE STUDY / 084</span></header><main class="center"><div class="label">THE DATE, WHERE YOU ARE</div><div class="rule"></div><div class="day" id="day">01</div><div class="month" id="month">January</div><p class="note">A new page in the calendar. A good place to begin again.</p></main><footer><span id="weekday">TODAY</span><span>ONE DAY AT A TIME</span></footer></div><script>function tick(){let d=new Date();document.querySelector('#day').textContent=String(d.getDate()).padStart(2,'0');document.querySelector('#month').textContent=d.toLocaleDateString([],{month:'long',year:'numeric'});document.querySelector('#weekday').textContent=d.toLocaleDateString([],{weekday:'long'}).toUpperCase()}tick();setInterval(tick,60000)</script></body></html>
