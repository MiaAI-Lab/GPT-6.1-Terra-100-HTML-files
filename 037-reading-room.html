<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Reading Room</title><style>*{box-sizing:border-box}body{margin:0;background:#2e3c35;color:#ebe9d9;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh}header{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em;border-bottom:1px solid #829486;padding-bottom:20px}.title{text-align:center;padding:65px 0 45px}h1{font-size:clamp(65px,10vw,130px);font-weight:400;line-height:.85;letter-spacing:-.06em;margin:25px 0}.title p{font:14px Arial;color:#a8b8a8}.shelf{display:flex;align-items:end;justify-content:center;gap:12px;min-height:300px;border-bottom:12px solid #a6825e;padding:0 20px}.book{width:clamp(50px,10vw,110px);height:250px;border:0;border-radius:3px 7px 0 0;background:#bd7859;color:#f5e4c9;cursor:pointer;writing-mode:vertical-rl;text-align:left;padding:20px;font:12px Georgia;letter-spacing:.08em;box-shadow:inset 5px 0 #ffffff22}.book:nth-child(2){height:290px;background:#d2ad76}.book:nth-child(3){height:220px;background:#728a79}.book:nth-child(4){height:270px;background:#a35f5a}.note{text-align:center;padding:35px;font:italic 20px Georgia;color:#b8c6b6;min-height:90px}@media(max-width:600px){.shelf{gap:6px}.book{padding:12px;height:180px}.book:nth-child(2){height:220px}.book:nth-child(3){height:160px}.book:nth-child(4){height:200px}}</style></head><body><div class="wrap"><header><span>THE READING ROOM</span><span>A SHELF OF IDEAS / 037</span></header><div class="title"><small>MAKE YOURSELF COMFORTABLE</small><h1>A place<br>for <i>pages.</i></h1><p>Choose a book and open a little possibility.</p></div><main class="shelf"><button class="book" data-note="A book about finding wonder in the familiar.">THE ART OF NOTICING</button><button class="book" data-note="A collection of places that exist only in the mind.">AN ATLAS OF ELSEWHERE</button><button class="book" data-note="A field guide to the quiet hours of the day.">SMALL HOURS</button><button class="book" data-note="A story about taking the scenic route home.">THE LONG WAY</button></main><div class="note" id="note" aria-live="polite">Select a book from the shelf.</div></div><script>document.querySelectorAll('.book').forEach(b=>b.onclick=()=>document.querySelector('#note').textContent=b.dataset.note)</script></body></html>
