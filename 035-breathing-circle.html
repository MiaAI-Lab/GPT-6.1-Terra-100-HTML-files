<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breathing Circle</title><style>*{box-sizing:border-box}body{margin:0;background:#d7e2dd;color:#35534e;font-family:Arial,sans-serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.center{flex:1;display:grid;place-content:center;text-align:center}h1{font:400 clamp(50px,7vw,90px)/.9 Georgia;letter-spacing:-.05em;margin:30px 0}.circle{width:min(45vw,300px);aspect-ratio:1;border-radius:50%;margin:30px auto;background:radial-gradient(circle,#eff5e9,#9ec0b1);box-shadow:0 0 0 30px #9cbdae33,0 0 0 60px #9cbdae22;animation:breathe 8s ease-in-out infinite}.word{font-size:10px;letter-spacing:.25em;margin:35px}button{background:none;border:1px solid #6d9186;color:#35534e;padding:14px 22px;font-size:10px;letter-spacing:.15em;cursor:pointer}@keyframes breathe{0%,100%{transform:scale(.75)}50%{transform:scale(1)}}.paused{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.circle{animation:none}}</style></head><body><div class="wrap"><header><span>THE BREATHING CIRCLE</span><span>A MOMENT / 035</span></header><main class="center"><div><small>FOLLOW YOUR OWN PACE</small><h1>Take a breath.</h1><div class="circle" id="circle"></div><div class="word">INHALE &nbsp; / &nbsp; EXHALE</div><button id="toggle">PAUSE MOTION &nbsp; Ⅱ</button></div></main><footer><span>YOU ARE HERE</span><span>ONE MOMENT AT A TIME</span></footer></div><script>document.querySelector('#toggle').onclick=e=>{let p=document.querySelector('#circle').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME MOTION  ▶':'PAUSE MOTION  Ⅱ'}</script></body></html>
