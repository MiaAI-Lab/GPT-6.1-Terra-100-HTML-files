<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constellation Maker</title><style>*{box-sizing:border-box}body{margin:0;background:#0d172b;color:#e8e2d2;font-family:Arial,sans-serif}header{display:flex;justify-content:space-between;padding:25px 4vw;font-size:10px;letter-spacing:.2em;border-bottom:1px solid #6a7787}.intro{padding:35px 4vw;display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font:400 clamp(45px,7vw,90px)/.9 Georgia;letter-spacing:-.05em;margin:0}p{font-size:13px;line-height:1.6;color:#a4afbc;max-width:280px}.sky{margin:0 4vw;height:55vh;min-height:300px;border:1px solid #52617b;background:radial-gradient(ellipse at 50% 80%,#243859,#101a30 70%);position:relative;cursor:crosshair;overflow:hidden}.sky:before{content:'✦        ·       ✧          ·       ✦        ·       ✧';position:absolute;inset:15% 5%;color:#7d90aa;word-spacing:3vw;line-height:8}.star{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff5d8;box-shadow:0 0 12px #fff6d3;transform:translate(-50%,-50%)}footer{display:flex;justify-content:space-between;align-items:center;margin:20px 4vw 40px;font-size:10px;letter-spacing:.15em}button{background:none;border:1px solid #a5b5c4;color:#e8e2d2;padding:14px 20px;cursor:pointer;font-size:10px;letter-spacing:.15em}@media(max-width:600px){.intro{display:block}.intro p{margin-top:20px}}</style></head><body><header><span>THE CONSTELLATION MAKER</span><span>AN OPEN SKY / 024</span></header><div class="intro"><h1>Make your<br>own <i>night sky.</i></h1><p>Tap the sky to place a star. Make a pattern that belongs only to you.</p></div><main class="sky" id="sky" aria-label="Click or tap to add stars"></main><footer><span id="count">0 STARS PLACED</span><button id="clear">CLEAR THE SKY ↗</button></footer><script>let n=0;const sky=document.querySelector('#sky'),count=document.querySelector('#count');sky.onclick=e=>{let r=sky.getBoundingClientRect(),s=document.createElement('span');s.className='star';s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';sky.appendChild(s);count.textContent=++n+' STARS PLACED'};document.querySelector('#clear').onclick=()=>{sky.querySelectorAll('.star').forEach(s=>s.remove());n=0;count.textContent='0 STARS PLACED'}</script></body></html>
