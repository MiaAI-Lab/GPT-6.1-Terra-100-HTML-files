<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desert Signal</title><style>*{box-sizing:border-box}body{margin:0;background:#1c2222;color:#eddfc6;font-family:Arial,sans-serif}.frame{min-height:100vh;padding:30px 4vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;text-transform:uppercase}header{border-bottom:1px solid #89918a;padding-bottom:20px}.scene{flex:1;position:relative;overflow:hidden;background:linear-gradient(#263c40,#b97f62 65%,#d59b6b);margin:30px 0;min-height:600px}.sun{position:absolute;width:220px;aspect-ratio:1;border-radius:50%;background:#f1c788;left:50%;top:19%;transform:translateX(-50%);box-shadow:0 0 80px #e7b87980}.dune{position:absolute;width:140%;height:50%;border-radius:50% 50% 0 0;bottom:-25%;left:-20%;background:#a15f4d;transform:rotate(-7deg)}.dune.two{background:#764a40;bottom:-34%;transform:rotate(9deg);left:-5%}.dune.three{background:#463b36;bottom:-42%;transform:rotate(-3deg);left:-10%}.copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}.copy small{font-size:10px;letter-spacing:.3em}h1{font-family:Georgia,serif;font-size:clamp(68px,10vw,140px);font-weight:400;line-height:.85;letter-spacing:-.06em;margin:25px 0;text-shadow:0 3px 30px #724f3c}p{font-size:12px;letter-spacing:.08em;line-height:1.8;max-width:270px}button{background:none;border:1px solid #f1dfc6;color:#fff4de;padding:15px 23px;font-size:10px;letter-spacing:.2em;cursor:pointer;margin-top:20px}.signal{position:absolute;right:30px;top:30px;font-size:10px;letter-spacing:.15em;line-height:1.8}.night .scene{filter:hue-rotate(75deg) brightness(.7)}.scene{transition:filter 1.5s}@media(max-width:600px){.scene{min-height:70vh}.sun{width:160px}footer{gap:15px;font-size:8px}}</style></head><body><div class="frame"><header><span>DESERT SIGNAL</span><span>AN EXPEDITION IN STILLNESS</span></header><main class="scene"><div class="sun"></div><div class="dune"></div><div class="dune two"></div><div class="dune three"></div><div class="signal">TRANSMISSION<br>● LIVE / 00.01</div><div class="copy"><small>THE SPACE BETWEEN THINGS</small><h1>Far from<br>the noise.</h1><p>A moment of quiet, somewhere beyond the familiar.</p><button id="change">WATCH THE LIGHT CHANGE</button></div></main><footer><span>COORDINATES UNKNOWN</span><span>TAKE YOUR TIME &nbsp; ↗</span></footer></div><script>document.querySelector('#change').onclick=e=>{const on=document.body.classList.toggle('night');e.currentTarget.textContent=on?'RETURN TO DAYLIGHT':'WATCH THE LIGHT CHANGE'}</script></body></html>
