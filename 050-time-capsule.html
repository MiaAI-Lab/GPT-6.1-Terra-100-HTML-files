<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Capsule</title><style>*{box-sizing:border-box}body{margin:0;background:#d0bfa8;color:#514238;font-family:Georgia,serif}.sheet{max-width:1000px;margin:5vh auto;background:#f5ecdd;min-height:90vh;padding:5vw;box-shadow:0 25px 60px #62504344}header{display:flex;justify-content:space-between;border-bottom:1px solid #bca991;padding-bottom:20px;font:10px Arial;letter-spacing:.2em}.layout{display:grid;grid-template-columns:1fr 1fr;gap:5vw;margin-top:60px}h1{font-size:clamp(60px,7vw,100px);line-height:.87;letter-spacing:-.06em;font-weight:400;margin:25px 0}p{font:14px/1.8 Arial;color:#9c8977;max-width:300px}label{display:block;font:10px Arial;letter-spacing:.15em;margin:20px 0 10px}input,textarea{width:100%;border:0;border-bottom:1px solid #baa792;background:transparent;padding:12px 0;color:#514238;font:18px Georgia;outline:none}textarea{height:160px;resize:vertical}button{background:#8b6a53;color:white;border:0;padding:15px 22px;margin-top:25px;cursor:pointer;font:10px Arial;letter-spacing:.15em}.status{font:12px Arial;min-height:20px}@media(max-width:700px){.sheet{margin:0;min-height:100vh;padding:30px}.layout{grid-template-columns:1fr;margin-top:40px}}</style></head><body><main class="sheet"><header><span>THE TIME CAPSULE</span><span>AN OBJECT FOR LATER / 050</span></header><div class="layout"><section><small>A NOTE ACROSS TIME</small><h1>Remember<br>this <i>moment.</i></h1><p>Collect a small detail from today. Save it here and return to it whenever you like.</p></section><section><label for="title">TODAY'S TITLE</label><input id="title" placeholder="A small moment"><label for="memory">WHAT DO YOU WANT TO REMEMBER?</label><textarea id="memory" placeholder="Write it here..."></textarea><button id="save">SEAL THE CAPSULE ↗</button><p class="status" id="status" aria-live="polite"></p></section></div></main><script>const a=document.querySelector('#title'),b=document.querySelector('#memory');try{let x=JSON.parse(localStorage.getItem('time-capsule')||'{}');a.value=x.title||'';b.value=x.memory||''}catch(e){}document.querySelector('#save').onclick=()=>{try{localStorage.setItem('time-capsule',JSON.stringify({title:a.value,memory:b.value}));document.querySelector('#status').textContent='Saved in this browser.'}catch(e){document.querySelector('#status').textContent='Saving is unavailable in this browser.'}}</script></body></html>
