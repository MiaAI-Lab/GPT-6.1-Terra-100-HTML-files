<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Sunrise</title><style>*{box-sizing:border-box}body{margin:0;background:#f5e6cf;color:#794d42;font-family:Georgia,serif}header{padding:25px 5vw;display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.scene{height:60vh;min-height:400px;margin:0 5vw;position:relative;overflow:hidden;background:#efbc9c}.sun{position:absolute;width:200px;height:200px;background:#f9d893;border-radius:50%;top:12%;left:50%;transform:translateX(-50%);transition:top 1s}.hill{position:absolute;width:130%;height:60%;border-radius:50% 50% 0 0;bottom:-35%;left:-30%;background:#df997f;box-shadow:0 -6px 15px #955b4d22}.hill.b{left:10%;bottom:-40%;background:#bd756a}.hill.c{left:-5%;bottom:-48%;background:#8f5b59}.caption{position:absolute;top:25px;left:25px;font:10px Arial;letter-spacing:.2em}.copy{padding:40px 5vw;display:flex;justify-content:space-between;align-items:center;gap:30px}h1{font-size:clamp(48px,7vw,90px);font-weight:400;line-height:.9;letter-spacing:-.06em;margin:0}p{font:14px/1.7 Arial;max-width:280px}button{border:1px solid #9c6e5b;background:none;color:#794d42;padding:14px 20px;cursor:pointer;font:10px Arial;letter-spacing:.15em}@media(max-width:700px){.copy{display:block}.copy p{margin:20px 0}}</style></head><body><header><span>PAPER SUNRISE</span><span>LANDSCAPE NO. 036</span></header><main><div class="scene"><div class="sun" id="sun"></div><div class="hill"></div><div class="hill b"></div><div class="hill c"></div><div class="caption">A NEW DAY / ANYWHERE</div></div><div class="copy"><h1>Begin<br><i>again.</i></h1><p>Every morning offers a fresh piece of paper. What will you make of this one?</p><button id="change">LOWER THE SUN ↘</button></div></main><script>let down=false;document.querySelector('#change').onclick=e=>{down=!down;document.querySelector('#sun').style.top=down?'55%':'12%';e.currentTarget.textContent=down?'RAISE THE SUN  ↗':'LOWER THE SUN  ↘'}</script></body></html>
