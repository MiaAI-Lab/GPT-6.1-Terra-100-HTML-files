<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Sky</title><style>*{box-sizing:border-box}body{margin:0;background:#171c35;color:#e9e4e9;font-family:monospace}.wrap{max-width:1100px;margin:auto;padding:30px 4vw}header{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.15em;border-bottom:1px solid #6e789a;padding-bottom:20px}.title{display:flex;justify-content:space-between;align-items:end;margin:50px 0 30px;gap:20px}h1{font:900 clamp(60px,9vw,110px)/.85 Arial;letter-spacing:-.08em;margin:0}.title p{max-width:250px;line-height:1.7;color:#a2acc7}.sky{height:50vh;min-height:350px;background:linear-gradient(#4d5488,#c082a0 70%,#efb68a);position:relative;overflow:hidden;image-rendering:pixelated}.sun{position:absolute;width:150px;height:150px;background:#f5d5a0;left:50%;top:30%;transform:translate(-50%,-50%);box-shadow:15px 0 #f5d5a0,-15px 0 #f5d5a0,0 15px #f5d5a0,0 -15px #f5d5a0}.ground{position:absolute;bottom:0;width:100%;height:20%;background:#292c4b;clip-path:polygon(0 35%,15% 35%,15% 10%,30% 10%,30% 50%,50% 50%,50% 0,65% 0,65% 40%,85% 40%,85% 15%,100% 15%,100% 100%,0 100%)}button{background:#e9c8a2;color:#272b46;border:0;padding:15px 20px;cursor:pointer;font:10px monospace;letter-spacing:.15em;margin-top:25px}.night{filter:hue-rotate(80deg) brightness(.65)}@media(max-width:600px){.title{display:block}.title p{margin-top:20px}}</style></head><body><div class="wrap"><header><span>PIXEL SKY</span><span>SCENE 040 / 100</span></header><div class="title"><h1>ONE MORE<br>SUNSET.</h1><p>A tiny landscape for a very large feeling. Switch the light and watch the sky change.</p></div><main class="sky" id="sky"><div class="sun"></div><div class="ground"></div></main><button id="toggle">CHANGE THE LIGHT ↗</button></div><script>document.querySelector('#toggle').onclick=()=>document.querySelector('#sky').classList.toggle('night')</script></body></html>
