<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desktop Zen</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e2d4;color:#514a40;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}.sand{aspect-ratio:1;background:repeating-radial-gradient(ellipse at 50% 50%,#ded0b6 0 5px,#cfc1a8 6px 7px,#ded0b6 8px 15px);border:15px solid #b7a890;position:relative;box-shadow:0 15px 25px #897a6533}.stone{position:absolute;border-radius:50%;background:#777b6c;box-shadow:inset -10px -10px #5d645b,5px 10px 15px #8c806f66}.stone.a{width:30%;height:20%;left:25%;top:32%}.stone.b{width:20%;height:14%;right:20%;bottom:23%;background:#9b9a87}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#918a7d;max-width:300px}button{background:none;border:1px solid #9d9382;padding:15px 22px;cursor:pointer;color:#514a40;font:10px Arial;letter-spacing:.15em;margin-top:20px}.sand.turn{transform:rotate(90deg)}.sand{transition:transform .8s}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.sand{max-width:420px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>DESKTOP ZEN</span><span>A SMALL LANDSCAPE / 047</span></header><main class="layout"><div class="sand" id="sand"><div class="stone a"></div><div class="stone b"></div></div><section><small>A PLACE TO REST YOUR EYES</small><h1>Find a<br>little <i>stillness.</i></h1><p>Sand, stone and the simple pleasure of looking at something for a while.</p><button id="turn">TURN THE GARDEN ↗</button></section></main><footer><span>AN EXERCISE IN ATTENTION</span><span>STONE / SAND / SPACE</span></footer></div><script>document.querySelector('#turn').onclick=()=>document.querySelector('#sand').classList.toggle('turn')</script></body></html>
