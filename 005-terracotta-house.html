<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa Sol</title><style>*{box-sizing:border-box}body{margin:0;background:#ebdcc9;color:#473729;font-family:Georgia,serif}header{display:flex;justify-content:space-between;align-items:center;padding:25px 5vw;font:11px Arial;letter-spacing:.14em}.brand{font:bold 20px Georgia;letter-spacing:0}.hero{min-height:80vh;display:grid;grid-template-columns:1fr 1fr;gap:3vw;padding:0 5vw 5vw}.words{display:flex;flex-direction:column;justify-content:center}.kicker{font:10px Arial;letter-spacing:.22em;color:#a1654c}h1{font-size:clamp(62px,8vw,120px);line-height:.89;letter-spacing:-.055em;font-weight:400;margin:30px 0}h1 i{color:#b46142}p{font:15px/1.8 Arial;color:#746252;max-width:360px}.button{align-self:flex-start;border:0;background:#a9573d;color:#fff8ed;padding:18px 27px;margin-top:25px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.art{min-height:600px;background:#ce8a68;position:relative;overflow:hidden}.sun{position:absolute;width:180px;height:180px;background:#efd7a8;border-radius:50%;right:12%;top:10%}.building{position:absolute;bottom:0;left:8%;width:80%;height:65%;background:#e9c5a5;box-shadow:25px 0 #bb7455}.arch{position:absolute;bottom:0;left:30%;width:35%;height:70%;border-radius:100px 100px 0 0;background:#7a4c42}.arch:after{content:'';position:absolute;inset:10px 10px 0;border-radius:100px 100px 0 0;border:1px solid #d7ad91}.plant{position:absolute;bottom:0;right:3%;width:12px;height:45%;background:#6b694b;transform:rotate(-8deg)}.plant:before,.plant:after{content:'';position:absolute;width:100px;height:35px;background:#6b694b;border-radius:100% 0;top:15%;right:0;transform:rotate(30deg)}.plant:after{top:40%;right:auto;left:0;transform:rotate(-30deg) scaleX(-1)}.caption{position:absolute;bottom:20px;left:20px;color:#fff6e8;font:10px Arial;letter-spacing:.15em}footer{display:flex;justify-content:space-between;padding:25px 5vw;border-top:1px solid #c3af9c;font:10px Arial;letter-spacing:.15em}@media(max-width:700px){.hero{grid-template-columns:1fr}.words{padding:50px 0}.art{min-height:480px}header span:last-child{display:none}}</style></head><body><header><span class="brand">casa sol.</span><span>A PLACE TO COME BACK TO YOURSELF</span><span>PORTUGAL &nbsp; / &nbsp; 38° N</span></header><main class="hero"><div class="words"><span class="kicker">A SMALL HOUSE UNDER THE SUN</span><h1>Stay for<br>the <i>slow</i><br>things.</h1><p>Long lunches, warm walls and light that lingers. Welcome to a quieter kind of escape.</p><button class="button" id="discover">EXPLORE THE HOUSE &nbsp; ↗</button><p id="message" aria-live="polite"></p></div><div class="art" role="img" aria-label="Illustration of a sunlit terracotta house"><div class="sun"></div><div class="building"><div class="arch"></div></div><div class="plant"></div><div class="caption">CASA SOL &nbsp; / &nbsp; THE COURTYARD</div></div></main><footer><span>MADE FOR UNHURRIED DAYS</span><span>THE ART OF BEING HERE &nbsp; ✳</span></footer><script>document.querySelector('#discover').onclick=()=>{document.querySelector('#message').textContent='A courtyard, a quiet room, and all the time in the world.'}</script></body></html>
