<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dots & Lines</title><style>*{box-sizing:border-box}body{margin:0;background:#f0eadc;color:#2f3534;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.title{display:flex;justify-content:space-between;align-items:end;margin:50px 0 30px;gap:20px}h1{font-size:clamp(60px,9vw,120px);line-height:.85;letter-spacing:-.08em;margin:0}.title p{font-size:14px;line-height:1.7;max-width:260px;color:#858a82}.stage{height:50vh;min-height:350px;background:#d5ded3;position:relative;overflow:hidden;cursor:crosshair}.stage:before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 49.8%,#8aa69b 50%,transparent 50.2%),linear-gradient(45deg,transparent 49.8%,#8aa69b 50%,transparent 50.2%)}.dot{position:absolute;width:18px;height:18px;border-radius:50%;background:#d97860;transform:translate(-50%,-50%)}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:10px;letter-spacing:.15em}button{background:#344f48;color:white;border:0;padding:14px 20px;cursor:pointer;font-size:10px;letter-spacing:.15em}@media(max-width:600px){.title{display:block}.title p{margin-top:20px}}</style></head><body><div class="wrap"><header><span>DOTS & LINES</span><span>COMPOSITION STUDY / 064</span></header><div class="title"><h1>Make your<br>mark.</h1><p>Tap the field to add dots. Let them find their own relationship with the lines.</p></div><main class="stage" id="stage" aria-label="Click to place dots"></main><div class="controls"><span id="count">0 MARKS</span><button id="clear">START AGAIN ↗</button></div></div><script>let n=0;const s=document.querySelector('#stage');s.onclick=e=>{const r=s.getBoundingClientRect(),d=document.createElement('span');d.className='dot';d.style.left=e.clientX-r.left+'px';d.style.top=e.clientY-r.top+'px';s.appendChild(d);document.querySelector('#count').textContent=++n+' MARKS'};document.querySelector('#clear').onclick=()=>{s.querySelectorAll('.dot').forEach(d=>d.remove());n=0;document.querySelector('#count').textContent='0 MARKS'}</script></body></html>
