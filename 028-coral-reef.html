<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coral Reef</title><style>*{box-sizing:border-box}body{margin:0;background:#12484a;color:#e5f4df;font-family:Arial,sans-serif}.wrap{min-height:100vh;padding:25px 4vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center}.copy h1{font:400 clamp(65px,9vw,125px)/.85 Georgia;letter-spacing:-.06em;margin:30px 0}.copy p{color:#a9d1c1;font-size:14px;line-height:1.8;max-width:320px}.reef{height:70vh;min-height:480px;position:relative;background:radial-gradient(circle at 50% 60%,#57a796,#1e6964 65%,#12484a);overflow:hidden}.coral{position:absolute;bottom:0;width:25px;height:45%;background:#e98269;border-radius:30px 30px 0 0;left:50%}.coral:before,.coral:after{content:'';position:absolute;bottom:20%;width:22px;height:70%;background:inherit;border-radius:20px;transform-origin:bottom;transform:rotate(-40deg)}.coral:after{transform:rotate(40deg)}.coral.b{left:25%;height:30%;background:#e8bd80;transform:scale(.8)}.coral.c{left:75%;height:35%;background:#c18ba1}.bubble{position:absolute;left:40%;bottom:-20px;border:1px solid #d6fff0;border-radius:50%;width:18px;height:18px;animation:rise 6s linear infinite}.bubble:nth-child(2){left:70%;animation-delay:-3s;width:10px;height:10px}.bubble:nth-child(3){left:20%;animation-delay:-5s;width:13px;height:13px}button{background:#e7ead3;color:#174f4c;border:0;padding:16px 23px;font-size:10px;letter-spacing:.15em;cursor:pointer;margin-top:20px}@keyframes rise{to{transform:translateY(-75vh);opacity:0}}.still .bubble{animation-play-state:paused}@media(max-width:700px){.layout{grid-template-columns:1fr}.reef{grid-row:1;height:50vh}.copy{padding:50px 0}}@media(prefers-reduced-motion:reduce){.bubble{animation:none}}</style></head><body><div class="wrap"><header><span>THE CORAL ROOM</span><span>UNDERWATER STUDY / 028</span></header><main class="layout"><section class="copy"><small>BELOW THE SURFACE</small><h1>A garden<br>under<br>the <i>sea.</i></h1><p>Color, movement and life in a place where the world feels beautifully different.</p><button id="toggle">PAUSE THE BUBBLES &nbsp; Ⅱ</button></section><div class="reef" id="reef"><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div><div class="coral"></div><div class="coral b"></div><div class="coral c"></div></div></main><footer><span>A SMALL IMAGINED REEF</span><span>OCEAN / 01</span></footer></div><script>document.querySelector('#toggle').onclick=e=>{let x=document.querySelector('#reef').classList.toggle('still');e.currentTarget.textContent=x?'RESUME THE BUBBLES  ▶':'PAUSE THE BUBBLES  Ⅱ'}</script></body></html>
