<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinetic Poem</title><style>*{box-sizing:border-box}body{margin:0;background:#f1c7a9;color:#763d38;font-family:Georgia,serif}.frame{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}header{border-bottom:1px solid;padding-bottom:20px}.poem{flex:1;display:flex;flex-direction:column;justify-content:center;font-size:clamp(60px,10vw,140px);line-height:.9;letter-spacing:-.06em}.line{display:block}.line:nth-child(2){padding-left:15%;font-style:italic;color:#b66c59;animation:float 4s ease-in-out infinite alternate}.line:nth-child(3){padding-left:30%}.controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}button{background:none;border:1px solid #9c6452;border-radius:40px;color:#763d38;padding:14px 20px;cursor:pointer;font:10px Arial;letter-spacing:.15em}@keyframes float{to{transform:translateX(20px)}}@media(max-width:600px){.line:nth-child(2){padding-left:5%}.line:nth-child(3){padding-left:10%}}@media(prefers-reduced-motion:reduce){.line{animation:none!important}}</style></head><body><div class="frame"><header><span>THREE LINES</span><span>A KINETIC POEM / 032</span></header><main class="poem" id="poem"><span class="line">let the</span><span class="line">day unfold</span><span class="line">slowly.</span></main><div class="controls"><span>WORDS IN MOTION &nbsp; ✳</span><button id="next">ANOTHER POEM ↗</button></div><footer><span>TAKE WHAT YOU NEED</span><span>01 / 03</span></footer></div><script>const poems=[['let the','day unfold','slowly.'],['make room','for a little','wonder.'],['some things','arrive in','their time.']];let n=0;document.querySelector('#next').onclick=()=>{n=(n+1)%poems.length;document.querySelectorAll('.line').forEach((x,i)=>x.textContent=poems[n][i]);document.querySelector('footer span:last-child').textContent='0'+(n+1)+' / 03'}</script></body></html>
