<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Recipe for Slow</title><style>*{box-sizing:border-box}body{margin:0;background:#f0e8d8;color:#4d3d30;font-family:Georgia,serif}.page{max-width:1100px;margin:auto;padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid #aa9b86;padding-bottom:20px;font:10px Arial;letter-spacing:.2em}.title{text-align:center;padding:65px 0 45px}h1{font-size:clamp(65px,10vw,130px);font-weight:400;line-height:.85;letter-spacing:-.06em;margin:25px 0}.title p{font:14px Arial;color:#9a8875}.content{display:grid;grid-template-columns:1fr 1.3fr;gap:7vw;border-top:1px solid #b5a38c;padding-top:40px}.plate{aspect-ratio:1;border-radius:50%;background:#e1c4a3;display:grid;place-items:center;box-shadow:inset 0 0 0 20px #f4e8d5,inset 0 0 0 22px #c1a88b}.cup{width:35%;aspect-ratio:1;border-radius:50%;background:#8b5c3b;border:15px solid #f7ecda;box-shadow:10px 10px 0 #a78970}.steps h2{font-weight:400;font-size:34px}.step{display:flex;gap:20px;border-bottom:1px solid #cbbba6;padding:20px 0;align-items:center}.step input{accent-color:#9e6d4e;width:20px;height:20px}.step label{font-size:18px}.step input:checked+label{text-decoration:line-through;color:#aa9a89}footer{text-align:center;margin-top:60px;font:10px Arial;letter-spacing:.2em}@media(max-width:700px){.content{grid-template-columns:1fr}.plate{max-width:380px;margin:auto;width:100%}}</style></head><body><div class="page"><header><span>THE SLOW TABLE</span><span>RECIPE NO. 025</span></header><div class="title"><small>FOR ONE UNHURRIED MORNING</small><h1>A recipe<br>for <i>slow.</i></h1><p>Preparation time: as long as you need.</p></div><main class="content"><div class="plate"><div class="cup"></div></div><section class="steps"><h2>Gather yourself.</h2><div class="step"><input type="checkbox" id="a"><label for="a">Open a window.</label></div><div class="step"><input type="checkbox" id="b"><label for="b">Make something warm to drink.</label></div><div class="step"><input type="checkbox" id="c"><label for="c">Notice the light for a moment.</label></div><div class="step"><input type="checkbox" id="d"><label for="d">Begin when you are ready.</label></div></section></main><footer>THE INGREDIENT IS TIME &nbsp; ✳</footer></div></body></html>
