<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mountain Air</title><style>*{box-sizing:border-box}body{margin:0;background:#dce4df;color:#374d48;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.scene{flex:1;min-height:550px;position:relative;overflow:hidden;margin:30px 0;background:linear-gradient(#a8c4c3,#e6e9d9)}.sun{position:absolute;width:130px;height:130px;border-radius:50%;background:#f0e5c3;top:13%;right:20%}.mountain{position:absolute;bottom:0;width:100%;height:65%;background:#a2b8aa;clip-path:polygon(0 100%,0 65%,28% 0,57% 70%,73% 30%,100% 80%,100% 100%)}.mountain.b{height:45%;background:#758f82;clip-path:polygon(0 100%,0 60%,25% 10%,50% 75%,72% 0,100% 70%,100% 100%)}.copy{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:5vw}h1{font-size:clamp(65px,9vw,120px);font-weight:400;line-height:.85;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.7 Arial;max-width:260px}button{align-self:start;background:#3f6658;color:white;border:0;padding:15px 22px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.mist{filter:saturate(.5) brightness(1.1)}@media(max-width:600px){.scene{min-height:65vh}.copy{padding:30px}}</style></head><body><div class="wrap"><header><span>MOUNTAIN AIR</span><span>LANDSCAPE / 055</span></header><main class="scene" id="scene"><div class="sun"></div><div class="mountain"></div><div class="mountain b"></div><div class="copy"><small>FAR ABOVE THE NOISE</small><h1>Make room<br>to <i>breathe.</i></h1><p>The view is wider up here. Stay for a moment and take it in.</p><button id="mist">CHANGE THE WEATHER ↗</button></div></main><footer><span>AN IMAGINARY VIEW</span><span>PEAK / SKY / STILLNESS</span></footer></div><script>document.querySelector('#mist').onclick=()=>document.querySelector('#scene').classList.toggle('mist')</script></body></html>
