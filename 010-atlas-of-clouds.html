<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas of Clouds</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1ee;color:#314458;font-family:Georgia,serif}header{padding:25px 5vw;display:flex;justify-content:space-between;border-bottom:1px solid #adbbc0;font:10px Arial;letter-spacing:.2em}main{display:grid;grid-template-columns:1fr 1.2fr;min-height:calc(100vh - 70px)}article{padding:8vw 5vw;display:flex;flex-direction:column;justify-content:center}small{font:10px Arial;letter-spacing:.2em}h1{font-size:clamp(65px,8vw,120px);letter-spacing:-.06em;line-height:.87;font-weight:400;margin:35px 0}h1 i{color:#8da7b3}p{font:15px/1.7 Arial;color:#798e98;max-width:340px}button{align-self:flex-start;background:#344f62;color:#fff;border:0;padding:17px 24px;margin-top:25px;cursor:pointer;letter-spacing:.12em;font-size:10px}.sky{background:linear-gradient(#8caabc,#c9d9dc 80%,#e5e6d9);position:relative;overflow:hidden;min-height:600px}.cloud{position:absolute;width:45%;height:12%;background:#f4f5ed;border-radius:50%;filter:blur(8px);box-shadow:40px -20px 0 5px #f5f6ef,100px 0 0 -5px #eaf0ec;animation:drift 18s ease-in-out infinite alternate}.cloud.one{top:27%;left:8%}.cloud.two{top:52%;left:45%;transform:scale(.7);animation-delay:-5s}.cloud.three{top:72%;left:-5%;transform:scale(.55);animation-delay:-9s}.index{position:absolute;bottom:30px;left:30px;font:10px Arial;letter-spacing:.15em;color:#536d79}.circle{position:absolute;right:25px;top:25px;border:1px solid #edf4ee;border-radius:50%;width:80px;height:80px;display:grid;place-items:center;font:10px Arial;letter-spacing:.1em}@keyframes drift{to{margin-left:50px}}@media(max-width:700px){main{grid-template-columns:1fr}.sky{min-height:52vh;grid-row:1}article{padding:60px 30px}}@media(prefers-reduced-motion:reduce){.cloud{animation:none}}</style></head><body><header><span>THE ATLAS OF CLOUDS</span><span>FIELD NOTES &nbsp; / &nbsp; 01</span></header><main><article><small>LOOK UP MORE OFTEN</small><h1>The sky<br>is never<br><i>the same.</i></h1><p id="description">Cumulus: soft, sunlit heaps that gather like islands in an open sky.</p><button id="next">TURN THE PAGE &nbsp; ↗</button></article><div class="sky" role="img" aria-label="An illustrated sky filled with clouds"><div class="cloud one"></div><div class="cloud two"></div><div class="cloud three"></div><div class="circle" id="number">01 / 03</div><div class="index">A STUDY IN TRANSIENCE &nbsp; ✳</div></div></main><script>const notes=['Cumulus: soft, sunlit heaps that gather like islands in an open sky.','Cirrus: fine threads of ice, brushed high across the blue.','Stratus: a low, quiet blanket that softens the light.'];let n=0;document.querySelector('#next').onclick=()=>{n=(n+1)%notes.length;document.querySelector('#description').textContent=notes[n];document.querySelector('#number').textContent=`0${n+1} / 03`}</script></body></html>
