<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline</title><style>*{box-sizing:border-box}body{margin:0;background:#e9d9c9;color:#504d4b;font-family:Arial,sans-serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.scene{flex:1;min-height:500px;position:relative;overflow:hidden;margin:30px 0;background:linear-gradient(#dba995,#efd6b8)}.sun{position:absolute;width:150px;height:150px;border-radius:50%;background:#f6d69c;right:20%;top:15%}.city{position:absolute;bottom:0;width:100%;height:50%;background:#726f70;clip-path:polygon(0 100%,0 60%,10% 60%,10% 30%,20% 30%,20% 65%,30% 65%,30% 10%,40% 10%,40% 50%,50% 50%,50% 20%,60% 20%,60% 65%,70% 65%,70% 35%,80% 35%,80% 55%,90% 55%,90% 5%,100% 5%,100% 100%)}.copy{position:absolute;top:12%;left:5%}h1{font-size:clamp(65px,9vw,120px);line-height:.85;letter-spacing:-.08em;margin:25px 0}p{font-size:14px;line-height:1.7;max-width:260px}button{background:#50545a;color:white;border:0;padding:15px 22px;font-size:10px;letter-spacing:.15em;cursor:pointer}.night{filter:hue-rotate(100deg) brightness(.7)}@media(max-width:600px){.scene{min-height:70vh}}</style></head><body><div class="wrap"><header><span>SKYLINE</span><span>CITY STUDY / 080</span></header><main class="scene" id="scene"><div class="sun"></div><div class="city"></div><div class="copy"><small>THE CITY IN SILHOUETTE</small><h1>Every city<br>has a<br>shape.</h1><p>Buildings, light and the spaces in between make a familiar rhythm.</p><button id="change">CHANGE THE HOUR ↗</button></div></main><footer><span>LIGHT / CITY / HORIZON</span><span>AN IMAGINARY PLACE</span></footer></div><script>document.querySelector('#change').onclick=()=>document.querySelector('#scene').classList.toggle('night')</script></body></html>
