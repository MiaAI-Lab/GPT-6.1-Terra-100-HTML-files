<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunar Post</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e5da;color:#262c31;font-family:Georgia,serif}.page{margin:3vw;border:1px solid #343b3d;min-height:90vh;display:grid;grid-template-columns:1fr 1fr}.copy{padding:6vw;display:flex;flex-direction:column;justify-content:space-between}.meta{font:10px Arial;letter-spacing:.2em;display:flex;justify-content:space-between}h1{font-size:clamp(62px,8vw,120px);font-weight:400;line-height:.85;letter-spacing:-.06em;margin:30px 0}p{max-width:330px;color:#717675;font:15px/1.7 Arial}button{background:#283b42;color:#fff;border:0;padding:17px 25px;margin-top:20px;cursor:pointer;font-size:10px;letter-spacing:.15em}.sky{background:#26383f;position:relative;overflow:hidden;display:grid;place-items:center}.moon{width:min(60%,360px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 27%,#f5eedb,#b6b9ae 60%,#6a7773);box-shadow:0 0 80px #c8d4c35c;transition:clip-path 1s}.orbit{position:absolute;width:80%;aspect-ratio:1;border:1px solid #cdd8c744;border-radius:50%}.orbit:after{content:'✦';position:absolute;right:10%;top:12%;color:#dbe5d4}.stamp{position:absolute;bottom:30px;left:30px;color:#cbd5ca;font:10px Arial;letter-spacing:.2em}@media(max-width:700px){.page{grid-template-columns:1fr}.sky{min-height:50vh;grid-row:1}.copy{min-height:500px;padding:35px}}</style></head><body><main class="page"><section class="copy"><div class="meta"><span>THE LUNAR POST</span><span>ISSUE 01</span></div><div><small class="meta">A NOTE FROM THE NIGHT SKY</small><h1>Meet me<br>at the <i>moon.</i></h1><p>A small reminder that the night is never empty. Turn the page to see another phase.</p><button id="phase">CHANGE THE PHASE &nbsp; ↗</button></div><div class="meta"><span>AN OBSERVATION</span><span id="label">FULL MOON</span></div></section><section class="sky"><div class="orbit"></div><div class="moon" id="moon"></div><div class="stamp">DISTANCE / 384,400 KM</div></section></main><script>let n=0;const clips=['inset(0)','inset(0 0 0 45%)','inset(0 45% 0 0)'],names=['FULL MOON','WAXING MOON','WANING MOON'];document.querySelector('#phase').onclick=()=>{n=(n+1)%3;document.querySelector('#moon').style.clipPath=clips[n];document.querySelector('#label').textContent=names[n]}</script></body></html>
