<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flower Market</title><style>*{box-sizing:border-box}body{margin:0;background:#f5efd9;color:#342f28;font-family:Arial,sans-serif}header{padding:24px 4vw;display:flex;justify-content:space-between;border-bottom:2px solid;font-size:10px;font-weight:bold;letter-spacing:.15em}.headline{text-align:center;padding:50px 0 30px}h1{font-size:clamp(60px,11vw,140px);letter-spacing:-.09em;line-height:.8;margin:20px 0;font-weight:900}.headline p{font:italic 20px Georgia}.flowers{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:0 4vw}.card{height:400px;display:grid;place-items:center;position:relative;background:#e8a28e;border:0;cursor:pointer}.card:nth-child(2){background:#d2bc7e}.card:nth-child(3){background:#aab99b}.flower{width:140px;height:140px;position:relative;background:#f6dfab;border-radius:50%;box-shadow:0 -55px #f4d1c2,0 55px #f4d1c2,55px 0 #f4d1c2,-55px 0 #f4d1c2;transform:scale(.65)}.card:nth-child(2) .flower{box-shadow:0 -55px #f3ece0,0 55px #f3ece0,55px 0 #f3ece0,-55px 0 #f3ece0}.card:nth-child(3) .flower{box-shadow:0 -55px #d98173,0 55px #d98173,55px 0 #d98173,-55px 0 #d98173}.card span{position:absolute;bottom:20px;left:20px;font-size:10px;letter-spacing:.15em;font-weight:bold}.note{text-align:center;padding:30px;font:italic 20px Georgia;min-height:90px}@media(max-width:700px){.flowers{grid-template-columns:1fr}.card{height:250px}}</style></head><body><header><span>THE FLOWER MARKET</span><span>FRESH IDEAS DAILY / 030</span></header><div class="headline"><small>AN IMAGINARY BOUQUET</small><h1>FLOWERS<br>FOR YOU.</h1><p>Pick one, just because.</p></div><main class="flowers"><button class="card" data-note="A little softness for your day."><div class="flower"></div><span>01 / PEONY</span></button><button class="card" data-note="A bright thought for a new beginning."><div class="flower"></div><span>02 / DAISY</span></button><button class="card" data-note="A warm hello from someone thinking of you."><div class="flower"></div><span>03 / POPPY</span></button></main><div class="note" id="note" aria-live="polite">Choose a flower.</div><script>document.querySelectorAll('.card').forEach(c=>c.onclick=()=>document.querySelector('#note').textContent=c.dataset.note)</script></body></html>
