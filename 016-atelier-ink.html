<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Ink</title><style>*{box-sizing:border-box}body{margin:0;background:#f0ede4;color:#242724;font-family:Georgia,serif}nav{padding:25px 5vw;display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em;border-bottom:1px solid #b4b6ab}.hero{display:grid;grid-template-columns:1.1fr 1fr;min-height:80vh}.art{position:relative;overflow:hidden;display:grid;place-items:center}.ink{width:55%;aspect-ratio:1;background:#283831;border-radius:45% 55% 61% 39% / 48% 37% 63% 52%;box-shadow:20px 15px 0 #42534955;animation:morph 9s ease-in-out infinite alternate}.ink:after{content:'';position:absolute;inset:35%;border:1px solid #e3e8d544;border-radius:50%}.number{position:absolute;bottom:30px;left:5vw;font:10px Arial;letter-spacing:.2em}.copy{padding:7vw;display:flex;flex-direction:column;justify-content:center;border-left:1px solid #b4b6ab}small{font:10px Arial;letter-spacing:.2em}h1{font-weight:400;font-size:clamp(65px,8vw,120px);line-height:.88;letter-spacing:-.06em;margin:30px 0}p{font:15px/1.8 Arial;color:#7d867a;max-width:320px}button{align-self:start;border:1px solid #57665a;background:none;padding:15px 24px;margin-top:20px;cursor:pointer;font:10px Arial;letter-spacing:.15em}@keyframes morph{to{border-radius:64% 36% 39% 61% / 42% 66% 34% 58%;transform:rotate(15deg)}}@media(max-width:700px){.hero{grid-template-columns:1fr}.art{min-height:50vh}.copy{border-left:0;border-top:1px solid #b4b6ab;padding:50px 30px}}@media(prefers-reduced-motion:reduce){.ink{animation:none}}</style></head><body><nav><span>ATELIER INK</span><span>OBJECTS / IDEAS / TIME</span></nav><main class="hero"><div class="art"><div class="ink"></div><div class="number">FORM STUDY &nbsp; 01 / 03</div></div><section class="copy"><small>THE BEAUTY OF IMPERFECTION</small><h1>Made to<br><i>be felt.</i></h1><p id="text">A study in the unrepeatable gesture: the soft edge, the pause, the mark left behind.</p><button id="next">NEXT STUDY &nbsp; ↗</button></section></main><script>const s=['A study in the unrepeatable gesture: the soft edge, the pause, the mark left behind.','A shape becomes a memory when we give it time.','A little irregularity is where the character lives.'];let n=0;document.querySelector('#next').onclick=()=>{n=(n+1)%3;document.querySelector('#text').textContent=s[n];document.querySelector('.number').textContent='FORM STUDY  0'+(n+1)+' / 03'}</script></body></html>
