<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Notes</title><style>*{box-sizing:border-box}body{margin:0;background:#e8d9d5;color:#60494e;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;position:relative;display:grid;place-items:center}.ring{position:absolute;width:80%;height:45%;border:1px solid #a97f89;border-radius:50%;transform:rotate(-30deg)}.ring:nth-child(2){transform:rotate(30deg)}.ring:nth-child(3){transform:rotate(90deg)}.planet{width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f8e8d8,#c08d99);box-shadow:0 0 50px #c18f9955}h1{font-size:clamp(65px,8vw,115px);line-height:.87;letter-spacing:-.06em;font-weight:400;margin:25px 0}p{font:14px/1.8 Arial;color:#a1868b;max-width:300px}button{background:none;border:1px solid #aa8b91;color:#60494e;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{grid-row:1}}</style></head><body><div class="wrap"><header><span>ORBIT NOTES</span><span>A THOUGHT / 072</span></header><main class="layout"><section><small>THINGS WE CIRCLE BACK TO</small><h1>Some ideas<br>have their<br>own <i>orbit.</i></h1><p id="note">A good thought returns when it is ready.</p><button id="next">ANOTHER THOUGHT ↗</button></section><div class="art"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="planet"></div></div></main><footer><span>THOUGHT / TIME / SPACE</span><span>A SMALL UNIVERSE</span></footer></div><script>let n=0;const t=['A good thought returns when it is ready.','Leave a little space around the idea.','Not every question needs an immediate answer.'];document.querySelector('#next').onclick=()=>{n=(n+1)%3;document.querySelector('#note').textContent=t[n]}</script></body></html>
