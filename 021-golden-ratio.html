<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Ratio Study</title><style>*{box-sizing:border-box}body{margin:0;background:#f3eee2;color:#3a3227;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{font:10px Arial;letter-spacing:.2em;display:flex;justify-content:space-between}header{padding-bottom:20px;border-bottom:1px solid}.content{flex:1;display:grid;grid-template-columns:1fr 1.4fr;gap:5vw;align-items:center}.copy h1{font-size:clamp(60px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}.copy p{font:14px/1.8 Arial;color:#8d806c;max-width:320px}.study{aspect-ratio:1.618;display:grid;grid-template-columns:61.8% 38.2%;background:#d0ac70;box-shadow:15px 15px #ddcfb5}.large{border:1px solid #5e4d36;position:relative}.large:after{content:'';position:absolute;inset:0;border:1px solid #5e4d36;border-radius:100% 0 0 0}.side{display:grid;grid-template-rows:61.8% 38.2%}.side div{border:1px solid #5e4d36;position:relative}.side div:after{content:'';position:absolute;inset:0;border:1px solid #5e4d36;border-radius:0 0 100% 0}.side div:last-child{background:#e6cf9f}button{border:1px solid;background:none;padding:15px 22px;margin-top:20px;cursor:pointer;font:10px Arial;letter-spacing:.15em}.study{transition:transform .7s}.study.turn{transform:rotate(180deg)}@media(max-width:700px){.content{grid-template-columns:1fr;padding:60px 0}.study{grid-row:1}.copy h1{font-size:70px}}</style></head><body><div class="wrap"><header><span>FORM STUDIES</span><span>NUMBER 021</span></header><main class="content"><div class="copy"><small>THE MATHEMATICS OF FORM</small><h1>A little<br><i>proportion.</i></h1><p>One rectangle, divided again and again. A familiar ratio becomes a small meditation on order and variation.</p><button id="turn">TURN THE STUDY ↗</button></div><div class="study" id="study" aria-label="Geometric proportion study"><div class="large"></div><div class="side"><div></div><div></div></div></div></main><footer><span>OBSERVE / REPEAT / DISCOVER</span><span>1 : 1.618</span></footer></div><script>document.querySelector('#turn').onclick=()=>document.querySelector('#study').classList.toggle('turn')</script></body></html>
