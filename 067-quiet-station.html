<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet Station</title><style>*{box-sizing:border-box}body{margin:0;background:#d4ded9;color:#36524a;font-family:Arial,sans-serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.radio{background:#9fb5a4;border-radius:25px;padding:35px;box-shadow:0 20px #819b89;min-height:400px;display:flex;flex-direction:column;justify-content:space-between}.display{background:#314b42;color:#d9e7d5;padding:25px;font:14px monospace;letter-spacing:.15em}.speaker{height:140px;background:repeating-linear-gradient(90deg,#6f8d78 0 4px,transparent 5px 14px);border-radius:12px}.knobs{display:flex;gap:15px}.knob{width:50px;height:50px;border-radius:50%;background:#e3e7d7;border:4px solid #708a78}.copy h1{font:400 clamp(65px,8vw,115px)/.87 Georgia;letter-spacing:-.06em;margin:25px 0}.copy p{font-size:14px;line-height:1.8;color:#799489;max-width:300px}button{background:#355a4d;color:white;border:0;padding:15px 22px;margin-top:20px;font-size:10px;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.radio{grid-row:1}}</style></head><body><div class="wrap"><header><span>QUIET STATION</span><span>FREQUENCY / 067</span></header><main class="layout"><section class="copy"><small>A BROADCAST FOR SLOW DAYS</small><h1>Tune into<br><i>less.</i></h1><p>A fictional radio for moments when you want the world to feel a little quieter.</p><button id="next">CHANGE STATION ↗</button></section><div class="radio"><div class="display" id="display">88.1 / SLOW MORNING</div><div class="speaker"></div><div class="knobs"><div class="knob"></div><div class="knob"></div></div></div></main><footer><span>AN IMAGINARY BROADCAST</span><span>ALWAYS ON / ALWAYS GENTLE</span></footer></div><script>let n=0;const s=['88.1 / SLOW MORNING','92.4 / OPEN WINDOW','103.2 / SOFT EVENING'];document.querySelector('#next').onclick=()=>{n=(n+1)%3;document.querySelector('#display').textContent=s[n]}</script></body></html>
