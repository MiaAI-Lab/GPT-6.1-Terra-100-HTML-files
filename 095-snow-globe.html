<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snow Globe</title><style>*{box-sizing:border-box}body{margin:0;background:#d6e2e1;color:#405a5b;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.globe{width:min(70vw,350px);aspect-ratio:1;border-radius:50%;background:linear-gradient(#b2cdd0,#e8efdf);border:8px solid #eef3e8;position:relative;overflow:hidden;margin:auto;box-shadow:0 20px 40px #58787744}.globe:before{content:'✦  ·  ✧  ·  ✦  ·  ✧  ·  ✦';position:absolute;inset:10%;color:white;font-size:25px;line-height:3;animation:snow 5s linear infinite}.hill{position:absolute;bottom:-15%;left:-10%;width:120%;height:40%;background:#f5f5e9;border-radius:50%}.tree{position:absolute;bottom:15%;left:40%;width:20%;height:40%;background:#708e7c;clip-path:polygon(50% 0,100% 100%,0 100%)}.paused:before{animation-play-state:paused}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#829b99;max-width:300px}button{background:#658a82;color:white;border:0;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@keyframes snow{to{transform:translateY(100px)}}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.globe{grid-row:1}}@media(prefers-reduced-motion:reduce){.globe:before{animation:none}}</style></head><body><div class="wrap"><header><span>SNOW GLOBE</span><span>WINTER STUDY / 095</span></header><main class="layout"><section><small>A WORLD WITHIN A WORLD</small><h1>A little<br><i>winter.</i></h1><p>A quiet landscape, held in glass, where the snow has nowhere else to be.</p><button id="pause">PAUSE THE SNOW &nbsp; Ⅱ</button></section><div class="globe" id="globe"><div class="hill"></div><div class="tree"></div></div></main><footer><span>SNOW / GLASS / STILLNESS</span><span>A SMALL WORLD</span></footer></div><script>document.querySelector('#pause').onclick=e=>{let p=document.querySelector('#globe').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE SNOW  ▶':'PAUSE THE SNOW  Ⅱ'}</script></body></html>
