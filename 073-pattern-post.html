<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Post</title><style>*{box-sizing:border-box}body{margin:0;background:#f3e8d3;color:#3d4140;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:2px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.intro{display:flex;justify-content:space-between;align-items:end;margin:50px 0 30px;gap:20px}h1{font-size:clamp(60px,9vw,120px);line-height:.85;letter-spacing:-.08em;margin:0}.intro p{font-size:14px;line-height:1.7;max-width:270px;color:#8f8b7e}.pattern{height:50vh;min-height:350px;background-color:#d48c72;background-image:radial-gradient(circle,#f2ddbc 25%,transparent 26%);background-size:80px 80px;transition:background-size .5s}.pattern.small{background-size:40px 40px}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:25px;font-size:10px;letter-spacing:.15em}button{background:#3d554d;color:white;border:0;padding:15px 22px;font-size:10px;letter-spacing:.15em;cursor:pointer}@media(max-width:600px){.intro{display:block}.intro p{margin-top:20px}}</style></head><body><div class="wrap"><header><span>PATTERN POST</span><span>REPEAT STUDY / 073</span></header><div class="intro"><h1>Repeat<br>with joy.</h1><p>A simple dot, repeated until it becomes a whole new kind of space.</p></div><main class="pattern" id="pattern"></main><div class="controls"><span>ONE SHAPE / MANY POSSIBILITIES</span><button id="change">CHANGE THE SCALE ↗</button></div></div><script>document.querySelector('#change').onclick=()=>document.querySelector('#pattern').classList.toggle('small')</script></body></html>
