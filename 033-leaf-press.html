<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaf Press</title><style>*{box-sizing:border-box}body{margin:0;background:#d9d7c8;color:#38473b;font-family:Georgia,serif}.paper{margin:4vw;background:#f5f2e8;min-height:85vh;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 20px 50px #52605525}.copy{padding:6vw;display:flex;flex-direction:column;justify-content:space-between}.meta{font:10px Arial;letter-spacing:.2em}h1{font-size:clamp(65px,8vw,110px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#7b8b7b;max-width:310px}button{background:none;border:1px solid #79917b;padding:15px 22px;color:#38473b;cursor:pointer;font:10px Arial;letter-spacing:.15em;margin-top:20px}.specimen{background:#e4e7d9;position:relative;display:grid;place-items:center;overflow:hidden}.leaf{width:180px;height:300px;background:linear-gradient(110deg,#708c6e,#a5b89a);border-radius:100% 0 100% 0;transform:rotate(-35deg);box-shadow:12px 15px 0 #738b6d33;transition:transform .7s}.leaf:before{content:'';position:absolute;left:50%;top:10%;height:90%;border-left:2px solid #d1dec7;transform:rotate(35deg)}.caption{position:absolute;bottom:30px;left:30px;font:10px Arial;letter-spacing:.18em}@media(max-width:700px){.paper{grid-template-columns:1fr}.specimen{min-height:50vh;grid-row:1}.copy{min-height:450px;padding:35px}}</style></head><body><main class="paper"><section class="copy"><div class="meta">THE LEAF PRESS &nbsp; / &nbsp; SPECIMEN 033</div><div><h1>Collected<br>from the<br><i>quiet.</i></h1><p>A small study of shape, season and the things we find when we pay attention.</p><button id="turn">TURN THE LEAF ↗</button></div><div class="meta">FIELD NOTES / NATURE STUDY</div></section><div class="specimen"><div class="leaf" id="leaf"></div><div class="caption">FOLIUM / A STUDY IN GREEN</div></div></main><script>let n=0;document.querySelector('#turn').onclick=()=>{n++;document.querySelector('#leaf').style.transform=`rotate(${-35+n*45}deg)`}</script></body></html>
