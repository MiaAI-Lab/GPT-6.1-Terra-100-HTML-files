<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Type Playground</title><style>*{box-sizing:border-box}body{margin:0;background:#f3efdf;color:#161616;font-family:Arial,sans-serif}header{padding:20px 3vw;border-bottom:3px solid;display:flex;justify-content:space-between;font-size:11px;font-weight:bold;letter-spacing:.1em}.layout{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - 55px)}.stage{padding:4vw;display:flex;align-items:center;overflow:hidden;background:#fa5d3d}.word{font-weight:900;font-size:clamp(80px,16vw,260px);line-height:.8;letter-spacing:-.1em;overflow-wrap:anywhere}.panel{padding:35px;display:flex;flex-direction:column;gap:22px}h1{font-size:37px;letter-spacing:-.06em;line-height:.95;margin:0}p{font-size:13px;line-height:1.6}label{font-size:10px;font-weight:bold;letter-spacing:.14em}input{width:100%;padding:14px;border:2px solid;background:transparent;font-size:17px}button{border:0;background:#151515;color:white;padding:15px;font-weight:bold;cursor:pointer}footer{margin-top:auto;font-size:10px;letter-spacing:.1em}@media(max-width:700px){.layout{grid-template-columns:1fr}.stage{min-height:50vh}.panel{min-height:400px}.word{font-size:23vw}}</style></head><body><header><span>TYPE PLAYGROUND / 012</span><span>MAKE SOME NOISE ✳</span></header><main class="layout"><div class="stage" id="stage"><div class="word" id="word">HELLO.</div></div><section class="panel"><h1>BIG WORDS.<br>BIG ENERGY.</h1><p>Make a little typographic poster. Say anything you like.</p><label for="input">YOUR WORDS</label><input id="input" maxlength="18" value="HELLO."><button id="color">CHANGE THE INK ↗</button><footer>AN EXPERIMENT IN EXPRESSION<br><br>01 — 04</footer></section></main><script>document.querySelector('#input').oninput=e=>document.querySelector('#word').textContent=e.target.value||' ';let n=0;const colors=['#fa5d3d','#b8d653','#9eb7f1','#edb6d4'];document.querySelector('#color').onclick=()=>{n=(n+1)%colors.length;document.querySelector('#stage').style.background=colors[n]}</script></body></html>
