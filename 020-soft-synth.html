<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soft Synth</title><style>*{box-sizing:border-box}body{margin:0;background:#d8c9e9;color:#302543;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:30px}header{display:flex;justify-content:space-between;font-size:10px;font-weight:bold;letter-spacing:.2em}.intro{text-align:center;padding:60px 0 40px}h1{font-size:clamp(65px,12vw,150px);line-height:.8;letter-spacing:-.09em;margin:20px 0}p{font-size:14px;line-height:1.6}.synth{background:#efe7f5;border:2px solid #47385a;border-radius:25px;padding:clamp(20px,4vw,50px);box-shadow:0 18px 0 #aa97c2}.screen{height:150px;background:#34283e;border-radius:12px;display:grid;place-items:center;color:#d8f0bb;font:12px monospace;letter-spacing:.2em;position:relative;overflow:hidden}.screen:before{content:'';width:70%;height:50%;border:2px solid #a9dfa5;border-radius:50%;box-shadow:0 0 20px #a9dfa5;position:absolute;opacity:.5}.screen span{z-index:1}.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:25px}.key{height:180px;background:#fff9f5;border:2px solid #47385a;border-radius:0 0 10px 10px;cursor:pointer;font-weight:bold;color:#6f5c7d;display:flex;align-items:end;justify-content:center;padding:16px}.key:active,.key.on{background:#cce8bb;transform:translateY(4px)}footer{display:flex;justify-content:space-between;margin-top:45px;font-size:10px;letter-spacing:.15em}@media(max-width:600px){.wrap{padding:18px}.key{height:120px}.intro{padding:45px 0 30px}}</style></head><body><div class="wrap"><header><span>SOFT SYNTH / 020</span><span>MAKE A LITTLE SOUND ✳</span></header><div class="intro"><small>AN INSTRUMENT FOR PLAY</small><h1>soft synth.</h1><p>Seven notes. Infinite little beginnings.</p></div><main class="synth"><div class="screen"><span id="note">TOUCH A KEY TO BEGIN</span></div><div class="keys"><button class="key" data-f="261.63">C</button><button class="key" data-f="293.66">D</button><button class="key" data-f="329.63">E</button><button class="key" data-f="349.23">F</button><button class="key" data-f="392">G</button><button class="key" data-f="440">A</button><button class="key" data-f="493.88">B</button></div></main><footer><span>BUILT FOR CURIOUS FINGERS</span><span>VOLUME 01 / 01</span></footer></div><script>let ctx;document.querySelectorAll('.key').forEach(k=>k.onclick=()=>{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=+k.dataset.f;g.gain.setValueAtTime(.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.7);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.7);document.querySelector('#note').textContent='PLAYING / '+k.textContent})</script></body></html>
