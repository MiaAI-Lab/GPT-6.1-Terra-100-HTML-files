<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Herbarium</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeade;color:#475544;font-family:Georgia,serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font:10px Arial;letter-spacing:.2em}.title{text-align:center;padding:50px 0 35px}h1{font-size:clamp(60px,9vw,120px);font-weight:400;line-height:.85;letter-spacing:-.06em;margin:20px 0}.title p{font:14px Arial;color:#879586}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#d9dfcf;border:0;height:350px;position:relative;display:grid;place-items:center;cursor:pointer}.leaf{width:90px;height:180px;background:#7e9b77;border-radius:100% 0 100% 0;transform:rotate(-35deg);box-shadow:8px 10px #758c6a33}.card:nth-child(2) .leaf{background:#a0a780;border-radius:0 100% 0 100%;transform:rotate(25deg)}.card:nth-child(3) .leaf{background:#6d8c7c;border-radius:50% 50% 0 50%;transform:rotate(45deg)}.card span{position:absolute;bottom:20px;left:20px;font:10px Arial;letter-spacing:.15em}.note{text-align:center;padding:30px;font:italic 20px Georgia;min-height:90px}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{height:240px}}</style></head><body><div class="wrap"><header><span>DIGITAL HERBARIUM</span><span>SPECIMENS / 056</span></header><div class="title"><small>A COLLECTION OF GREEN</small><h1>Leaves of<br><i>attention.</i></h1><p>Three imagined specimens, collected for their shapes.</p></div><main class="grid"><button class="card" data-note="A long leaf shaped by light and patient growth."><div class="leaf"></div><span>01 / LONG LEAF</span></button><button class="card" data-note="A folded leaf with the color of a late summer afternoon."><div class="leaf"></div><span>02 / FOLDED LEAF</span></button><button class="card" data-note="A rounded leaf, soft as a small green thought."><div class="leaf"></div><span>03 / ROUND LEAF</span></button></main><div class="note" id="note" aria-live="polite">Select a specimen.</div></div><script>document.querySelectorAll('.card').forEach(c=>c.onclick=()=>document.querySelector('#note').textContent=c.dataset.note)</script></body></html>
