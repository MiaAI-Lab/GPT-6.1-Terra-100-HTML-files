<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ribbon Dance</title><style>*{box-sizing:border-box}body{margin:0;background:#251d35;color:#f4e7e6;font-family:Arial,sans-serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;min-height:500px}.ribbon{position:absolute;width:50%;height:35%;border:30px solid #ea8f9d;border-radius:50%;transform:rotate(-30deg);mix-blend-mode:screen;animation:turn 12s ease-in-out infinite alternate}.ribbon:nth-child(2){border-color:#a479c1;transform:rotate(30deg);animation-delay:-4s}.ribbon:nth-child(3){border-color:#e8b77d;transform:rotate(90deg);animation-delay:-8s}.text{position:relative;text-align:center;z-index:2;pointer-events:none}h1{font:400 clamp(65px,10vw,130px)/.85 Georgia;letter-spacing:-.06em;margin:20px 0}.text small{font-size:10px;letter-spacing:.2em}button{background:none;border:1px solid #d2b7c6;color:#fff;padding:14px 20px;font-size:10px;letter-spacing:.15em;cursor:pointer;margin:0 auto 30px}@keyframes turn{to{transform:rotate(180deg) scale(.8,1.3)}}.paused .ribbon{animation-play-state:paused}@media(max-width:600px){.ribbon{width:80%}}@media(prefers-reduced-motion:reduce){.ribbon{animation:none}}</style></head><body><div class="wrap" id="wrap"><header><span>RIBBON DANCE</span><span>A MOTION STUDY / 038</span></header><main class="stage"><div class="ribbon"></div><div class="ribbon"></div><div class="ribbon"></div><div class="text"><small>FORM IN MOTION</small><h1>Follow<br>the <i>flow.</i></h1></div></main><button id="toggle">PAUSE THE DANCE &nbsp; Ⅱ</button><footer><span>SHAPE / COLOR / MOVEMENT</span><span>AN ABSTRACT MOMENT</span></footer></div><script>document.querySelector('#toggle').onclick=e=>{let p=document.querySelector('#wrap').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE DANCE  ▶':'PAUSE THE DANCE  Ⅱ'}</script></body></html>
