<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wind Lines</title><style>*{box-sizing:border-box}body{margin:0;background:#e1e9e5;color:#3f5c5b;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;background:#aac9c3;position:relative;overflow:hidden}.line{position:absolute;left:-20%;width:140%;height:25%;border:2px solid #e2f0e8;border-radius:50%;animation:drift 4s ease-in-out infinite alternate}.line:nth-child(1){top:15%}.line:nth-child(2){top:30%;animation-delay:-1s}.line:nth-child(3){top:45%;animation-delay:-2s}.line:nth-child(4){top:60%;animation-delay:-3s}.paused .line{animation-play-state:paused}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#829c97;max-width:300px}button{background:none;border:1px solid #87aaa1;color:#3f5c5b;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@keyframes drift{to{transform:translateX(30px) rotate(5deg)}}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style></head><body><div class="wrap"><header><span>WIND LINES</span><span>MOTION STUDY / 085</span></header><main class="layout"><div class="art" id="art"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div><section><small>THE SHAPE OF AIR</small><h1>What you<br>cannot <i>see.</i></h1><p>A few moving lines give form to the invisible path of the wind.</p><button id="pause">STILL THE WIND &nbsp; Ⅱ</button></section></main><footer><span>AIR / LINE / MOVEMENT</span><span>AN ABSTRACT STUDY</span></footer></div><script>document.querySelector('#pause').onclick=e=>{let p=document.querySelector('#art').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE WIND  ▶':'STILL THE WIND  Ⅱ'}</script></body></html>
