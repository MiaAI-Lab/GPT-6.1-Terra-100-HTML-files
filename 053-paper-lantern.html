<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Lantern</title><style>*{box-sizing:border-box}body{margin:0;background:#27253a;color:#eee6d7;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.lantern{position:relative;width:230px;height:300px;margin:auto;background:repeating-linear-gradient(90deg,#edc596 0 22px,#d8a879 23px 24px);border-radius:48% 48% 42% 42%;box-shadow:0 0 100px #f2bf7c88;animation:sway 4s ease-in-out infinite alternate;transition:filter .8s}.lantern:before{content:'';position:absolute;top:-100px;left:50%;height:100px;border-left:1px solid #c9b9a2}.lantern:after{content:'';position:absolute;bottom:-12px;left:20%;width:60%;height:15px;background:#7e5544;border-radius:50%}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#b9b4b6;max-width:300px}button{background:none;color:#eee6d7;border:1px solid #b9a998;padding:15px 22px;margin-top:20px;cursor:pointer;font:10px Arial;letter-spacing:.15em}.dim{filter:brightness(.45)}@keyframes sway{to{transform:rotate(5deg)}}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:120px 0 50px}.lantern{grid-row:1}.copy{padding-top:50px}}@media(prefers-reduced-motion:reduce){.lantern{animation:none}}</style></head><body><div class="wrap"><header><span>PAPER LANTERN</span><span>LIGHT STUDY / 053</span></header><main class="layout"><section class="copy"><small>AN EVENING OBJECT</small><h1>A little<br><i>light</i> to<br>come home to.</h1><p>One warm glow can make a room feel like a place to stay.</p><button id="toggle">DIM THE LIGHT ↗</button></section><div class="lantern" id="lantern"></div></main><footer><span>LIGHT / PAPER / SHADOW</span><span>THE QUIET HOUR</span></footer></div><script>document.querySelector('#toggle').onclick=e=>{let d=document.querySelector('#lantern').classList.toggle('dim');e.currentTarget.textContent=d?'BRIGHTEN THE LIGHT ↗':'DIM THE LIGHT ↗'}</script></body></html>
