<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Echo Chamber</title><style>*{box-sizing:border-box}body{margin:0;background:#f1d558;color:#27241c;font-family:Arial,sans-serif}.wrap{min-height:100vh;padding:30px 4vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;font-weight:bold;letter-spacing:.2em}header{border-bottom:2px solid;padding-bottom:20px}.stage{flex:1;display:grid;place-items:center;overflow:hidden}.stack{position:relative;text-align:center;font-size:clamp(80px,18vw,240px);font-weight:900;letter-spacing:-.1em;line-height:.8}.stack span{display:block}.stack span:nth-child(1){color:#ec6c4c}.stack span:nth-child(2){color:#e99b54}.stack span:nth-child(3){color:#292820}.panel{display:flex;justify-content:center;gap:10px;margin:30px 0}input{border:2px solid #292820;background:transparent;padding:15px;font-size:16px;width:220px}button{background:#292820;color:#f1d558;border:0;padding:15px 20px;cursor:pointer;font-weight:bold}@media(max-width:600px){.stack{font-size:22vw}.panel{flex-wrap:wrap}}</style></head><body><div class="wrap"><header><span>ECHO CHAMBER</span><span>TYPE EXPERIMENT / 044</span></header><main class="stage"><div class="stack"><span>ECHO</span><span>ECHO</span><span>ECHO</span></div></main><div class="panel"><input id="input" maxlength="8" aria-label="Word to echo" value="ECHO"><button id="set">MAKE IT LOUD ↗</button></div><footer><span>REPEAT AFTER ME</span><span>THREE TIMES / THREE COLORS</span></footer></div><script>document.querySelector('#set').onclick=()=>{let v=document.querySelector('#input').value.trim()||'ECHO';document.querySelectorAll('.stack span').forEach(s=>s.textContent=v.toUpperCase())}</script></body></html>
