<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound of Color</title><style>*{box-sizing:border-box}body{margin:0;background:#ede6db;color:#27282c;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.intro{display:flex;justify-content:space-between;align-items:end;margin:55px 0 35px;gap:20px}h1{font-size:clamp(60px,9vw,120px);line-height:.85;letter-spacing:-.08em;margin:0}.intro p{font-size:14px;line-height:1.7;max-width:270px;color:#85817b}.keys{display:grid;grid-template-columns:repeat(5,1fr);height:45vh;min-height:280px}.key{border:0;cursor:pointer;color:white;display:flex;align-items:end;padding:20px;font-size:10px;letter-spacing:.15em}.key:nth-child(1){background:#d76f59}.key:nth-child(2){background:#d7ad60}.key:nth-child(3){background:#88a58f}.key:nth-child(4){background:#7995a9}.key:nth-child(5){background:#ae8eaa}.key:active{filter:brightness(1.2)}.status{margin-top:25px;font-size:10px;letter-spacing:.15em}@media(max-width:600px){.intro{display:block}.intro p{margin-top:20px}.keys{height:auto;grid-template-columns:1fr}.key{height:75px}}</style></head><body><div class="wrap"><header><span>THE SOUND OF COLOR</span><span>A PLAYFUL INSTRUMENT / 060</span></header><div class="intro"><h1>Color has<br>a <i>voice.</i></h1><p>Touch a color to hear a note. Make a little melody in five shades.</p></div><main class="keys"><button class="key" data-f="261.63">01 / CORAL</button><button class="key" data-f="329.63">02 / OCHRE</button><button class="key" data-f="392">03 / SAGE</button><button class="key" data-f="440">04 / BLUE</button><button class="key" data-f="523.25">05 / LILAC</button></main><div class="status" id="status">SELECT A COLOR TO PLAY</div></div><script>let ctx;document.querySelectorAll('.key').forEach(k=>k.onclick=()=>{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=+k.dataset.f;g.gain.setValueAtTime(.15,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.6);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.6);document.querySelector('#status').textContent='PLAYING / '+k.textContent})</script></body></html>
