<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet Grid</title><style>*{box-sizing:border-box}body{margin:0;background:#f1eee5;color:#3a4945;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.intro{display:flex;justify-content:space-between;align-items:end;margin:50px 0 30px;gap:20px}h1{font:400 clamp(60px,8vw,110px)/.85 Georgia;letter-spacing:-.06em;margin:0}.intro p{font-size:14px;line-height:1.7;max-width:270px;color:#82918a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{aspect-ratio:1;border:0;background:#bfd1c4;cursor:pointer;transition:background .3s}.cell.on{background:#d7957c}.foot{margin-top:25px;font-size:10px;letter-spacing:.15em}@media(max-width:600px){.intro{display:block}.intro p{margin-top:20px}}</style></head><body><div class="wrap"><header><span>QUIET GRID</span><span>COLOR STUDY / 092</span></header><div class="intro"><h1>A little<br><i>order.</i></h1><p>Tap the squares to make a simple composition in two colors.</p></div><main class="grid"><button class="cell" aria-label="Square 1"></button><button class="cell" aria-label="Square 2"></button><button class="cell" aria-label="Square 3"></button><button class="cell" aria-label="Square 4"></button><button class="cell" aria-label="Square 5"></button><button class="cell" aria-label="Square 6"></button><button class="cell" aria-label="Square 7"></button><button class="cell" aria-label="Square 8"></button><button class="cell" aria-label="Square 9"></button><button class="cell" aria-label="Square 10"></button><button class="cell" aria-label="Square 11"></button><button class="cell" aria-label="Square 12"></button><button class="cell" aria-label="Square 13"></button><button class="cell" aria-label="Square 14"></button><button class="cell" aria-label="Square 15"></button><button class="cell" aria-label="Square 16"></button></main><div class="foot">COLOR / REPETITION / PLAY</div></div><script>document.querySelectorAll('.cell').forEach(c=>c.onclick=()=>c.classList.toggle('on'))</script></body></html>
