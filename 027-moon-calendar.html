<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Calendar</title><style>*{box-sizing:border-box}body{margin:0;background:#dedad0;color:#383a39;font-family:Georgia,serif}.wrap{max-width:1200px;margin:auto;padding:30px 5vw}header{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em;border-bottom:1px solid;padding-bottom:20px}.intro{display:flex;justify-content:space-between;align-items:end;margin:60px 0 40px;gap:20px}h1{font-weight:400;font-size:clamp(60px,8vw,110px);line-height:.85;letter-spacing:-.06em;margin:0}.intro p{font:14px/1.7 Arial;max-width:270px;color:#858680}.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.phase{background:#293944;color:#e4e3d9;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:35px;border:0;cursor:pointer}.moon{width:100px;height:100px;border-radius:50%;background:#e4ddc7;box-shadow:0 0 30px #eee6d033}.phase:nth-child(2) .moon{clip-path:inset(0 0 0 45%)}.phase:nth-child(3) .moon{background:#687578}.phase:nth-child(4) .moon{clip-path:inset(0 45% 0 0)}.phase span{font:10px Arial;letter-spacing:.15em}.note{font:italic 20px Georgia;min-height:50px;margin:30px 0;color:#707571}@media(max-width:700px){.phases{grid-template-columns:1fr 1fr}.phase{min-height:220px}.intro{display:block}.intro p{margin-top:25px}}</style></head><body><div class="wrap"><header><span>THE MOON CALENDAR</span><span>AN OBSERVATION / 027</span></header><div class="intro"><h1>Everything<br>has a <i>phase.</i></h1><p>A small reminder that change has a rhythm of its own. Choose a moon to explore.</p></div><main class="phases"><button class="phase" data-note="Full moon: a moment to notice what has come into view."><div class="moon"></div><span>01 / FULL</span></button><button class="phase" data-note="Waning: make space for what comes next."><div class="moon"></div><span>02 / WANING</span></button><button class="phase" data-note="New moon: the beginning can be quiet."><div class="moon"></div><span>03 / NEW</span></button><button class="phase" data-note="Waxing: a little light returns each day."><div class="moon"></div><span>04 / WAXING</span></button></main><div class="note" id="note" aria-live="polite">Choose a phase.</div></div><script>document.querySelectorAll('.phase').forEach(p=>p.onclick=()=>document.querySelector('#note').textContent=p.dataset.note)</script></body></html>
