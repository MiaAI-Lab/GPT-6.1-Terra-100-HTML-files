<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tide Pool</title><style>*{box-sizing:border-box}body{margin:0;background:#d5e5df;color:#23483f;font-family:Arial,sans-serif}header{padding:25px 4vw;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.layout{display:grid;grid-template-columns:1fr 1.3fr;min-height:80vh}.copy{padding:5vw;display:flex;flex-direction:column;justify-content:center}h1{font:400 clamp(65px,8vw,115px)/.87 Georgia;letter-spacing:-.06em;margin:30px 0}p{font-size:14px;line-height:1.8;color:#66877c;max-width:300px}.pool{margin:3vw;background:#76ada2;border-radius:48% 52% 44% 56%;min-height:560px;position:relative;overflow:hidden;box-shadow:inset 0 0 80px #275e5880}.pool:before,.pool:after{content:'';position:absolute;inset:15%;border:1px solid #d5eee055;border-radius:50%;animation:ripple 5s ease-out infinite}.pool:after{animation-delay:-2.5s}.stone{position:absolute;border-radius:50%;background:#d2c7a6;box-shadow:inset -8px -8px #a89c80}.stone.a{width:90px;height:70px;top:25%;left:25%}.stone.b{width:130px;height:100px;bottom:20%;right:20%;background:#b4bda2}.stone.c{width:50px;height:45px;top:45%;right:30%;background:#e0b49b}button{align-self:start;background:#2f685c;color:white;border:0;padding:16px 23px;margin-top:20px;font-size:10px;letter-spacing:.15em;cursor:pointer}@keyframes ripple{from{transform:scale(.4);opacity:.8}to{transform:scale(1.4);opacity:0}}.still:before,.still:after{animation-play-state:paused}@media(max-width:700px){.layout{grid-template-columns:1fr}.pool{min-height:450px;grid-row:1}.copy{padding:50px 30px}}@media(prefers-reduced-motion:reduce){.pool:before,.pool:after{animation:none}}</style></head><body><header><span>TIDE POOL</span><span>SMALL WORLDS / 026</span></header><main class="layout"><section class="copy"><small>A MOMENT AT THE EDGE</small><h1>A world<br>in a <i>pool.</i></h1><p>Between the tides, a tiny landscape holds the whole sky. Stay and watch the water move.</p><button id="pause">STILL THE WATER &nbsp; Ⅱ</button></section><div class="pool" id="pool"><div class="stone a"></div><div class="stone b"></div><div class="stone c"></div></div></main><script>document.querySelector('#pause').onclick=e=>{let x=document.querySelector('#pool').classList.toggle('still');e.currentTarget.textContent=x?'MOVE THE WATER  ▶':'STILL THE WATER  Ⅱ'}</script></body></html>
