<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jellyfish</title><style>*{box-sizing:border-box}body{margin:0;background:#10283a;color:#d9f0e9;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.sea{height:550px;background:radial-gradient(circle,#2e6e77,#17394b 65%,#10283a);display:grid;place-items:center;overflow:hidden}.jelly{width:200px;height:130px;border-radius:100px 100px 30px 30px;background:linear-gradient(#b8e2d9aa,#6db9bb88);box-shadow:0 0 60px #9debd888;position:relative;animation:float 4s ease-in-out infinite alternate}.jelly:after{content:'';position:absolute;top:100%;left:15%;width:70%;height:180px;background:repeating-linear-gradient(90deg,transparent 0 15px,#a3dcd5 16px 18px,transparent 19px 35px);border-radius:0 0 50% 50%}.paused{animation-play-state:paused}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#96bdb9;max-width:300px}button{background:none;border:1px solid #a9d1c9;color:#d9f0e9;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@keyframes float{to{transform:translateY(-30px)}}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.sea{grid-row:1;height:450px}}@media(prefers-reduced-motion:reduce){.jelly{animation:none}}</style></head><body><div class="wrap"><header><span>JELLYFISH</span><span>OCEAN STUDY / 087</span></header><main class="layout"><section><small>DRIFTING THROUGH THE BLUE</small><h1>Move<br>like <i>water.</i></h1><p>An imagined jellyfish drifts through a quiet, luminous sea.</p><button id="pause">PAUSE THE DRIFT &nbsp; Ⅱ</button></section><div class="sea"><div class="jelly" id="jelly"></div></div></main><footer><span>LIGHT / WATER / MOTION</span><span>BELOW THE SURFACE</span></footer></div><script>document.querySelector('#pause').onclick=e=>{let p=document.querySelector('#jelly').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE DRIFT  ▶':'PAUSE THE DRIFT  Ⅱ'}</script></body></html>
