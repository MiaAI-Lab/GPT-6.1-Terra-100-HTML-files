<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elsewhere Metro</title><style>*{box-sizing:border-box}body{margin:0;background:#f2eddf;color:#242b2d;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:2px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.intro{display:flex;justify-content:space-between;align-items:end;margin:50px 0 35px;gap:20px}h1{font-size:clamp(60px,9vw,120px);letter-spacing:-.08em;line-height:.85;margin:0}.intro p{font-size:14px;line-height:1.7;max-width:260px;color:#7d8580}.map{background:#dce5de;min-height:450px;position:relative;display:flex;align-items:center;justify-content:space-around;padding:30px;overflow:hidden}.map:before{content:'';position:absolute;left:10%;right:10%;top:50%;height:8px;background:#d56b4d}.stop{position:relative;z-index:1;border:5px solid #d56b4d;background:#f7f0df;border-radius:50%;width:34px;height:34px;cursor:pointer}.stop span{position:absolute;top:45px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;font-weight:bold;letter-spacing:.1em}.info{margin-top:25px;min-height:60px;font:italic 20px Georgia;color:#6c7a72}@media(max-width:600px){.intro{display:block}.intro p{margin-top:25px}.map{min-height:350px}.stop span{writing-mode:vertical-rl;top:42px}}</style></head><body><div class="wrap"><header><span>ELSEWHERE METRO</span><span>A MAP OF IMAGINARY PLACES / 034</span></header><div class="intro"><h1>Take the<br>long way.</h1><p>Four stops on a line that goes wherever your imagination wants to go.</p></div><main class="map"><button class="stop" data-note="Sunrise: the first light and the beginning of anything."><span>SUNRISE</span></button><button class="stop" data-note="Garden: a place to stop and listen to the leaves."><span>GARDEN</span></button><button class="stop" data-note="Riverside: follow the water until the city disappears."><span>RIVERSIDE</span></button><button class="stop" data-note="Elsewhere: the best destination is the one you invent."><span>ELSEWHERE</span></button></main><div class="info" id="info" aria-live="polite">Choose a stop to explore.</div></div><script>document.querySelectorAll('.stop').forEach(s=>s.onclick=()=>document.querySelector('#info').textContent=s.dataset.note)</script></body></html>
