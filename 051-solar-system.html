<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Small Solar System</title><style>*{box-sizing:border-box}body{margin:0;background:#111829;color:#e7e7da;font-family:Arial,sans-serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1.2fr;align-items:center;gap:4vw}h1{font:400 clamp(60px,8vw,115px)/.87 Georgia;letter-spacing:-.06em;margin:25px 0}p{font-size:14px;line-height:1.8;color:#9da9b7;max-width:300px}.universe{aspect-ratio:1;position:relative;display:grid;place-items:center}.orbit{position:absolute;border:1px solid #71809366;border-radius:50%;inset:10%;animation:spin 20s linear infinite}.orbit:nth-child(2){inset:22%;animation-duration:12s}.orbit:nth-child(3){inset:34%;animation-duration:7s}.orbit:after{content:'';position:absolute;top:50%;left:-8px;width:16px;height:16px;border-radius:50%;background:#d8a477}.orbit:nth-child(2):after{background:#8db8ae}.orbit:nth-child(3):after{background:#c3a4b9}.sun{width:16%;aspect-ratio:1;background:#e7c27f;border-radius:50%;box-shadow:0 0 45px #e5bd7777}button{background:none;border:1px solid #a9b8bd;color:#e7e7da;padding:15px 22px;margin-top:20px;font-size:10px;letter-spacing:.15em;cursor:pointer}.paused .orbit{animation-play-state:paused}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.universe{grid-row:1}}@media(prefers-reduced-motion:reduce){.orbit{animation:none}}</style></head><body><div class="wrap"><header><span>SMALL SOLAR SYSTEM</span><span>AN ORBITAL STUDY / 051</span></header><main class="layout"><section><small>THINGS IN MOTION</small><h1>A little<br>universe<br>of <i>your own.</i></h1><p>Three imagined worlds orbit a small sun. Watch them move at their own pace.</p><button id="pause">PAUSE THE ORBITS &nbsp; Ⅱ</button></section><div class="universe" id="universe"><div class="orbit"></div><div class="orbit"></div><div class="orbit"></div><div class="sun"></div></div></main><footer><span>AN IMAGINARY SYSTEM</span><span>STAR / PLANET / SPACE</span></footer></div><script>document.querySelector('#pause').onclick=e=>{let p=document.querySelector('#universe').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE ORBITS  ▶':'PAUSE THE ORBITS  Ⅱ'}</script></body></html>
