<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tea Ceremony</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e2d0;color:#41493c;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}header{border-bottom:1px solid;padding-bottom:20px}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}.art{aspect-ratio:1;background:#c6c8ad;display:grid;place-items:center;position:relative}.saucer{width:65%;aspect-ratio:1;border-radius:50%;background:#e6e1ca;display:grid;place-items:center;box-shadow:10px 15px #8c967b55}.cup{width:53%;aspect-ratio:1;border-radius:50%;background:#b18855;border:20px solid #f5eedb;box-shadow:5px 8px #8b806055}.art small{position:absolute;bottom:25px;left:25px;font:10px Arial;letter-spacing:.15em}h1{font-size:clamp(65px,8vw,115px);line-height:.87;letter-spacing:-.06em;font-weight:400;margin:25px 0}p{font:14px/1.8 Arial;color:#7d8876;max-width:310px}button{background:#596b55;color:white;border:0;padding:16px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>THE TEA CEREMONY</span><span>A RITUAL / 039</span></header><main class="layout"><div class="art"><div class="saucer"><div class="cup"></div></div><small>A WARM MOMENT</small></div><section><small>FOR THE SPACE BETWEEN THINGS</small><h1>Steep in<br>the <i>moment.</i></h1><p id="ritual">Warm the cup. Choose your tea. Let the water settle.</p><button id="next">CONTINUE THE RITUAL ↗</button></section></main><footer><span>ONE CUP / ONE MOMENT</span><span>TAKE YOUR TIME</span></footer></div><script>let n=0;const t=['Warm the cup. Choose your tea. Let the water settle.','Pour slowly and watch the color unfold.','Hold the cup, breathe, and enjoy the quiet.'];document.querySelector('#next').onclick=()=>{n=(n+1)%3;document.querySelector('#ritual').textContent=t[n]}</script></body></html>
