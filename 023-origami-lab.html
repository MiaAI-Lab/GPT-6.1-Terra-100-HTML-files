<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Origami Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#f4e8d8;color:#302d2a;font-family:Arial,sans-serif}header{padding:25px 5vw;display:flex;justify-content:space-between;border-bottom:1px solid;font-size:10px;letter-spacing:.2em}.content{display:grid;grid-template-columns:1fr 1fr;min-height:80vh}.art{display:grid;place-items:center;background:#dfaaa0;overflow:hidden;position:relative}.bird{width:min(60%,360px);aspect-ratio:1;position:relative;transition:transform .8s}.bird:before,.bird:after{content:'';position:absolute;inset:0;background:#f8eee2;clip-path:polygon(0 15%,100% 50%,25% 76%)}.bird:after{background:#decebf;clip-path:polygon(25% 76%,50% 47%,65% 100%)}.bird.fly{transform:translate(30%,-30%) rotate(-12deg)}.art small{position:absolute;bottom:30px;left:30px;letter-spacing:.2em}.copy{padding:6vw;display:flex;flex-direction:column;justify-content:center}h1{font:400 clamp(65px,8vw,115px)/.87 Georgia;letter-spacing:-.06em;margin:30px 0}p{font-size:14px;line-height:1.8;color:#8e7a70;max-width:320px}button{align-self:start;border:1px solid;background:none;padding:16px 22px;cursor:pointer;font-size:10px;letter-spacing:.15em;margin-top:20px}@media(max-width:700px){.content{grid-template-columns:1fr}.art{min-height:50vh}.copy{padding:55px 30px}}</style></head><body><header><span>ORIGAMI LAB</span><span>FOLD STUDY / 023</span></header><main class="content"><div class="art"><div class="bird" id="bird"></div><small>PAPER / LIGHT / AIR</small></div><section class="copy"><small>AN IDEA IN THREE FOLDS</small><h1>Give an<br>idea <i>wings.</i></h1><p>A sheet becomes a gesture. A gesture becomes a little invitation to imagine.</p><button id="fly">LET IT FLY &nbsp; ↗</button></section></main><script>document.querySelector('#fly').onclick=e=>{let f=document.querySelector('#bird').classList.toggle('fly');e.currentTarget.textContent=f?'BRING IT BACK  ↙':'LET IT FLY  ↗'}</script></body></html>
