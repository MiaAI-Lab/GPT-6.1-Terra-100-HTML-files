<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sun Print</title><style>*{box-sizing:border-box}body{margin:0;background:#ede2c8;color:#7b4d39;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;background:#d8966d;display:grid;place-items:center;position:relative}.sun{width:50%;aspect-ratio:1;background:#f2d28e;border-radius:50%;box-shadow:0 0 0 20px #edbc83,0 0 0 40px #e5aa78;transition:transform .8s}.sun.grow{transform:scale(1.2)}.art small{position:absolute;bottom:25px;left:25px;font:10px Arial;letter-spacing:.2em}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#a87e65;max-width:300px}button{background:none;border:1px solid #ad8065;color:#7b4d39;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>SUN PRINT</span><span>COLOR STUDY / 075</span></header><main class="layout"><div class="art"><div class="sun" id="sun"></div><small>LIGHT / WARMTH / FORM</small></div><section><small>A LITTLE MORE LIGHT</small><h1>Keep the<br><i>sun</i> close.</h1><p>A simple circle holds the warmth of a long afternoon.</p><button id="grow">MAKE IT BRIGHTER ↗</button></section></main><footer><span>AN ABSTRACT AFTERNOON</span><span>ONE CIRCLE / MANY RAYS</span></footer></div><script>document.querySelector('#grow').onclick=()=>document.querySelector('#sun').classList.toggle('grow')</script></body></html>
