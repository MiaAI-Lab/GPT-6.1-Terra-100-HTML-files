<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northern Lights</title><style>*{box-sizing:border-box}body{margin:0;background:#071a2a;color:#deeee4;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.scene{flex:1;min-height:600px;position:relative;overflow:hidden;margin:30px 0;background:radial-gradient(ellipse at 50% 25%,#335a68,#10263c 60%,#071a2a)}.aurora{position:absolute;width:140%;height:50%;left:-20%;top:5%;background:linear-gradient(100deg,transparent,#7ee3b055,#8cb4e966,#b07cdd44,transparent);filter:blur(35px);transform:rotate(-12deg);animation:flow 8s ease-in-out infinite alternate}.mountains{position:absolute;bottom:0;width:100%;height:35%;background:#0c202b;clip-path:polygon(0 100%,0 65%,20% 10%,35% 65%,55% 0,75% 70%,90% 25%,100% 65%,100% 100%)}.copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}h1{font-size:clamp(65px,9vw,125px);line-height:.85;letter-spacing:-.06em;font-weight:400;margin:25px 0}.copy p{font:14px/1.7 Arial;max-width:270px;color:#b0cbc5}button{background:none;border:1px solid #bbd9d0;color:#e7f3ed;padding:15px 22px;font:10px Arial;letter-spacing:.15em;cursor:pointer;margin-top:20px}@keyframes flow{to{transform:rotate(5deg) translateY(40px)}}.paused{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.aurora{animation:none}}</style></head><body><div class="wrap"><header><span>NORTHERN LIGHTS</span><span>SKY STUDY / 049</span></header><main class="scene"><div class="aurora" id="aurora"></div><div class="mountains"></div><div class="copy"><small>LOOK UP AND STAY A WHILE</small><h1>The sky<br>is <i>alive.</i></h1><p>Color moves quietly across the dark, a reminder that even the night can glow.</p><button id="toggle">PAUSE THE LIGHT &nbsp; Ⅱ</button></div></main><footer><span>AN IMAGINED NORTHERN SKY</span><span>LIGHT / COLOR / NIGHT</span></footer></div><script>document.querySelector('#toggle').onclick=e=>{let p=document.querySelector('#aurora').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE LIGHT  ▶':'PAUSE THE LIGHT  Ⅱ'}</script></body></html>
