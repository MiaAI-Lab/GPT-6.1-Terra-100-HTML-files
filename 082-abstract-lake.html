<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abstract Lake</title><style>*{box-sizing:border-box}body{margin:0;background:#e2e6d9;color:#3d5b55;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;background:linear-gradient(#b3cabc 0 50%,#749e96 50%);position:relative;overflow:hidden}.sun{position:absolute;width:25%;aspect-ratio:1;border-radius:50%;background:#e9dfbc;top:15%;left:38%}.reflection{position:absolute;width:25%;height:25%;top:55%;left:38%;background:repeating-linear-gradient(#d3d8bb 0 4px,transparent 5px 15px);transition:transform .8s}.reflection.move{transform:scaleX(1.5)}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#829b91;max-width:300px}button{background:none;border:1px solid #8ba99a;color:#3d5b55;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>ABSTRACT LAKE</span><span>REFLECTION STUDY / 082</span></header><main class="layout"><div class="art"><div class="sun"></div><div class="reflection" id="reflection"></div></div><section><small>WATER HOLDS THE SKY</small><h1>See it<br><i>twice.</i></h1><p>A circle above, a shimmer below. A quiet study in reflection.</p><button id="ripple">DISTURB THE WATER ↗</button></section></main><footer><span>LIGHT / WATER / REFLECTION</span><span>AN IMAGINARY LAKE</span></footer></div><script>document.querySelector('#ripple').onclick=()=>document.querySelector('#reflection').classList.toggle('move')</script></body></html>
