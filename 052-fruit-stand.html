<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Stand</title><style>*{box-sizing:border-box}body{margin:0;background:#f4ebcc;color:#313128;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:2px solid;padding-bottom:20px;font-size:10px;font-weight:bold;letter-spacing:.2em}.title{text-align:center;padding:55px 0 35px}h1{font-size:clamp(65px,10vw,130px);line-height:.8;letter-spacing:-.09em;margin:20px 0}.title p{font:italic 20px Georgia}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{height:350px;border:0;position:relative;display:grid;place-items:center;background:#e5aa54;cursor:pointer}.card:nth-child(2){background:#dc7f63}.card:nth-child(3){background:#a6b77d}.fruit{width:140px;height:140px;border-radius:50%;background:#f4d162;box-shadow:inset -15px -15px #d9af4e}.card:nth-child(2) .fruit{background:#e75d4c;box-shadow:inset -15px -15px #c94c42}.card:nth-child(3) .fruit{background:#d5d46b;box-shadow:inset -15px -15px #a9ae54}.fruit:before{content:'';display:block;width:45px;height:18px;background:#5d7950;border-radius:100% 0;transform:translate(75px,-10px) rotate(-25deg)}.card span{position:absolute;bottom:20px;left:20px;font-size:10px;font-weight:bold;letter-spacing:.15em}.note{text-align:center;font:italic 20px Georgia;padding:30px;min-height:90px}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{height:240px}}</style></head><body><div class="wrap"><header><span>THE FRUIT STAND</span><span>FRESH COLOR / 052</span></header><div class="title"><small>GOOD THINGS GROW HERE</small><h1>PICK A<br>HAPPY.</h1><p>A little color for the day ahead.</p></div><main class="grid"><button class="card" data-note="A little brightness, just for you."><div class="fruit"></div><span>01 / LEMON</span></button><button class="card" data-note="A sweet moment is on its way."><div class="fruit"></div><span>02 / APPLE</span></button><button class="card" data-note="A fresh beginning looks good on you."><div class="fruit"></div><span>03 / PEAR</span></button></main><div class="note" id="note" aria-live="polite">Choose a fruit.</div></div><script>document.querySelectorAll('.card').forEach(c=>c.onclick=()=>document.querySelector('#note').textContent=c.dataset.note)</script></body></html>
