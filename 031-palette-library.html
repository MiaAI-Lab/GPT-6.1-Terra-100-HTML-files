<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palette Library</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e8;color:#25282a;font-family:Arial,sans-serif}.wrap{padding:30px 4vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.intro{display:flex;justify-content:space-between;align-items:end;margin:60px 0 35px;gap:20px}h1{font-size:clamp(60px,9vw,130px);line-height:.8;letter-spacing:-.08em;margin:0;font-weight:400}.intro p{font-size:14px;line-height:1.7;max-width:280px;color:#777}.palette{display:grid;grid-template-columns:repeat(5,1fr);height:48vh;min-height:320px}.swatch{border:0;cursor:pointer;display:flex;align-items:end;padding:20px;color:#fff;font:11px monospace;letter-spacing:.1em;text-align:left}.swatch:nth-child(1){background:#344e53}.swatch:nth-child(2){background:#80a194}.swatch:nth-child(3){background:#d1c5a3;color:#333}.swatch:nth-child(4){background:#d99674}.swatch:nth-child(5){background:#a64f45}.foot{display:flex;justify-content:space-between;margin-top:25px;font-size:10px;letter-spacing:.15em}.notice{min-height:30px;margin-top:25px;color:#667;font-size:13px}@media(max-width:700px){.intro{display:block}.intro p{margin-top:25px}.palette{grid-template-columns:1fr;height:auto}.swatch{height:85px}}</style></head><body><div class="wrap"><header><span>THE PALETTE LIBRARY</span><span>COLOR STUDY / 031</span></header><div class="intro"><h1>Colors<br>that <i>belong.</i></h1><p>A collection inspired by weathered coastlines, warm stone and the last light of day. Select a swatch to copy its value.</p></div><main class="palette"><button class="swatch" data-color="#344E53">01 / DEEP WATER<br>#344E53</button><button class="swatch" data-color="#80A194">02 / SEA GLASS<br>#80A194</button><button class="swatch" data-color="#D1C5A3">03 / SAND<br>#D1C5A3</button><button class="swatch" data-color="#D99674">04 / CLAY<br>#D99674</button><button class="swatch" data-color="#A64F45">05 / RUST<br>#A64F45</button></main><div class="foot"><span>COASTAL COLLECTION</span><span>FIVE COLORS / ONE PLACE</span></div><div class="notice" id="notice" aria-live="polite"></div></div><script>document.querySelectorAll('.swatch').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.color);document.querySelector('#notice').textContent=b.dataset.color+' copied.'}catch(e){document.querySelector('#notice').textContent='Color: '+b.dataset.color}})</script></body></html>
