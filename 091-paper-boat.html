<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Boat</title><style>*{box-sizing:border-box}body{margin:0;background:#d8e5df;color:#3f5e58;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.scene{flex:1;min-height:500px;position:relative;overflow:hidden;margin:30px 0;background:linear-gradient(#b9d3cc 0 55%,#83b2aa 55%)}.boat{position:absolute;top:50%;left:50%;width:200px;height:100px;background:#f5eee0;clip-path:polygon(0 30%,50% 0,100% 30%,80% 100%,20% 100%);transform:translateX(-50%);animation:bob 3s ease-in-out infinite alternate}.boat:after{content:'';position:absolute;left:50%;height:100%;border-left:1px solid #d2c7b5}.copy{position:absolute;top:10%;left:5%}h1{font-size:clamp(60px,8vw,110px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.7 Arial;max-width:270px;color:#6e9189}button{background:#507c6f;color:white;border:0;padding:15px 22px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.paused{animation-play-state:paused}@keyframes bob{to{transform:translate(-50%,15px) rotate(4deg)}}@media(max-width:600px){.boat{top:65%}}@media(prefers-reduced-motion:reduce){.boat{animation:none}}</style></head><body><div class="wrap"><header><span>PAPER BOAT</span><span>A SMALL JOURNEY / 091</span></header><main class="scene"><div class="boat" id="boat"></div><div class="copy"><small>SET SOMETHING FREE</small><h1>Let it<br><i>drift.</i></h1><p>A small paper boat has all the water it needs to begin.</p><button id="pause">STILL THE BOAT &nbsp; Ⅱ</button></div></main><footer><span>PAPER / WATER / POSSIBILITY</span><span>AN IMAGINARY JOURNEY</span></footer></div><script>document.querySelector('#pause').onclick=e=>{let p=document.querySelector('#boat').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE DRIFT  ▶':'STILL THE BOAT  Ⅱ'}</script></body></html>
