<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Stack</title><style>*{box-sizing:border-box}body{margin:0;background:#d9d0c4;color:#51483f;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.stack{aspect-ratio:1;position:relative;display:grid;place-items:center}.sheet{position:absolute;width:65%;height:70%;background:#f5eee0;box-shadow:0 10px 30px #695c4c33;transform:rotate(-8deg)}.sheet:nth-child(2){background:#e7d3bd;transform:rotate(5deg)}.sheet:nth-child(3){background:#f9f4e8;transform:rotate(-2deg);display:grid;place-items:center;font:italic 24px Georgia;color:#a08d7b;transition:transform .8s}.sheet.turn{transform:rotate(12deg) translate(20px,-20px)}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#9a8b7d;max-width:300px}button{background:#78695b;color:white;border:0;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.stack{grid-row:1}}</style></head><body><div class="wrap"><header><span>PAPER STACK</span><span>OBJECT STUDY / 076</span></header><main class="layout"><section><small>THE BEGINNING OF AN IDEA</small><h1>A blank<br>page is<br><i>enough.</i></h1><p>Every page is a place to begin. Turn one and see what might come next.</p><button id="turn">TURN THE PAGE ↗</button></section><div class="stack"><div class="sheet"></div><div class="sheet"></div><div class="sheet" id="top">begin anywhere.</div></div></main><footer><span>PAPER / POSSIBILITY / PLAY</span><span>THE FIRST PAGE</span></footer></div><script>document.querySelector('#turn').onclick=()=>document.querySelector('#top').classList.toggle('turn')</script></body></html>
