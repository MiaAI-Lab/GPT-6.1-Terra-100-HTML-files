<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night Train</title><style>*{box-sizing:border-box}body{margin:0;background:#172738;color:#e9e6d9;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.scene{flex:1;min-height:550px;position:relative;overflow:hidden;margin:30px 0;background:linear-gradient(#243e54,#5c6c72)}.moon{position:absolute;width:100px;height:100px;border-radius:50%;background:#eee7ce;top:15%;right:20%}.hills{position:absolute;bottom:0;width:130%;height:35%;left:-15%;border-radius:50% 50% 0 0;background:#233c46}.train{position:absolute;bottom:15%;left:15%;width:70%;height:70px;background:#b88b6e;border-radius:15px 15px 3px 3px;box-shadow:0 10px #192f38;transition:transform 1s}.train:after{content:'▣   ▣   ▣   ▣   ▣';display:block;color:#f2dba9;text-align:center;font-size:30px;padding-top:14px;white-space:nowrap;overflow:hidden}.copy{position:absolute;top:10%;left:5%}h1{font-size:clamp(60px,8vw,110px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.7 Arial;max-width:280px;color:#ced7d2}button{background:none;border:1px solid #ced7d2;color:#fff;padding:15px 22px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.train.move{transform:translateX(120%)}@media(max-width:600px){.scene{min-height:70vh}.train{width:90%;left:5%}}</style></head><body><div class="wrap"><header><span>THE NIGHT TRAIN</span><span>DEPARTURE / 074</span></header><main class="scene"><div class="moon"></div><div class="hills"></div><div class="train" id="train"></div><div class="copy"><small>ALL ABOARD FOR ELSEWHERE</small><h1>Travel<br>through<br>the <i>quiet.</i></h1><p>The lights are warm, the windows are dark, and the journey is just beginning.</p><button id="depart">LET THE TRAIN DEPART ↗</button></div></main><footer><span>AN IMAGINARY JOURNEY</span><span>NIGHT / RAIL / DISTANCE</span></footer></div><script>document.querySelector('#depart').onclick=e=>{let m=document.querySelector('#train').classList.toggle('move');e.currentTarget.textContent=m?'BRING THE TRAIN BACK ↙':'LET THE TRAIN DEPART ↗'}</script></body></html>
