<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildflower Note</title><style>*{box-sizing:border-box}body{margin:0;background:#e6dfc9;color:#4b5440;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}.art{aspect-ratio:1;background:#c7d0ac;position:relative;overflow:hidden}.stem{position:absolute;bottom:0;left:50%;height:60%;border-left:4px solid #71875d}.flower{position:absolute;left:50%;top:25%;width:80px;height:80px;background:#e2b85d;border-radius:50%;transform:translateX(-50%);box-shadow:0 -45px #f2e6ce,0 45px #f2e6ce,45px 0 #f2e6ce,-45px 0 #f2e6ce}.leaf{position:absolute;bottom:20%;left:50%;width:100px;height:40px;background:#819b6d;border-radius:100% 0;transform:rotate(-30deg)}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#8b977d;max-width:300px}button{background:none;border:1px solid #8b9e7b;color:#4b5440;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>WILDFLOWER NOTE</span><span>BOTANICAL STUDY / 065</span></header><main class="layout"><div class="art"><div class="stem"></div><div class="leaf"></div><div class="flower"></div></div><section><small>GROWING WITHOUT A PLAN</small><h1>A little<br><i>wild</i> is<br>beautiful.</h1><p id="note">Some things find their way by growing toward the light.</p><button id="next">ANOTHER NOTE ↗</button></section></main><footer><span>A FLOWER FOR TODAY</span><span>GROW / BLOOM / REPEAT</span></footer></div><script>let n=0;const t=['Some things find their way by growing toward the light.','Leave room for the unexpected to bloom.','The smallest things can change the whole view.'];document.querySelector('#next').onclick=()=>{n=(n+1)%3;document.querySelector('#note').textContent=t[n]}</script></body></html>
