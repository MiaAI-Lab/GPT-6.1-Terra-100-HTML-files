<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidal Observatory</title><style>
*{box-sizing:border-box}body{margin:0;background:#081c26;color:#e6f2ed;font-family:Georgia,serif}main{min-height:100vh;position:relative;overflow:hidden;padding:3vw 5vw;display:flex;flex-direction:column;background:radial-gradient(ellipse at 72% 70%,#285c5d 0,transparent 42%),linear-gradient(150deg,#071b24,#0c3038)}nav,.meta{display:flex;justify-content:space-between;align-items:center;font:11px/1.4 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}nav span:last-child{border:1px solid #a9cbc1;border-radius:50%;padding:16px}article{position:relative;z-index:2;margin:auto 0;max-width:650px;padding:8vh 0}small{font:11px Arial,sans-serif;letter-spacing:.25em;color:#a8cabe}h1{font-size:clamp(64px,10vw,150px);line-height:.84;font-weight:400;letter-spacing:-.065em;margin:30px 0}h1 i{color:#b5d3c5;font-weight:400}p{font:16px/1.7 Arial,sans-serif;color:#b5cfca;max-width:340px}button{margin-top:25px;background:#d2e2d3;border:0;border-radius:50px;padding:17px 24px;color:#15383a;cursor:pointer;letter-spacing:.08em;font-size:11px}.moon{position:absolute;right:10%;top:20%;width:min(37vw,510px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2e8c9,#b4c7b8 45%,#557f7c 75%,#173f47);box-shadow:0 0 100px #8bbfb63d;animation:rise 8s ease-in-out infinite alternate}.moon:after{content:'';position:absolute;inset:-12%;border:1px solid #b2d5ca44;border-radius:50%}.waves{position:absolute;bottom:-35%;left:-20%;width:140%;height:65%;border-radius:50%;border:1px solid #97c5b766;box-shadow:0 -20px #7fb3aa18,0 -40px #7fb3aa16,0 -60px #7fb3aa12,0 -80px #7fb3aa10;transform:rotate(-5deg);animation:sway 9s ease-in-out infinite alternate}.meta{z-index:2;color:#a2c0ba}.meta b{font-size:22px;font-weight:400;color:#e7f2ed} @keyframes rise{to{transform:translateY(-18px)}}@keyframes sway{to{transform:rotate(0deg) translateY(-15px)}}@media(max-width:650px){main{min-height:100svh;padding:25px}.moon{width:65vw;right:-15%;top:19%;opacity:.6}article{padding:12vh 0}h1{font-size:clamp(64px,17vw,100px)}.meta{gap:20px;font-size:9px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main><nav><div>◌ &nbsp; Tidal Observatory<br><br>Independent ocean studies</div><span>01 / 100</span></nav><div class="moon" aria-hidden="true"></div><div class="waves" aria-hidden="true"></div><article><small>THE QUIET SCIENCE OF THE SEA</small><h1>Where the<br><i>water</i> goes.</h1><p>Follow the invisible conversation between the moon and the ocean, one tide at a time.</p><button id="tide">DISCOVER THE TIDE &nbsp; ↗</button></article><footer class="meta"><div>Current phase<br><br><b id="phase">Rising tide</b></div><div>Observation no.<br><br><b>38° 42′ N</b></div><div>Ocean time<br><br><b id="clock">00:00</b></div></footer></main><script>const p=document.querySelector('#phase');document.querySelector('#tide').onclick=()=>{p.textContent=p.textContent==='Rising tide'?'Falling tide':'Rising tide'};function tick(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,1000)</script></body></html>
