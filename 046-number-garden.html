<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Garden</title><style>*{box-sizing:border-box}body{margin:0;background:#e1e9d5;color:#38513d;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.title{text-align:center;padding:55px 0 35px}h1{font:400 clamp(60px,9vw,120px)/.85 Georgia;letter-spacing:-.06em;margin:20px 0}.title p{font-size:14px;color:#78917a}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.cell{aspect-ratio:1;border:1px solid #9db79e;background:#c3d6b9;color:#38513d;font:40px Georgia;cursor:pointer;transition:background .3s,border-radius .3s}.cell.on{background:#779a78;color:white;border-radius:50%}.foot{margin-top:25px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.15em}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.cell{font-size:30px}}</style></head><body><div class="wrap"><header><span>NUMBER GARDEN</span><span>A SMALL COUNTING GAME / 046</span></header><div class="title"><small>PLANT A LITTLE PATTERN</small><h1>Count what<br><i>grows.</i></h1><p>Tap the numbers in any order and make a garden of circles.</p></div><main class="grid"><button class="cell">1</button><button class="cell">2</button><button class="cell">3</button><button class="cell">4</button><button class="cell">5</button><button class="cell">6</button><button class="cell">7</button><button class="cell">8</button><button class="cell">9</button><button class="cell">10</button></main><div class="foot"><span id="count">0 GROWING</span><span>SHAPE / NUMBER / PLAY</span></div></div><script>const cells=document.querySelectorAll('.cell');cells.forEach(c=>c.onclick=()=>{c.classList.toggle('on');document.querySelector('#count').textContent=document.querySelectorAll('.cell.on').length+' GROWING'})</script></body></html>
