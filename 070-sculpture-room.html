<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sculpture Room</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e0d1;color:#51473e;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.gallery{aspect-ratio:1;background:#d3c4b2;display:grid;place-items:center;position:relative}.pedestal{position:absolute;bottom:0;width:55%;height:18%;background:#eee2d1;box-shadow:15px 0 #baa997}.sculpture{position:absolute;bottom:18%;width:35%;height:55%;border:30px solid #e9d8c3;border-radius:50% 50% 10% 10%;box-shadow:15px 10px #9b887655;transition:transform .8s}.sculpture.turn{transform:rotate(180deg)}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#998a79;max-width:300px}button{background:none;border:1px solid #a49380;color:#51473e;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.gallery{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>THE SCULPTURE ROOM</span><span>OBJECT STUDY / 070</span></header><main class="layout"><div class="gallery"><div class="sculpture" id="sculpture"></div><div class="pedestal"></div></div><section><small>AN OBJECT IN A ROOM</small><h1>Shape<br>holds<br><i>space.</i></h1><p>A simple form changes as you look at it. Turn the object and see another possibility.</p><button id="turn">TURN THE OBJECT ↗</button></section></main><footer><span>FORM / SPACE / LIGHT</span><span>EXHIBITION 01</span></footer></div><script>document.querySelector('#turn').onclick=()=>document.querySelector('#sculpture').classList.toggle('turn')</script></body></html>
