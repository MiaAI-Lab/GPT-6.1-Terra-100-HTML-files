<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sundial</title><style>*{box-sizing:border-box}body{margin:0;background:#e9dbba;color:#5b4933;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{font:10px Arial;letter-spacing:.2em;display:flex;justify-content:space-between}header{border-bottom:1px solid;padding-bottom:20px}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.dial{aspect-ratio:1;border-radius:50%;background:#d2ac72;border:1px solid #806a49;position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 25px #e2c38c,inset 0 0 0 26px #806a49}.dial:before{content:'VI';position:absolute;bottom:8%;font-size:20px}.dial:after{content:'XII';position:absolute;top:8%;font-size:20px}.hand{width:3px;height:38%;background:#5b4933;position:absolute;bottom:50%;transform-origin:bottom;box-shadow:15px 10px 0 #806a4966}.dot{width:18px;height:18px;background:#5b4933;border-radius:50%;z-index:2}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.88;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#927c5d;max-width:300px}.time{font:20px Arial;letter-spacing:.1em;margin-top:30px}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.dial{max-width:400px;width:100%;margin:auto}.copy{padding-top:30px}}</style></head><body><div class="wrap"><header><span>THE SUNDIAL</span><span>A STUDY IN PASSING TIME / 029</span></header><main class="layout"><div class="dial"><div class="hand" id="hand"></div><div class="dot"></div></div><section class="copy"><small>IN THE LIGHT OF THE DAY</small><h1>Time has<br>a <i>shadow.</i></h1><p>A simple dial traces the passing hours. The display follows the time on your device.</p><div class="time" id="time"></div></section></main><footer><span>LOOK UP, THEN LOOK AGAIN</span><span>LOCAL TIME / NOW</span></footer></div><script>function update(){let d=new Date();document.querySelector('#hand').style.transform=`rotate(${(d.getHours()%12+d.getMinutes()/60)*30}deg)`;document.querySelector('#time').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}update();setInterval(update,1000)</script></body></html>
