<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Clock</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e6de;color:#222;font-family:Arial,sans-serif}main{min-height:100vh;padding:30px 4vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;text-transform:uppercase;font-size:10px;letter-spacing:.2em}header{border-bottom:1px solid #222;padding-bottom:20px}.content{flex:1;display:grid;grid-template-columns:1fr 1.5fr;align-items:center;gap:20px}.copy{max-width:420px}h1{font-size:clamp(65px,8vw,120px);line-height:.85;letter-spacing:-.08em;font-weight:400;margin:20px 0}p{max-width:280px;color:#69675f;line-height:1.6;font-size:14px}.tag{font-size:10px;letter-spacing:.2em}.space{position:relative;aspect-ratio:1;max-width:650px;width:100%;margin:auto;display:grid;place-items:center}.ring{position:absolute;border:1px solid #a9a79f;border-radius:50%;inset:9%}.ring:nth-child(2){inset:19%}.ring:nth-child(3){inset:29%}.ring:after{content:'';position:absolute;top:50%;left:-6px;width:12px;height:12px;border-radius:50%;background:#ea6c43}.ring:nth-child(2):after{background:#222}.ring:nth-child(3):after{background:#b8a57b}.core{width:28%;aspect-ratio:1;border-radius:50%;background:#222;color:#e9e6de;display:grid;place-content:center;text-align:center;z-index:2}.time{font-size:clamp(20px,3vw,38px);letter-spacing:-.05em}.date{font-size:8px;letter-spacing:.15em;margin-top:8px}.axis{position:absolute;inset:50% 0 auto;border-top:1px solid #c2c0b7;z-index:-1}.note{position:absolute;right:2%;top:14%;font-size:10px;letter-spacing:.1em;line-height:1.5}footer{border-top:1px solid;padding-top:20px}@media(max-width:700px){.content{grid-template-columns:1fr;padding:50px 0}.space{max-width:450px}.copy{order:2}h1{font-size:70px}} </style></head><body><main><header><span>O / ORBIT CLOCK</span><span>AN INSTRUMENT FOR NOW</span></header><div class="content"><div class="copy"><span class="tag">TIME, IN MOTION &nbsp; / &nbsp; 001</span><h1>A quieter<br>way to<br>watch time.</h1><p>Three celestial paths trace the passing seconds, minutes and hours. Wherever you are, this is your orbit.</p></div><div class="space" aria-label="Animated clock"><div class="ring" id="seconds"></div><div class="ring" id="minutes"></div><div class="ring" id="hours"></div><div class="axis"></div><div class="core"><div class="time" id="time">00:00</div><div class="date" id="date"></div></div><div class="note">LOCAL TIME<br>● IN CONTINUOUS MOTION</div></div></div><footer><span>DESIGNED FOR THE PRESENT</span><span>ONE ROTATION AT A TIME ↗</span></footer></main><script>function update(){const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,h=d.getHours()%12+m/60;document.querySelector('#seconds').style.transform=`rotate(${s*6}deg)`;document.querySelector('#minutes').style.transform=`rotate(${m*6}deg)`;document.querySelector('#hours').style.transform=`rotate(${h*30}deg)`;document.querySelector('#time').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});document.querySelector('#date').textContent=d.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}).toUpperCase();requestAnimationFrame(update)}update()</script></body></html>
