<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Letterforms</title><style>*{box-sizing:border-box}body{margin:0;background:#edeee6;color:#303839;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.intro{display:flex;justify-content:space-between;align-items:end;margin:50px 0 35px;gap:20px}h1{font:400 clamp(60px,8vw,110px)/.85 Georgia;letter-spacing:-.06em;margin:0}.intro p{font-size:14px;line-height:1.7;max-width:260px;color:#81908d}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.letter{aspect-ratio:1;background:#b2c7bf;border:0;color:#354e4b;font:clamp(70px,12vw,160px) Georgia;cursor:pointer;transition:background .3s,color .3s}.letter:nth-child(2){background:#d9b9a5}.letter:nth-child(3){background:#c4bb9d}.letter:nth-child(4){background:#afbac9}.letter.on{background:#344e4a;color:#f1eee1}.note{font:italic 20px Georgia;color:#83918d;margin:30px 0}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.intro{display:block}.intro p{margin-top:20px}}</style></head><body><div class="wrap"><header><span>LETTERFORMS</span><span>A STUDY OF SHAPE / 048</span></header><div class="intro"><h1>Letters<br>as <i>objects.</i></h1><p>Four familiar shapes, presented as a small collection. Select a letter to change its field.</p></div><main class="grid"><button class="letter">A</button><button class="letter">B</button><button class="letter">C</button><button class="letter">D</button></main><div class="note">A little alphabet, seen again.</div></div><script>document.querySelectorAll('.letter').forEach(b=>b.onclick=()=>b.classList.toggle('on'))</script></body></html>
