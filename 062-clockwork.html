<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clockwork</title><style>*{box-sizing:border-box}body{margin:0;background:#e8dfcc;color:#4d4337;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}.clock{aspect-ratio:1;border-radius:50%;background:#d0b68e;border:2px solid #7a664d;box-shadow:inset 0 0 0 25px #e7d4b3,inset 0 0 0 26px #7a664d;position:relative;display:grid;place-items:center}.clock:before{content:'12';position:absolute;top:9%;font:18px Georgia}.clock:after{content:'6';position:absolute;bottom:9%;font:18px Georgia}.hand{position:absolute;bottom:50%;width:3px;height:30%;background:#594738;transform-origin:bottom}.minute{height:38%;width:2px}.dot{width:14px;height:14px;border-radius:50%;background:#594738;z-index:2}h1{font-size:clamp(65px,8vw,115px);line-height:.87;letter-spacing:-.06em;font-weight:400;margin:25px 0}p{font:14px/1.8 Arial;color:#92816b;max-width:300px}.time{font:18px Arial;letter-spacing:.1em;margin-top:25px}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.clock{max-width:400px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>CLOCKWORK</span><span>AN INSTRUMENT / 062</span></header><main class="layout"><div class="clock"><div class="hand" id="hour"></div><div class="hand minute" id="minute"></div><div class="dot"></div></div><section><small>THE HOURS ARE HERE</small><h1>A moment<br>in <i>time.</i></h1><p>A simple clock for the hour you are in, wherever you happen to be.</p><div class="time" id="time"></div></section></main><footer><span>LOCAL TIME / PRESENT</span><span>ONE MOMENT AT A TIME</span></footer></div><script>function tick(){let d=new Date();document.querySelector('#hour').style.transform=`rotate(${(d.getHours()%12+d.getMinutes()/60)*30}deg)`;document.querySelector('#minute').style.transform=`rotate(${d.getMinutes()*6}deg)`;document.querySelector('#time').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,1000)</script></body></html>
