<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Citrus Radio</title><style>
*{box-sizing:border-box}body{margin:0;background:#ffdc35;color:#24241e;font-family:Arial,sans-serif}.shell{min-height:100vh;padding:24px;display:grid;grid-template-columns:1fr 1.15fr;gap:16px}.left,.right{border:2px solid #24241e;border-radius:22px;overflow:hidden}.left{background:#f9f2db;display:flex;flex-direction:column}.top{padding:22px 26px;display:flex;justify-content:space-between;border-bottom:2px solid;font-weight:900;letter-spacing:-.05em}.intro{padding:6vw 4vw;flex:1}.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:bold}h1{font-size:clamp(66px,9vw,145px);line-height:.78;letter-spacing:-.09em;margin:35px 0}h1 span{color:#f46536}p{font-size:15px;line-height:1.6;max-width:300px}.controls{display:flex;gap:12px;margin-top:32px}button{background:#24241e;color:white;border:0;border-radius:50px;padding:16px 23px;font-weight:bold;cursor:pointer}.controls button+button{background:transparent;color:#24241e;border:1px solid}.bottom{border-top:2px solid;padding:20px 26px;font-size:11px;display:flex;justify-content:space-between}.right{background:#f46a3f;position:relative;display:grid;place-items:center;min-height:600px}.record{width:min(70%,520px);aspect-ratio:1;background:repeating-radial-gradient(circle,#23231e 0 2px,#36352d 3px 4px,#24241e 5px 8px);border-radius:50%;display:grid;place-items:center;box-shadow:15px 20px 0 #b7462b;animation:spin 12s linear infinite;animation-play-state:paused}.playing .record{animation-play-state:running}.label{width:39%;aspect-ratio:1;background:#ffdb35;border-radius:50%;display:grid;place-content:center;text-align:center;font-weight:900;font-size:clamp(12px,2vw,28px);letter-spacing:-.07em;line-height:.9;border:2px solid}.label:after{content:'';width:10px;height:10px;background:#222;border-radius:50%;margin:15px auto 0}.sticker{position:absolute;top:30px;right:30px;background:#f7f0d9;width:100px;height:100px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:bold;transform:rotate(14deg)}.track{position:absolute;bottom:30px;left:30px;right:30px;display:flex;justify-content:space-between;font-size:12px;font-weight:bold;letter-spacing:.1em}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.shell{grid-template-columns:1fr}.right{min-height:440px;grid-row:1}.intro{padding:45px 25px}h1{font-size:80px}}@media(prefers-reduced-motion:reduce){.record{animation:none}}</style></head><body><div class="shell"><section class="left"><div class="top"><span>◉ CITRUS RADIO</span><span>EST. 2024</span></div><div class="intro"><div class="eyebrow">A LITTLE SUNSHINE FOR YOUR EARS</div><h1>GOOD<br><span>DAY</span><br>RADIO.</h1><p>A fictional radio station for slow mornings, open windows and wherever the day takes you.</p><div class="controls"><button id="play">▶ &nbsp; SPIN THE RECORD</button><button id="next">NEXT TRACK ↗</button></div></div><div class="bottom"><span>INDEPENDENT & ALWAYS SUNNY</span><span>VOL. 01</span></div></section><section class="right" id="stage"><div class="sticker">100%<br>GOOD VIBES<br>✳</div><div class="record"><div class="label">CITRUS<br>RADIO</div></div><div class="track"><span id="song">01 / MORNING PEEL</span><span>33⅓ RPM</span></div></section></div><script>let playing=false,n=0;const names=['01 / MORNING PEEL','02 / WINDOW SEAT','03 / GOLDEN HOUR'];document.querySelector('#play').onclick=e=>{playing=!playing;document.querySelector('#stage').classList.toggle('playing',playing);e.currentTarget.textContent=playing?'Ⅱ  PAUSE THE RECORD':'▶  SPIN THE RECORD'};document.querySelector('#next').onclick=()=>{n=(n+1)%names.length;document.querySelector('#song').textContent=names[n]}</script></body></html>
