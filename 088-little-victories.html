<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Victories</title><style>*{box-sizing:border-box}body{margin:0;background:#f4e4c7;color:#65503c;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.center{flex:1;display:grid;place-content:center;text-align:center}.star{font-size:100px;color:#d89a5d}h1{font-size:clamp(65px,9vw,120px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#a89077;max-width:330px;margin:20px auto}input{border:0;border-bottom:1px solid #b99f83;background:transparent;padding:15px;color:#65503c;font:18px Georgia;width:min(90%,350px);outline:none}button{background:#a97450;color:white;border:0;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.note{min-height:30px;font:italic 18px Georgia;margin-top:25px}</style></head><body><div class="wrap"><header><span>LITTLE VICTORIES</span><span>A MOMENT / 088</span></header><main class="center"><div><div class="star">✳</div><small>GIVE YOURSELF CREDIT</small><h1>Small things<br><i>count.</i></h1><p>Name one thing you did today, however small. It deserves a moment of recognition.</p><input id="victory" aria-label="Your small victory" placeholder="Today I..."><br><button id="celebrate">CELEBRATE IT ↗</button><div class="note" id="note" aria-live="polite"></div></div></main><footer><span>ONE STEP IS STILL A STEP</span><span>YOU ARE HERE</span></footer></div><script>document.querySelector('#celebrate').onclick=()=>{let v=document.querySelector('#victory').value.trim();document.querySelector('#note').textContent=v?'A little celebration for: '+v:'Write your small victory first.'}</script></body></html>
