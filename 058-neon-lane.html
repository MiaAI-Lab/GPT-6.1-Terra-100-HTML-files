<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Lane</title><style>*{box-sizing:border-box}body{margin:0;background:#11101e;color:#f6dff2;font-family:Arial,sans-serif}.wrap{min-height:100vh;padding:30px 4vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px monospace;letter-spacing:.2em}.scene{flex:1;min-height:550px;position:relative;overflow:hidden;margin:30px 0;background:linear-gradient(#201435,#552652 70%,#171328)}.grid{position:absolute;bottom:-30%;left:-30%;width:160%;height:65%;background:repeating-linear-gradient(90deg,transparent 0 9%,#fa71d866 9.2% 9.4%),repeating-linear-gradient(0deg,transparent 0 15%,#fa71d866 15.2% 15.4%);transform:perspective(250px) rotateX(55deg)}.sun{position:absolute;width:200px;height:200px;border-radius:50%;background:linear-gradient(#ffbf8c,#ec5da1);left:50%;top:18%;transform:translateX(-50%);box-shadow:0 0 80px #fa75bc88}.copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}h1{font-size:clamp(65px,10vw,140px);line-height:.8;letter-spacing:-.08em;margin:25px 0;text-shadow:0 0 25px #ff6ed8}p{font:12px/1.7 monospace;letter-spacing:.1em}button{background:none;border:1px solid #ffa4e4;color:#fff;padding:15px 22px;font:10px monospace;letter-spacing:.15em;cursor:pointer;margin-top:20px}.alt{filter:hue-rotate(90deg)}@media(max-width:600px){.scene{min-height:70vh}}</style></head><body><div class="wrap"><header><span>NEON LANE</span><span>AFTER DARK / 058</span></header><main class="scene" id="scene"><div class="sun"></div><div class="grid"></div><div class="copy"><small>THE FUTURE IS A FEELING</small><h1>DRIVE<br>INTO<br>THE NIGHT.</h1><p>AN IMAGINARY CITY. AN ENDLESS ROAD.</p><button id="change">CHANGE THE FREQUENCY ↗</button></div></main><footer><span>TRANSMISSION / 01</span><span>LIGHT NEVER SLEEPS</span></footer></div><script>document.querySelector('#change').onclick=()=>document.querySelector('#scene').classList.toggle('alt')</script></body></html>
