<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Wheel</title><style>*{box-sizing:border-box}body{margin:0;background:#f1ede3;color:#363b3a;font-family:Arial,sans-serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.wheel{width:min(70vw,450px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#d97c68 0 60deg,#e2b66e 60deg 120deg,#a9bd8f 120deg 180deg,#81a9a5 180deg 240deg,#8798b2 240deg 300deg,#bf93a7 300deg);margin:auto;position:relative;transition:transform .8s}.wheel:after{content:'';position:absolute;inset:30%;border-radius:50%;background:#f1ede3}h1{font:400 clamp(65px,8vw,115px)/.87 Georgia;letter-spacing:-.06em;margin:25px 0}p{font-size:14px;line-height:1.8;color:#82908a;max-width:300px}button{background:#3e5b52;color:white;border:0;padding:15px 22px;margin-top:20px;font-size:10px;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.wheel{grid-row:1}}</style></head><body><div class="wrap"><header><span>COLOR WHEEL</span><span>PALETTE STUDY / 096</span></header><main class="layout"><section><small>COLORS IN CONVERSATION</small><h1>Turn the<br><i>color.</i></h1><p>Six shades make a circle. Turn it and see a new relationship appear.</p><button id="turn">TURN THE WHEEL ↗</button></section><div class="wheel" id="wheel"></div></main><footer><span>HUE / FORM / BALANCE</span><span>SIX COLORS / ONE CIRCLE</span></footer></div><script>let n=0;document.querySelector('#turn').onclick=()=>{n+=60;document.querySelector('#wheel').style.transform=`rotate(${n}deg)`}</script></body></html>
