<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dusk Garden</title><style>*{box-sizing:border-box}body{margin:0;background:#302a3c;color:#ede1d8;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.garden{aspect-ratio:1;background:linear-gradient(#7b6479,#d39b89);position:relative;overflow:hidden}.sun{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:#f0c7a0;top:20%;left:35%}.plant{position:absolute;bottom:0;left:50%;height:50%;border-left:4px solid #554a54}.plant:before,.plant:after{content:'';position:absolute;width:100px;height:45px;background:#554a54;border-radius:100% 0;bottom:30%;right:0;transform:rotate(25deg)}.plant:after{left:0;right:auto;bottom:55%;transform:rotate(-25deg) scaleX(-1)}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#b9a8b2;max-width:300px}button{background:none;border:1px solid #b9a8b2;color:#ede1d8;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.night{filter:brightness(.6) hue-rotate(30deg)}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.garden{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>DUSK GARDEN</span><span>EVENING STUDY / 093</span></header><main class="layout"><div class="garden" id="garden"><div class="sun"></div><div class="plant"></div></div><section><small>WHEN THE LIGHT SOFTENS</small><h1>The garden<br>at <i>dusk.</i></h1><p>The colors deepen, the air cools, and the day quietly lets go.</p><button id="night">LET NIGHT FALL ↗</button></section></main><footer><span>GARDEN / LIGHT / TIME</span><span>THE LAST HOUR</span></footer></div><script>document.querySelector('#night').onclick=e=>{let n=document.querySelector('#garden').classList.toggle('night');e.currentTarget.textContent=n?'RETURN TO DUSK ↙':'LET NIGHT FALL ↗'}</script></body></html>
