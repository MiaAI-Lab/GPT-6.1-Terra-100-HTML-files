<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horizon Lines</title><style>*{box-sizing:border-box}body{margin:0;background:#ece4d7;color:#5a4d44;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.art{aspect-ratio:1;background:linear-gradient(#e0b9a3 0 25%,#d29b83 25% 45%,#b88178 45% 60%,#8a7778 60% 78%,#657a7d 78%);position:relative}.sun{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:#f0d8b0;top:15%;left:35%;transition:transform .8s}.sun.move{transform:translateY(100px)}h1{font-size:clamp(65px,8vw,115px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#a19186;max-width:300px}button{background:none;border:1px solid #ae9a8c;color:#5a4d44;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>HORIZON LINES</span><span>COLOR STUDY / 089</span></header><main class="layout"><div class="art"><div class="sun" id="sun"></div></div><section><small>WHERE ONE COLOR MEETS ANOTHER</small><h1>Somewhere<br>between<br><i>here and there.</i></h1><p>A landscape reduced to bands of color and a single sun.</p><button id="move">MOVE THE SUN ↗</button></section></main><footer><span>COLOR / LINE / LIGHT</span><span>AN ABSTRACT HORIZON</span></footer></div><script>document.querySelector('#move').onclick=()=>document.querySelector('#sun').classList.toggle('move')</script></body></html>
