<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinetic Rings</title><style>*{box-sizing:border-box}body{margin:0;background:#f0d2c4;color:#764d49;font-family:Arial,sans-serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.stage{flex:1;min-height:500px;display:grid;place-items:center;position:relative;overflow:hidden}.ring{position:absolute;width:45%;aspect-ratio:1;border:20px solid #d98779;border-radius:50%;animation:pulse 4s ease-in-out infinite alternate}.ring:nth-child(2){border-color:#e6a08a;animation-delay:-1.3s}.ring:nth-child(3){border-color:#efbd9c;animation-delay:-2.6s}.title{position:relative;z-index:2;text-align:center}h1{font:400 clamp(60px,9vw,120px)/.85 Georgia;letter-spacing:-.06em;margin:20px 0}button{background:none;border:1px solid #a77369;color:#764d49;padding:15px 22px;margin:0 auto 30px;font-size:10px;letter-spacing:.15em;cursor:pointer}.paused .ring{animation-play-state:paused}@keyframes pulse{to{transform:scale(.5);opacity:.5}}@media(max-width:600px){.ring{width:80%}}@media(prefers-reduced-motion:reduce){.ring{animation:none}}</style></head><body><div class="wrap" id="wrap"><header><span>KINETIC RINGS</span><span>MOTION STUDY / 094</span></header><main class="stage"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="title"><small>FORM IN MOTION</small><h1>In and<br><i>out.</i></h1></div></main><button id="pause">PAUSE THE RINGS &nbsp; Ⅱ</button><footer><span>CIRCLE / COLOR / TIME</span><span>AN ABSTRACT MOMENT</span></footer></div><script>document.querySelector('#pause').onclick=e=>{let p=document.querySelector('#wrap').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME THE RINGS  ▶':'PAUSE THE RINGS  Ⅱ'}</script></body></html>
