<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night Garden</title><style>*{box-sizing:border-box}body{margin:0;background:#171324;color:#eee5d7;font-family:Georgia,serif}main{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}section{padding:clamp(28px,6vw,90px);display:flex;flex-direction:column;justify-content:space-between}.top{font:10px Arial;letter-spacing:.25em;display:flex;justify-content:space-between;color:#c0b5c1}.copy{padding:60px 0}h1{font-weight:400;font-size:clamp(64px,9vw,135px);line-height:.85;letter-spacing:-.06em;margin:25px 0}h1 em{color:#d8b7d0}p{max-width:350px;font:15px/1.8 Arial;color:#c9bac7}.button{background:none;color:#f4e8dc;border:1px solid #ad94a7;border-radius:40px;padding:16px 24px;margin-top:20px;cursor:pointer;font:11px Arial;letter-spacing:.12em}.foot{font:10px Arial;letter-spacing:.15em;color:#ac9eac}.garden{position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#54415c,#252039 60%,#151526)}.halo{position:absolute;inset:13%;border:1px solid #bba3bd55;border-radius:50%;box-shadow:0 0 0 30px #ddc0d008,0 0 0 65px #ddc0d008}.flower{position:absolute;left:50%;top:50%;width:250px;height:250px;transform:translate(-50%,-50%);animation:turn 35s linear infinite}.petal{position:absolute;left:39%;top:4%;width:22%;height:46%;transform-origin:50% 100%;border-radius:80% 80% 45% 45%;background:linear-gradient(#f8d4d0,#bb87ab 70%,#81597f);opacity:.86;box-shadow:inset 0 0 20px #fff5}.petal:nth-child(2){transform:rotate(45deg)}.petal:nth-child(3){transform:rotate(90deg)}.petal:nth-child(4){transform:rotate(135deg)}.petal:nth-child(5){transform:rotate(180deg)}.petal:nth-child(6){transform:rotate(225deg)}.petal:nth-child(7){transform:rotate(270deg)}.petal:nth-child(8){transform:rotate(315deg)}.center{position:absolute;left:43%;top:43%;width:14%;height:14%;background:#e8c78a;border-radius:50%;box-shadow:0 0 24px #e9c89a}.caption{position:absolute;bottom:35px;left:35px;font:10px Arial;letter-spacing:.18em;color:#dbcbdb}.garden.closed .flower{transform:translate(-50%,-50%) scale(.55);opacity:.4;animation:none}.flower{transition:transform 1s,opacity 1s}@keyframes turn{to{transform:translate(-50%,-50%) rotate(360deg)}}@media(max-width:700px){main{grid-template-columns:1fr}.garden{min-height:55vh;grid-row:1}.copy{padding:60px 0}}@media(prefers-reduced-motion:reduce){.flower{animation:none}}</style></head><body><main><section><div class="top"><span>THE NIGHT GARDEN</span><span>BOTANICAL STUDY 01</span></div><div class="copy"><div class="top">A MOMENT TO UNFOLD</div><h1>After<br><em>dark.</em></h1><p>Some things bloom when the world grows quiet. Take a breath, stay a moment, and let the evening unfold.</p><button class="button" id="toggle">CLOSE THE BLOOM &nbsp; ↗</button></div><div class="foot">AN EXERCISE IN SLOWING DOWN &nbsp; ✳</div></section><div class="garden" id="garden"><div class="halo"></div><div class="flower" aria-label="Illustration of a night-blooming flower"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="center"></div></div><div class="caption">NO. 01 &nbsp; / &nbsp; THE MOONFLOWER</div></div></main><script>document.querySelector('#toggle').onclick=e=>{let c=document.querySelector('#garden').classList.toggle('closed');e.currentTarget.textContent=c?'OPEN THE BLOOM  ↗':'CLOSE THE BLOOM  ↗'}</script></body></html>
