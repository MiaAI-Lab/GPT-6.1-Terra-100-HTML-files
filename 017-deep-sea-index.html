<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Sea Index</title><style>*{box-sizing:border-box}body{margin:0;background:#061922;color:#bce9df;font-family:Arial,sans-serif}.shell{min-height:100vh;padding:25px 4vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px monospace;letter-spacing:.15em}header{border-bottom:1px solid #4d8783;padding-bottom:20px}.body{flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:5vw}.copy h1{font-size:clamp(60px,9vw,120px);line-height:.85;letter-spacing:-.08em;margin:25px 0}.copy p{color:#7faea9;line-height:1.7;max-width:310px;font-size:14px}.copy small{font:10px monospace;letter-spacing:.2em}.depth{height:65vh;min-height:400px;position:relative;background:linear-gradient(#1c5960,#081d2a);border:1px solid #50827e;overflow:hidden}.depth:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 49px,#b7e4df22 50px)}.orb{position:absolute;top:40%;left:45%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#d1ffef,#54cdb6 25%,transparent 70%);box-shadow:0 0 80px #36cdb688;transition:top 1s}.scale{position:absolute;left:20px;top:20px;bottom:20px;display:flex;flex-direction:column;justify-content:space-between;font:10px monospace}.readout{position:absolute;right:20px;bottom:20px;font:10px monospace;letter-spacing:.1em}button{background:#afe6d7;color:#0a2528;border:0;padding:15px 22px;font:10px monospace;cursor:pointer;margin-top:20px}@media(max-width:700px){.body{grid-template-columns:1fr;padding:50px 0}.depth{height:50vh;grid-row:1}}</style></head><body><div class="shell"><header><span>DEEP SEA INDEX</span><span>FIELD STATION / 017</span></header><main class="body"><section class="copy"><small>THE OCEAN AFTER LIGHT</small><h1>DOWN<br>INTO THE<br>BLUE.</h1><p>Travel below the surface into a world of pressure, darkness and extraordinary light.</p><button id="dive">DESCEND FURTHER ↓</button></section><div class="depth"><div class="scale"><span>0 M</span><span>500 M</span><span>1000 M</span><span>1500 M</span></div><div class="orb" id="orb"></div><div class="readout" id="readout">DEPTH / 600 M</div></div></main><footer><span>AN IMAGINARY EXPEDITION</span><span>THE QUIET BELOW ↗</span></footer></div><script>let n=0;document.querySelector('#dive').onclick=()=>{n=(n+1)%4;document.querySelector('#orb').style.top=(20+n*20)+'%';document.querySelector('#readout').textContent='DEPTH / '+(300+n*350)+' M'}</script></body></html>
