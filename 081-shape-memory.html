<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shape Memory</title><style>*{box-sizing:border-box}body{margin:0;background:#e7e6dc;color:#3b4946;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.intro{text-align:center;padding:50px 0 30px}h1{font:400 clamp(60px,9vw,110px)/.85 Georgia;letter-spacing:-.06em;margin:20px 0}.intro p{font-size:14px;color:#82928a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:800px;margin:auto}.tile{aspect-ratio:1;background:#b9cdc0;border:0;cursor:pointer;display:grid;place-items:center;font-size:clamp(35px,7vw,70px);color:transparent;transition:background .3s}.tile.open{background:#d9ad96;color:#fff6e4}.status{text-align:center;margin:30px;font-size:10px;letter-spacing:.15em}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header><span>SHAPE MEMORY</span><span>A LITTLE GAME / 081</span></header><div class="intro"><small>LOOK CLOSELY</small><h1>Find the<br><i>pairs.</i></h1><p>Turn two tiles at a time and find the matching shapes.</p></div><main class="grid"><button class="tile" aria-label="Tile 1">●</button><button class="tile" aria-label="Tile 2">◆</button><button class="tile" aria-label="Tile 3">▲</button><button class="tile" aria-label="Tile 4">■</button><button class="tile" aria-label="Tile 5">◆</button><button class="tile" aria-label="Tile 6">●</button><button class="tile" aria-label="Tile 7">■</button><button class="tile" aria-label="Tile 8">▲</button></main><div class="status" id="status" aria-live="polite">0 / 4 PAIRS</div></div><script>let open=[],pairs=0,locked=false;document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{if(locked||t.classList.contains('open'))return;t.classList.add('open');open.push(t);if(open.length===2){if(open[0].textContent===open[1].textContent){pairs++;document.querySelector('#status').textContent=pairs+' / 4 PAIRS';open=[]}else{locked=true;setTimeout(()=>{open.forEach(x=>x.classList.remove('open'));open=[];locked=false},700)}}})</script></body></html>
