<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade Orbit</title><style>*{box-sizing:border-box}body{margin:0;background:#231d3c;color:#f6e7ff;font-family:monospace}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em}.stage{flex:1;min-height:500px;position:relative;display:grid;place-items:center}.orbit{width:min(65vw,450px);aspect-ratio:1;border:3px dashed #b88dec;border-radius:50%;position:absolute;animation:spin 8s linear infinite}.orbit:after{content:'✦';position:absolute;top:10%;left:10%;font-size:50px;color:#ffe073;text-shadow:0 0 20px #ffe073}.center{text-align:center;z-index:1}h1{font:900 clamp(60px,9vw,120px)/.8 Arial;letter-spacing:-.08em;margin:20px 0;color:#ffb8dc;text-shadow:5px 5px #a45bd5}p{font-size:12px;letter-spacing:.1em}button{background:#ffe073;color:#292043;border:0;padding:15px 22px;cursor:pointer;font:10px monospace;letter-spacing:.15em;margin:25px auto}@keyframes spin{to{transform:rotate(360deg)}}.paused{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.orbit{animation:none}}</style></head><body><div class="wrap"><header><span>ARCADE ORBIT</span><span>PLAYER 01 / 068</span></header><main class="stage"><div class="orbit" id="orbit"></div><div class="center"><small>READY, PLAYER?</small><h1>SPIN<br>THE SKY.</h1><p>A LITTLE COSMIC PLAYGROUND</p></div></main><button id="pause">PAUSE ORBIT &nbsp; Ⅱ</button><footer><span>INSERT IMAGINATION</span><span>HIGH SCORE / ∞</span></footer></div><script>document.querySelector('#pause').onclick=e=>{let p=document.querySelector('#orbit').classList.toggle('paused');e.currentTarget.textContent=p?'RESUME ORBIT  ▶':'PAUSE ORBIT  Ⅱ'}</script></body></html>
