<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mountain Post</title><style>*{box-sizing:border-box}body{margin:0;background:#cbd6cd;color:#40564a;font-family:Georgia,serif}.card{max-width:1100px;margin:5vh auto;background:#f6f2e6;padding:20px;box-shadow:0 25px 60px #52675a33}.view{height:50vh;min-height:350px;background:linear-gradient(#b7ceca,#d7dfcf);position:relative;overflow:hidden}.sun{position:absolute;width:100px;height:100px;border-radius:50%;background:#f1e5c7;top:15%;right:20%}.mountain{position:absolute;bottom:0;width:100%;height:70%;background:#9bb3a2;clip-path:polygon(0 100%,0 70%,30% 0,60% 75%,75% 30%,100% 80%,100% 100%)}.mountain.b{height:45%;background:#6e907d;clip-path:polygon(0 100%,0 60%,25% 0,50% 70%,75% 10%,100% 65%,100% 100%)}.caption{display:flex;justify-content:space-between;gap:30px;padding:35px 20px}h1{font-size:clamp(50px,7vw,90px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:0}p{font:14px/1.7 Arial;color:#8b9e90;max-width:300px}button{border:1px solid #8ba195;background:none;color:#40564a;padding:14px 20px;cursor:pointer;font:10px Arial;letter-spacing:.15em}@media(max-width:700px){.card{margin:0;min-height:100vh}.caption{display:block}.caption p{margin:20px 0}}</style></head><body><main class="card"><div class="view"><div class="sun"></div><div class="mountain"></div><div class="mountain b"></div></div><div class="caption"><h1>From the<br><i>mountains.</i></h1><div><p id="note">The air is clear up here. I thought you would like the view.</p><button id="change">TURN THE POSTCARD ↗</button><p>POSTCARD / 097 &nbsp; · &nbsp; SOMEWHERE HIGH UP</p></div></div></main><script>let n=0;const t=['The air is clear up here. I thought you would like the view.','There is a little more room to think among the mountains.'];document.querySelector('#change').onclick=()=>{n=1-n;document.querySelector('#note').textContent=t[n]}</script></body></html>
