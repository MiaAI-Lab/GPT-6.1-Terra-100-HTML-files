<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River Lines</title><style>*{box-sizing:border-box}body{margin:0;background:#e5e8dc;color:#3b5953;font-family:Georgia,serif}.wrap{min-height:100vh;padding:30px 5vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.layout{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center}.art{aspect-ratio:1;background:#a6c3b9;position:relative;overflow:hidden}.line{position:absolute;width:140%;height:50%;left:-20%;border:2px solid #e2eee2;border-radius:50%;top:10%;transform:rotate(-25deg)}.line:nth-child(2){top:20%}.line:nth-child(3){top:30%}.line:nth-child(4){top:40%}.line:nth-child(5){top:50%}.art:after{content:'WATER STUDY / 061';position:absolute;bottom:25px;left:25px;font:10px Arial;letter-spacing:.2em}h1{font-size:clamp(65px,8vw,115px);line-height:.87;letter-spacing:-.06em;font-weight:400;margin:25px 0}p{font:14px/1.8 Arial;color:#819991;max-width:300px}button{background:none;color:#3b5953;border:1px solid #829f94;padding:15px 22px;margin-top:20px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.art.turn{transform:rotate(180deg)}.art{transition:transform 1s}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:50px 0}.art{max-width:450px;width:100%;margin:auto}}</style></head><body><div class="wrap"><header><span>RIVER LINES</span><span>WATER STUDY / 061</span></header><main class="layout"><div class="art" id="art"><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div></div><section><small>THE WAY WATER MOVES</small><h1>Follow<br>the <i>current.</i></h1><p>A few lines can suggest a whole river: always moving, always finding a way.</p><button id="turn">TURN THE CURRENT ↗</button></section></main><footer><span>LINE / FLOW / FORM</span><span>AN OBSERVATION</span></footer></div><script>document.querySelector('#turn').onclick=()=>document.querySelector('#art').classList.toggle('turn')</script></body></html>
