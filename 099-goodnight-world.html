<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goodnight World</title><style>*{box-sizing:border-box}body{margin:0;background:#182338;color:#e9e5d9;font-family:Georgia,serif}.wrap{padding:30px 5vw;min-height:100vh;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;font:10px Arial;letter-spacing:.2em}.center{flex:1;display:grid;place-content:center;text-align:center}.moon{width:180px;height:180px;border-radius:50%;background:#e7dfc8;margin:30px auto;box-shadow:0 0 70px #e6e5cf55;position:relative}.moon:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:#182338;top:-15px;right:-40px}.stars{color:#b9c9d2;letter-spacing:2em;font-size:20px}h1{font-size:clamp(65px,9vw,120px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#a4b4bf;max-width:320px;margin:20px auto}button{background:none;border:1px solid #a8bac0;color:#e9e5d9;padding:15px 22px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.note{min-height:30px;font:italic 18px Georgia;margin-top:20px}</style></head><body><div class="wrap"><header><span>GOODNIGHT WORLD</span><span>EVENING NOTE / 099</span></header><main class="center"><div><div class="stars">✦ · ✧</div><div class="moon"></div><small>THE DAY IS COMPLETE</small><h1>Goodnight,<br><i>world.</i></h1><p>Whatever today held, you can set it down for a while.</p><button id="note">A PARTING THOUGHT ↗</button><div class="note" id="message" aria-live="polite"></div></div></main><footer><span>REST / DREAM / BEGIN AGAIN</span><span>UNTIL TOMORROW</span></footer></div><script>let n=0;const t=['The morning will be here when you are ready.','Let the night hold what you do not need to carry.','Rest is a worthwhile thing to do.'];document.querySelector('#note').onclick=()=>{document.querySelector('#message').textContent=t[n++%3]}</script></body></html>
