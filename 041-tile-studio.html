<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tile Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f1e9da;color:#344f50;font-family:Arial,sans-serif}.wrap{padding:30px 5vw}header{display:flex;justify-content:space-between;border-bottom:1px solid;padding-bottom:20px;font-size:10px;letter-spacing:.2em}.layout{display:grid;grid-template-columns:300px 1fr;gap:5vw;margin-top:50px}.copy h1{font:400 clamp(55px,6vw,90px)/.88 Georgia;letter-spacing:-.06em;margin:25px 0}.copy p{font-size:14px;line-height:1.7;color:#7e9690}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{aspect-ratio:1;background:#d4886e;border:0;cursor:pointer;position:relative;overflow:hidden}.tile:after{content:'';position:absolute;inset:12%;border:3px solid #f6e8ce;border-radius:50% 0 50% 0;transition:transform .4s}.tile.alt{background:#5e8e85}.tile.alt:after{transform:rotate(90deg)}.note{font-size:10px;letter-spacing:.15em;margin-top:25px}@media(max-width:700px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="wrap"><header><span>TILE STUDIO</span><span>PATTERN STUDY / 041</span></header><main class="layout"><section class="copy"><small>MAKE A SMALL PATTERN</small><h1>Play with<br><i>repeat.</i></h1><p>Tap a tile to turn its shape and change its color. Build a pattern one piece at a time.</p><div class="note">A LITTLE GEOMETRY / 4 × 4</div></section><div class="grid"><button class="tile" aria-label="Toggle tile 1"></button><button class="tile" aria-label="Toggle tile 2"></button><button class="tile" aria-label="Toggle tile 3"></button><button class="tile" aria-label="Toggle tile 4"></button><button class="tile" aria-label="Toggle tile 5"></button><button class="tile" aria-label="Toggle tile 6"></button><button class="tile" aria-label="Toggle tile 7"></button><button class="tile" aria-label="Toggle tile 8"></button><button class="tile" aria-label="Toggle tile 9"></button><button class="tile" aria-label="Toggle tile 10"></button><button class="tile" aria-label="Toggle tile 11"></button><button class="tile" aria-label="Toggle tile 12"></button><button class="tile" aria-label="Toggle tile 13"></button><button class="tile" aria-label="Toggle tile 14"></button><button class="tile" aria-label="Toggle tile 15"></button><button class="tile" aria-label="Toggle tile 16"></button></div></main></div><script>document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>t.classList.toggle('alt'))</script></body></html>
