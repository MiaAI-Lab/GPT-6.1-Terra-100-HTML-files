<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Note to Tomorrow</title><style>*{box-sizing:border-box}body{margin:0;background:#c8d8dc;color:#263d42;font-family:Georgia,serif;min-height:100vh;display:grid;place-items:center;padding:25px}.paper{width:min(100%,1000px);background:#f6f2e8;min-height:650px;box-shadow:0 25px 70px #304c5340;display:grid;grid-template-columns:1fr 1fr;position:relative}.paper:before{content:'';position:absolute;inset:14px;border:1px solid #a8b7ae;pointer-events:none}.left,.right{padding:clamp(35px,6vw,80px);position:relative}.left{border-right:1px solid #c5d0c7}.stamp{font:10px Arial;letter-spacing:.2em;color:#758e8a}h1{font-size:clamp(55px,7vw,90px);font-weight:400;line-height:.95;letter-spacing:-.05em;margin:55px 0 25px}p{font:15px/1.7 Arial;color:#71827d}.plane{font-size:100px;transform:rotate(-25deg);color:#708f91;display:inline-block;margin-top:15px}.right{display:flex;flex-direction:column;justify-content:center}label{font:10px Arial;letter-spacing:.2em}textarea{width:100%;height:180px;resize:vertical;border:0;border-bottom:1px solid #91a9a3;background:repeating-linear-gradient(transparent 0 35px,#d2ded6 36px);font:20px/36px Georgia;color:#263d42;outline:none;margin-top:20px}button{margin-top:30px;align-self:flex-start;border:0;background:#355d60;color:#fff;padding:17px 25px;font:10px Arial;letter-spacing:.15em;cursor:pointer}.reply{font:13px/1.5 Arial;min-height:40px;margin-top:20px}.postmark{position:absolute;right:45px;top:45px;width:85px;height:85px;border:2px solid #a0afa7;border-radius:50%;display:grid;place-items:center;text-align:center;font:9px/1.4 Arial;letter-spacing:.1em;transform:rotate(15deg)}@media(max-width:700px){.paper{grid-template-columns:1fr}.left{border-right:0;border-bottom:1px solid #c5d0c7}.postmark{right:30px;top:30px}.right{min-height:400px}h1{margin-top:40px}}</style></head><body><main class="paper"><section class="left"><div class="stamp">A SMALL CORRESPONDENCE &nbsp; / &nbsp; NO. 01</div><h1>A note<br>to <i>tomorrow.</i></h1><p>Leave a little kindness for your future self. Some words are worth coming back to.</p><div class="plane" aria-hidden="true">➤</div></section><section class="right"><div class="postmark">SENT WITH<br>CARE<br>✳</div><label for="note">DEAR FUTURE ME,</label><textarea id="note" placeholder="Write something gentle..."></textarea><button id="save">KEEP THIS NOTE &nbsp; ↗</button><div class="reply" id="reply" aria-live="polite"></div></section></main><script>const n=document.querySelector('#note'),r=document.querySelector('#reply');try{n.value=localStorage.getItem('note-to-tomorrow')||''}catch(e){}document.querySelector('#save').onclick=()=>{if(!n.value.trim()){r.textContent='Write a little something first.';return}try{localStorage.setItem('note-to-tomorrow',n.value);r.textContent='Your note is tucked away in this browser.'}catch(e){r.textContent='Your browser could not save this note.'}}</script></body></html>
