<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morning Pages</title><style>*{box-sizing:border-box}body{margin:0;background:#d7c9bb;color:#51463d;font-family:Georgia,serif}.sheet{max-width:1050px;min-height:85vh;margin:5vh auto;background:#f9f5eb;padding:5vw;box-shadow:0 25px 60px #62544733}header{display:flex;justify-content:space-between;border-bottom:1px solid #c7bbae;padding-bottom:20px;font:10px Arial;letter-spacing:.2em}.layout{display:grid;grid-template-columns:1fr 1.2fr;gap:5vw;margin-top:50px}h1{font-size:clamp(60px,7vw,100px);font-weight:400;line-height:.87;letter-spacing:-.06em;margin:25px 0}p{font:14px/1.8 Arial;color:#9a8a7b;max-width:280px}textarea{width:100%;height:400px;border:0;outline:0;resize:vertical;background:repeating-linear-gradient(transparent 0 39px,#d7cfc2 40px);font:20px/40px Georgia;color:#51463d}button{background:#766554;color:white;border:0;padding:15px 22px;cursor:pointer;font:10px Arial;letter-spacing:.15em;margin-top:20px}.status{font:12px Arial;color:#8c7e6f;min-height:20px}@media(max-width:700px){.sheet{margin:0;min-height:100vh;padding:30px}.layout{grid-template-columns:1fr}textarea{height:280px}}</style></head><body><main class="sheet"><header><span>MORNING PAGES</span><span>A SPACE TO BEGIN / 042</span></header><div class="layout"><section><small>BEFORE THE DAY BEGINS</small><h1>Put it<br>on <i>paper.</i></h1><p>A blank space for whatever is on your mind. Your words stay in this browser when you save them.</p></section><section><textarea id="words" aria-label="Your morning pages" placeholder="Start anywhere..."></textarea><button id="save">SAVE THESE WORDS ↗</button><p class="status" id="status" aria-live="polite"></p></section></div></main><script>const w=document.querySelector('#words');try{w.value=localStorage.getItem('morning-pages')||''}catch(e){}document.querySelector('#save').onclick=()=>{try{localStorage.setItem('morning-pages',w.value);document.querySelector('#status').textContent='Saved in this browser.'}catch(e){document.querySelector('#status').textContent='Saving is unavailable in this browser.'}}</script></body></html>
